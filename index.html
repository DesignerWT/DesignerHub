/* ---------- Visual Brief Editor: data mutation + interaction ---------- */
function getSingleSelectedEl(){
  const vb = BRIEF_DRAFT.visualBrief;
  if(vb.selectedIds.length!==1) return null;
  const page = activeVBPage();
  return page ? page.elements.find(x=>x.element_id===vb.selectedIds[0]) : null;
}
function getElById(id){ const page = activeVBPage(); return page ? page.elements.find(x=>x.element_id===id) : null; }
function snapshotVB(){ return JSON.stringify(BRIEF_DRAFT.visualBrief.pages); }
function pushUndoVB(){
  const vb = BRIEF_DRAFT.visualBrief;
  vb.undoStack.push(snapshotVB());
  if(vb.undoStack.length>60) vb.undoStack.shift();
  vb.redoStack = [];
}
function undoVB(){
  const vb = BRIEF_DRAFT.visualBrief;
  if(!vb.undoStack.length) return;
  vb.redoStack.push(snapshotVB());
  vb.pages = JSON.parse(vb.undoStack.pop());
  if(!vb.pages.find(p=>p.id===vb.activePageId)) vb.activePageId = vb.pages[0]?.id;
  vb.selectedIds = [];
  scheduleAutosave();
  refreshVisualEditor();
}
function redoVB(){
  const vb = BRIEF_DRAFT.visualBrief;
  if(!vb.redoStack.length) return;
  vb.undoStack.push(snapshotVB());
  vb.pages = JSON.parse(vb.redoStack.pop());
  if(!vb.pages.find(p=>p.id===vb.activePageId)) vb.activePageId = vb.pages[0]?.id;
  vb.selectedIds = [];
  scheduleAutosave();
  refreshVisualEditor();
}
function computeFitZoom(){
  const wrap = document.getElementById('vbeCanvasWrap');
  if(!wrap) return 100;
  // Fit against both dimensions of the wrap (now a full-width row, not a narrow grid column) so the
  // whole 960x540 page — top, bottom, left and right — is always visible with no cropping.
  const availW = wrap.clientWidth - 52;
  const availH = wrap.clientHeight - 52;
  const byW = (availW/960)*100;
  const byH = availH>0 ? (availH/540)*100 : byW;
  return Math.max(25, Math.min(100, Math.round(Math.min(byW, byH))));
}
function scheduleAutosave(){
  const vb = BRIEF_DRAFT.visualBrief;
  vb.saveState = 'editing';
  updateAutosavePill();
  if(vb.autosaveTimer) clearTimeout(vb.autosaveTimer);
  vb.autosaveTimer = setTimeout(async ()=>{
    vb.saveState = 'saving'; updateAutosavePill();
    try{ await saveKey('wt_visualbrief_autosave', {pages: vb.pages, mode: BRIEF_DRAFT.mode, savedAt: nowIso(), editingTaskId: STATE.editingTaskId||null}); }catch(e){}
    vb.saveState = 'saved'; updateAutosavePill();
  }, 1500);
}
function updateAutosavePill(){
  const vb = BRIEF_DRAFT.visualBrief;
  const pill = document.querySelector('.vbe-savepill');
  if(!pill) return;
  pill.className = 'vbe-savepill '+vb.saveState;
  pill.textContent = VBE_SAVE_LABEL[vb.saveState]||'● Saved';
}
function refreshVisualEditor(){
  const root = document.getElementById('vbeRoot');
  if(!root) return;
  // Guard against a stale text-edit id surviving a page switch / undo / delete / preview toggle —
  // re-validate it against the currently active page on every render instead of clearing it ad hoc from
  // every possible entry point. Valid targets: an unlocked Text element, or an unlocked non-line Shape.
  if(STATE.vbTextEditId){
    const pg = activeVBPage();
    const elS = pg && pg.elements.find(x=>x.element_id===STATE.vbTextEditId);
    const validShape = elS && elS.type==='shape' && !elS.locked && (elS.style&&elS.style.shape)!=='line';
    const validText = elS && elS.type==='text' && !elS.locked;
    if(!validShape && !validText) STATE.vbTextEditId = null;
  }
  root.innerHTML = renderVisualEditorRoot();
  bindVisualEditor();
  const cbox = document.getElementById('completenessBox');
  if(cbox) cbox.innerHTML = renderBriefCompleteness();
  // computeFitZoom() ran above while renderVBCanvas() was still building an HTML *string* — the
  // canvas-wrap just inserted via innerHTML didn't exist yet, so its measured width/height could be
  // stale (or, on first mount, absent). Correct the transform against the real, just-laid-out box on
  // the next frame so Fit zoom always matches the actual available space (full-width row, collapsed
  // Brief Inputs/Properties, fullscreen, etc.) rather than a one-render-behind guess.
  const vb = BRIEF_DRAFT.visualBrief;
  if(vb.zoom==='fit'){
    requestAnimationFrame(()=>{
      const scaleEl = document.querySelector('.vbe-canvas-scale');
      if(scaleEl) scaleEl.style.transform = `scale(${computeFitZoom()/100})`;
    });
  }
}
function setElStyle(key, value){
  const el = getSingleSelectedEl(); if(!el) return;
  pushUndoVB();
  el.style = el.style||{}; el.style[key]=value; el.updated_at=nowIso();
  // Any font/spacing/padding change can change how the text wraps at the same width — re-measure so a
  // bigger font size (etc.) never re-introduces clipping (§32/33).
  if(el.type==='text') el.height = measureTextElementHeight(el, el.width);
  scheduleAutosave(); refreshVisualEditor();
}
function setElContent(key, value){
  const el = getSingleSelectedEl(); if(!el) return;
  pushUndoVB();
  el.content = el.content||{}; el.content[key]=value; el.updated_at=nowIso();
  scheduleAutosave(); refreshVisualEditor();
}
function setElNumeric(key, value){
  const el = getSingleSelectedEl(); if(!el) return;
  pushUndoVB();
  el[key]=value; el.updated_at=nowIso();
  // Text Box is Fixed Width + Auto Height (§32/33) — typing a new W in Properties reflows the text at
  // that width; the H field is disabled for Text in the Properties panel, but stay defensive here too.
  if(el.type==='text' && key==='width') el.height = measureTextElementHeight(el, el.width);
  else if(el.type==='text' && key==='height') el.height = measureTextElementHeight(el, el.width);
  scheduleAutosave(); refreshVisualEditor();
}
// "Reset to CI Default" — resets *style only* (fill/border/text formatting) back to the CI-driven
// defaults. Deliberately never touches position, size, rotation, lock state or text content.
function resetElStyleToDefault(){
  const el = getSingleSelectedEl(); if(!el) return;
  pushUndoVB();
  if(el.type==='shape'){
    el.style = Object.assign({}, el.style, CI_DEFAULT_SHAPE_STYLE(), {shape:(el.style&&el.style.shape)||'rect'});
  } else if(el.type==='text' || el.type==='note'){
    el.style = Object.assign({}, el.style, {
      fontFamily:'inherit', fontSize:14, fontWeight:400, bold:false, align:'left',
      color:'#0F172A', lineHeight:1.4, letterSpacing:0, textPadding:4,
    });
  } else if(el.type==='image'){
    el.style = Object.assign({}, el.style, {objectFit:'cover', opacity:1});
  }
  el.updated_at = nowIso();
  scheduleAutosave(); refreshVisualEditor();
  toast('↺ รีเซ็ตสไตล์เป็นค่าเริ่มต้น CI แล้ว');
}
function applyTextCommand(cmd){
  const vb = BRIEF_DRAFT.visualBrief;
  if(vb.selectedIds.length!==1) return;
  const node = document.querySelector(`[data-textedit="${vb.selectedIds[0]}"]`);
  const el = getSingleSelectedEl();
  if(!node || !el) return;
  pushUndoVB();
  node.focus();
  document.execCommand(cmd, false, null);
  el.content.html = node.innerHTML; el.updated_at = nowIso();
  scheduleAutosave();
}
function duplicateSelectedVB(){
  const vb = BRIEF_DRAFT.visualBrief; const page = activeVBPage();
  const sel = vb.selectedIds.map(id=>page.elements.find(x=>x.element_id===id)).filter(Boolean);
  if(!sel.length) return;
  pushUndoVB();
  const maxZ = Math.max(0,...page.elements.map(e=>e.z_index||0));
  const clones = sel.map((el,i)=>{
    const c = JSON.parse(JSON.stringify(el));
    c.element_id = uidShort('el'); c.x+=20; c.y+=20; c.created_at=nowIso(); c.updated_at=nowIso(); c.z_index=maxZ+1+i;
    return c;
  });
  page.elements.push(...clones);
  vb.selectedIds = clones.map(c=>c.element_id);
  scheduleAutosave(); refreshVisualEditor();
}
function deleteSelectedVB(){
  const vb = BRIEF_DRAFT.visualBrief; const page = activeVBPage();
  if(!page || !vb.selectedIds.length) return;
  pushUndoVB();
  page.elements = page.elements.filter(e=>!vb.selectedIds.includes(e.element_id));
  vb.selectedIds = [];
  scheduleAutosave(); refreshVisualEditor();
}
function copySelectedVB(){
  const vb = BRIEF_DRAFT.visualBrief; const page = activeVBPage();
  const sel = vb.selectedIds.map(id=>page.elements.find(x=>x.element_id===id)).filter(Boolean);
  if(sel.length) vb.clipboard = JSON.parse(JSON.stringify(sel));
}
function pasteVB(){
  const vb = BRIEF_DRAFT.visualBrief; const page = activeVBPage();
  if(!vb.clipboard || !vb.clipboard.length || !page) return;
  pushUndoVB();
  const maxZ = Math.max(0,...page.elements.map(e=>e.z_index||0));
  const newIds = [];
  vb.clipboard.forEach((src,i)=>{
    const c = JSON.parse(JSON.stringify(src));
    c.element_id = uidShort('el'); c.page_id = page.id; c.x+=20; c.y+=20; c.created_at=nowIso(); c.updated_at=nowIso(); c.z_index=maxZ+1+i;
    page.elements.push(c); newIds.push(c.element_id);
  });
  vb.selectedIds = newIds;
  scheduleAutosave(); refreshVisualEditor();
}
// "+ Add Page" always creates a blank page immediately — the old popover for picking a page
// template (Content/KV/Product/Artwork/Layout/Note) was removed per the Page Management redesign.
function addVisualPage(){
  const vb = BRIEF_DRAFT.visualBrief;

/* ---------- Visual Brief Editor: Image Crop Tool (Master Dev Spec §35/§36) ----------
   Non-destructive: el.content.dataUrl (the original upload) is never touched; a crop is stored as a
   normalized {x,y,w,h} rectangle in el.content.crop and applied purely at render time (see
   renderImageBlockHTML). This modal lets the user pick a preset aspect ratio, resize the crop Frame,
   pan the Image behind it and Zoom, with the area outside the Frame dimmed — then Apply computes the
   final crop rect from that pan/zoom/frame state, Cancel discards it, or Reset restores the initial
   "whole image, centered" view without closing the modal. */
const VB_CROP_PRESETS = [
  {k:'free', l:'Free', ratio:null},
  {k:'original', l:'Original', ratio:null},
  {k:'1:1', l:'1:1', ratio:1},
  {k:'4:5', l:'4:5', ratio:4/5},
  {k:'16:9', l:'16:9', ratio:16/9},
  {k:'9:16', l:'9:16', ratio:9/16},

const VB_CROP_STAGE = 380;
function openImageCropModal(elId){
  const el = getElById(elId);
  if(!el || el.type!=='image' || !el.content || !el.content.dataUrl) return;
  const img = new Image();
  img.onload = ()=>{
    const naturalW = img.naturalWidth||1, naturalH = img.naturalHeight||1;
    const existing = el.content.crop;
    STATE.vbImgCrop = { elId, naturalW, naturalH, preset:'original', zoom:1, imgX:0, imgY:0, frameW:0, frameH:0, frameX:0, frameY:0, baseScale:1 };
    setVBCropPreset(existing ? (existing.presetHint||'original') : 'original', existing);
    refreshImageCropOverlay();
  };
  img.onerror = ()=>{ toast('โหลดรูปไม่สำเร็จ'); };
  img.src = el.content.dataUrl;
}
function closeImageCropModal(){ STATE.vbImgCrop=null; clearOverlay(); }
// (Re)computes the Frame size for a preset and resets Image pan/zoom so the Frame is fully covered and
// centered — this is also what the in-modal "Reset" button calls. `fromCrop` is only used once, right
// when the modal opens, to solve pan/zoom backwards from whatever crop is already applied so re-opening
// Crop Mode shows exactly what's currently on Canvas instead of a blank reset view.
function setVBCropPreset(presetKey, fromCrop){
  const cs = STATE.vbImgCrop; if(!cs) return;
  const el = getElById(cs.elId);
  const preset = VB_CROP_PRESETS.find(p=>p.k===presetKey) || VB_CROP_PRESETS[0];
  let ratio = preset.ratio;
  if(presetKey==='original') ratio = cs.naturalW/cs.naturalH;
  if(presetKey==='free') ratio = (cs.frameW && cs.frameH) ? cs.frameW/cs.frameH : (el.width/el.height);
  const margin = 20;
  const maxDim = VB_CROP_STAGE - margin*2;
  let frameW, frameH;
  if(ratio>=1){ frameW=maxDim; frameH=maxDim/ratio; } else { frameH=maxDim; frameW=maxDim*ratio; }
  cs.preset = presetKey;
  cs.frameW = frameW; cs.frameH = frameH;
  cs.frameX = (VB_CROP_STAGE-frameW)/2; cs.frameY = (VB_CROP_STAGE-frameH)/2;
  const baseScale = Math.max(VB_CROP_STAGE/cs.naturalW, VB_CROP_STAGE/cs.naturalH);
  cs.baseScale = baseScale;
  if(fromCrop && fromCrop.w>0 && fromCrop.h>0){
    const zoom = Math.max(1, frameW/(fromCrop.w*cs.naturalW*baseScale));
    const effScale = baseScale*zoom;
    cs.zoom = zoom;
    cs.imgX = cs.frameX - fromCrop.x*cs.naturalW*effScale;
    cs.imgY = cs.frameY - fromCrop.y*cs.naturalH*effScale;
  } else {
    cs.zoom = 1;
    const dispW = cs.naturalW*baseScale, dispH = cs.naturalH*baseScale;
    cs.imgX = (VB_CROP_STAGE-dispW)/2; cs.imgY = (VB_CROP_STAGE-dispH)/2;
  }
  clampVBCropPan(cs);
}
function clampVBCropPan(cs){
  const effScale = cs.baseScale*cs.zoom;
  const dispW = cs.naturalW*effScale, dispH = cs.naturalH*effScale;
  // The Frame must always be fully covered by the Image — no dimmed gaps inside the crop itself.
  const minX = cs.frameX+cs.frameW-dispW, maxX = cs.frameX;
  const minY = cs.frameY+cs.frameH-dispH, maxY = cs.frameY;
  cs.imgX = Math.min(maxX, Math.max(minX, cs.imgX));
  cs.imgY = Math.min(maxY, Math.max(minY, cs.imgY));
}
function refreshImageCropOverlay(){

  const effScale = cs.baseScale*cs.zoom;

  mountOverlay(`<div class="modal-bg" id="vbCropBg">
    <div class="modal" style="position:relative;max-width:${VB_CROP_STAGE+80}px">

        <img id="vbCropImg" src="${el.content.dataUrl}" draggable="false" style="position:absolute;left:${cs.imgX}px;top:${cs.imgY}px;width:${dispW}px;height:${dispH}px;pointer-events:none;user-select:none">
        <div class="vbcrop-dim" style="position:absolute;left:0;top:0;right:0;height:${cs.frameY}px;background:rgba(0,0,0,.62)"></div>
        <div class="vbcrop-dim" style="position:absolute;left:0;top:${cs.frameY+cs.frameH}px;right:0;bottom:0;background:rgba(0,0,0,.62)"></div>
        <div class="vbcrop-dim" style="position:absolute;left:0;top:${cs.frameY}px;width:${cs.frameX}px;height:${cs.frameH}px;background:rgba(0,0,0,.62)"></div>
        <div class="vbcrop-dim" style="position:absolute;left:${cs.frameX+cs.frameW}px;top:${cs.frameY}px;right:0;height:${cs.frameH}px;background:rgba(0,0,0,.62)"></div>
        <div id="vbCropFrame" style="position:absolute;left:${cs.frameX}px;top:${cs.frameY}px;width:${cs.frameW}px;height:${cs.frameH}px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);cursor:move">
          <div class="vbe-resize-handle vbe-rh-nw" data-croprh="nw" style="cursor:nwse-resize"></div>
          <div class="vbe-resize-handle vbe-rh-ne" data-croprh="ne" style="cursor:nesw-resize"></div>

        <label style="margin-bottom:3px">Zoom</label>

      </div>
      <div class="hint" style="margin-top:6px">ลากรูปเพื่อจัดตำแหน่ง (Drag Image) · ลากมุมกรอบเพื่อปรับขนาด (Resize Frame) · พื้นที่มืดจะไม่ถูกเก็บ (Dim Outside Crop)</div>
      <div class="btnrow" style="margin-top:14px;justify-content:flex-end">
        <button type="button" class="btn btn-ghost btn-sm" id="vbCropResetBtn">↺ Reset</button>
        <button type="button" class="btn btn-ghost btn-sm" id="vbCropCancelBtn">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" id="vbCropApplyBtn">✓ Apply</button>
      </div>
    </div>
  </div>`);
  bindImageCropOverlay();
}
function bindImageCropOverlay(){
  const cs = STATE.vbImgCrop; if(!cs) return;
  document.getElementById('vbCropClose')?.addEventListener('click', closeImageCropModal);
  document.getElementById('vbCropCancelBtn')?.addEventListener('click', closeImageCropModal);
  document.getElementById('vbCropBg')?.addEventListener('click', e=>{ if(e.target.id==='vbCropBg') closeImageCropModal(); });
  document.querySelectorAll('[data-cropfreset]').forEach(b=>b.onclick=()=>{
    setVBCropPreset(b.dataset.cropfreset);
    refreshImageCropOverlay();
  });
  document.getElementById('vbCropResetBtn')?.addEventListener('click', ()=>{
    setVBCropPreset(cs.preset);
    refreshImageCropOverlay();
  });
  document.getElementById('vbCropZoom')?.addEventListener('input', e=>{
    const newZoom = Math.max(1, Math.min(4, Number(e.target.value)||1));
    // Zoom around the Frame's own center so zooming in/out feels anchored to the crop, not the corner.
    const oldEff = cs.baseScale*cs.zoom;
    const cxN = (cs.frameX+cs.frameW/2 - cs.imgX) / oldEff;
    const cyN = (cs.frameY+cs.frameH/2 - cs.imgY) / oldEff;
    cs.zoom = newZoom;
    const newEff = cs.baseScale*cs.zoom;
    cs.imgX = (cs.frameX+cs.frameW/2) - cxN*newEff;
    cs.imgY = (cs.frameY+cs.frameH/2) - cyN*newEff;
    clampVBCropPan(cs);
    refreshImageCropOverlay();
  });
  // Drag Image — mousedown inside the Frame (not on a resize handle) pans the image beneath it.
  const frame = document.getElementById('vbCropFrame');
  frame?.addEventListener('mousedown', e=>{
    if(e.target.closest('[data-croprh]')) return;
    e.preventDefault();
    const startX=e.clientX, startY=e.clientY, ox=cs.imgX, oy=cs.imgY;
    function onMove(ev){
      cs.imgX = ox + (ev.clientX-startX);
      cs.imgY = oy + (ev.clientY-startY);
      clampVBCropPan(cs);
      const imgNode = document.getElementById('vbCropImg');
      if(imgNode){ imgNode.style.left=cs.imgX+'px'; imgNode.style.top=cs.imgY+'px'; }
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // chosen aspect ratio locked while resizing.
  document.querySelectorAll('[data-croprh]').forEach(h=>{
    h.addEventListener('mousedown', e=>{
      e.preventDefault(); e.stopPropagation();
      const handle = h.dataset.croprh;
      const startX=e.clientX, startY=e.clientY;
      const orig = {x:cs.frameX, y:cs.frameY, w:cs.frameW, h:cs.frameH};
      const ratio = cs.preset==='free' ? null : orig.w/orig.h;
      function onMove(ev){

        let {x,y,w,h}=orig;
        if(handle.includes('e')) w=Math.max(40, orig.w+dx);

        if(ratio){

          if(handle.includes('s')) h=Math.max(40, orig.h+dy);

        cs.frameX=x; cs.frameY=y; cs.frameW=w; cs.frameH=h;
        clampVBCropPan(cs);
        refreshImageCropOverlay();
      }
      function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
  document.getElementById('vbCropApplyBtn')?.addEventListener('click', applyImageCropFromState);
}
function applyImageCropFromState(){
  const cs = STATE.vbImgCrop; if(!cs) return;
  const el = getElById(cs.elId); if(!el){ closeImageCropModal(); return; }
  const effScale = cs.baseScale*cs.zoom;
  const dispW = cs.naturalW*effScale, dispH = cs.naturalH*effScale;
  const crop = {
    x: Math.max(0, Math.min(1, (cs.frameX-cs.imgX)/dispW)),
    y: Math.max(0, Math.min(1, (cs.frameY-cs.imgY)/dispH)),
    w: Math.max(0.01, Math.min(1, cs.frameW/dispW)),
    h: Math.max(0.01, Math.min(1, cs.frameH/dispH)),
    presetHint: cs.preset,
  };
  pushUndoVB();
  el.content = el.content||{};
  el.content.crop = crop;
  el.height = Math.round(el.width * (cs.frameH/cs.frameW));

  closeImageCropModal();

  refreshVisualEditor();

// Image Insert — Default Preview Size (Master Dev Spec §34): every insertion path (Upload / Drag & Drop
// from the Images panel / Reference Image "+ Canvas") must place the image as large as fits the page —
// scaled so it fills ~86% of the 960x540 canvas on whichever axis constrains it first — keeping its real
// aspect ratio, centered on the page. It must never start as a small fixed-size thumbnail (the old
// hardcoded 240x160/280x180 boxes below), and a small/low-res source image is scaled UP to fill the page
// just the same as a large one — "as large as appropriate for the Page", not "as large as the file already is".
function fitImageSizeToPage(dataUrl){
  return new Promise(resolve=>{
    const CW=960, CH=540, TARGET=0.86; // ~86% of the page on the constraining axis, per the 80-90% spec range
    const fallback = ()=>{
      const width=280, height=180;
      resolve({width, height, x:Math.round((CW-width)/2), y:Math.round((CH-height)/2)});
    };
    if(!dataUrl){ fallback(); return; }
    const img = new Image();
    img.onload = ()=>{
      const naturalW = img.naturalWidth||1, naturalH = img.naturalHeight||1;
      const maxW = CW*TARGET, maxH = CH*TARGET;
      const scale = Math.min(maxW/naturalW, maxH/naturalH);
      const width = Math.max(20, Math.round(naturalW*scale));
      const height = Math.max(20, Math.round(naturalH*scale));
      resolve({width, height, x:Math.round((CW-width)/2), y:Math.round((CH-height)/2)});
    };
    img.onerror = fallback;
    img.src = dataUrl;
  });
}

function vbCheckSnap(nx, ny, w, h){
  const CW=960, CH=540, T=6; let guides=[];
  const cx=nx+w/2, cy=ny+h/2;
  if(Math.abs(cx-CW/2)<T){ nx=CW/2-w/2; guides.push({type:'v',pos:CW/2}); }
  if(Math.abs(cy-CH/2)<T){ ny=CH/2-h/2; guides.push({type:'h',pos:CH/2}); }
  if(Math.abs(nx)<T){ nx=0; guides.push({type:'v',pos:0}); }
  if(Math.abs(nx+w-CW)<T){ nx=CW-w; guides.push({type:'v',pos:CW}); }
  if(Math.abs(ny)<T){ ny=0; guides.push({type:'h',pos:0}); }
  if(Math.abs(ny+h-CH)<T){ ny=CH-h; guides.push({type:'h',pos:CH}); }
  return {nx, ny, guides};
}
function vbRenderGuides(guides){
  const layer = document.getElementById('vbeGuideLayer');
  if(!layer) return;
  layer.innerHTML = (guides||[]).map(g=>g.type==='v' ? `<div class="vbe-guide v" style="left:${g.pos}px"></div>` : `<div class="vbe-guide h" style="top:${g.pos}px"></div>`).join('');
}

  const nodes = elIds.map(id=>document.querySelector(`.vbe-el[data-elid="${id}"]`));
  let moved=false;
  document.body.classList.add('vb-dragging');
  function onMove(ev){
    const dx=(ev.clientX-startX)/scale, dy=(ev.clientY-startY)/scale;
    if(Math.abs(dx)>1 || Math.abs(dy)>1) moved=true;
    if(origins.length===1){
      const o=origins[0]; const snap = vbCheckSnap(o.x+dx, o.y+dy, o.w, o.h);
      nodes[0].style.left=snap.nx+'px'; nodes[0].style.top=snap.ny+'px';
      vbRenderGuides(snap.guides);
    } else {
      origins.forEach((o,i)=>{ nodes[i].style.left=(o.x+dx)+'px'; nodes[i].style.top=(o.y+dy)+'px'; });
    }
  }
  function onUp(ev){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.classList.remove('vb-dragging');
    vbRenderGuides([]);
    if(!moved) return;
    const dx=(ev.clientX-startX)/scale, dy=(ev.clientY-startY)/scale;
    pushUndoVB();
    if(origins.length===1){
      const o=origins[0]; const snap = vbCheckSnap(o.x+dx, o.y+dy, o.w, o.h);
      const el=page.elements.find(x=>x.element_id===o.id);
      el.x=Math.round(snap.nx); el.y=Math.round(snap.ny); el.updated_at=nowIso();
    } else {
      origins.forEach(o=>{ const el=page.elements.find(x=>x.element_id===o.id); el.x=Math.round(o.x+dx); el.y=Math.round(o.y+dy); el.updated_at=nowIso(); });
    }
    scheduleAutosave();
    refreshVisualEditor();
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}
function startVBResize(e, elId, handle){
  const vb = BRIEF_DRAFT.visualBrief; const page = activeVBPage();
  const el = page.elements.find(x=>x.element_id===elId);
  if(!el || el.locked) return;
  const scale = vbZoomScale();
  const startX=e.clientX, startY=e.clientY;
  const orig = {x:el.x, y:el.y, w:el.width, h:el.height};
  const node = document.querySelector(`.vbe-el[data-elid="${elId}"]`);
  function compute(ev){
    const dx=(ev.clientX-startX)/scale, dy=(ev.clientY-startY)/scale;
    let {x,y,w,h}=orig;
    if(handle.includes('e')) w=Math.max(20, orig.w+dx);
    if(handle.includes('w')){ w=Math.max(20, orig.w-dx); x=orig.x+orig.w-w; }
    if(el.type==='text'){
      // Text Box Resize Behavior (§33): dragging a handle only ever changes WIDTH — height is never
      // user-draggable, it's recalculated live from the wrapped content at the new width every tick, so
      // the Selection Border always matches the real (never-clipped) size, both mid-drag and after.
      h = measureTextElementHeight(el, w);
      if(handle.includes('n')) y = orig.y+orig.h-h; // keep the bottom edge anchored when dragging a top handle
    } else {
      if(handle.includes('s')) h=Math.max(20, orig.h+dy);
      if(handle.includes('n')){ h=Math.max(20, orig.h-dy); y=orig.y+orig.h-h; }
    }
    return {x,y,w,h};
  }
  function onMove(ev){
    const r = compute(ev);
    node.style.left=r.x+'px'; node.style.top=r.y+'px'; node.style.width=r.w+'px'; node.style.height=r.h+'px';
  }
  function onUp(ev){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    const r = compute(ev);
    pushUndoVB();
    el.x=Math.round(r.x); el.y=Math.round(r.y); el.width=Math.round(r.w); el.height=Math.round(r.h); el.updated_at=nowIso();
    scheduleAutosave();
    refreshVisualEditor();
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}
function onVBCanvasMouseDown(e){
  const vb = BRIEF_DRAFT.visualBrief;
  const handle = e.target.closest('[data-rh]');
  const elWrap = e.target.closest('.vbe-el');
  if(handle && elWrap){ e.preventDefault(); startVBResize(e, elWrap.dataset.elid, handle.dataset.rh); return; }
  if(elWrap){
    const elId = elWrap.dataset.elid;
    const page = activeVBPage();
    const elData = page.elements.find(x=>x.element_id===elId);
    if(!elData) return;
    const isTextTarget = !!e.target.closest('[contenteditable]');
    if(e.shiftKey){
      if(vb.selectedIds.includes(elId)) vb.selectedIds = vb.selectedIds.filter(id=>id!==elId);
      else vb.selectedIds.push(elId);
      refreshVisualEditor();
      return;
    }
    if(!vb.selectedIds.includes(elId)){ vb.selectedIds=[elId]; refreshVisualEditor(); }
    if(elData.locked || isTextTarget) return;
    e.preventDefault();
    startVBMove(e, vb.selectedIds.slice());
  }
}

/* ---------- Visual Brief Editor: event binding ---------- */
function bindVisualEditor(){
  const vb = BRIEF_DRAFT.visualBrief;
  const root = document.getElementById('vbeRoot');
  if(!root) return;

  document.getElementById('vbPreviewBtn')?.addEventListener('click', ()=>{ vb.preview=!vb.preview; STATE.vbTextEditId=null; STATE.vbColorPicker=null; refreshVisualEditor(); });
  document.getElementById('vbFullscreenBtn')?.addEventListener('click', ()=>{ vb.fullscreen=!vb.fullscreen; STATE.vbTextEditId=null; STATE.vbColorPicker=null; refreshVisualEditor(); });
  document.getElementById('vbBackBtn')?.addEventListener('click', ()=>{ vb.fullscreen=false; refreshVisualEditor(); });
  // Brief Inputs / Properties collapse — frees vertical space for the Canvas once the requester is done typing.
  document.getElementById('vbInputsCollapseBtn')?.addEventListener('click', ()=>{ STATE.vbInputsCollapsed = !STATE.vbInputsCollapsed; refreshVisualEditor(); });
  document.getElementById('vbPropsCollapseBtn')?.addEventListener('click', ()=>{ STATE.vbPropsCollapsed = !STATE.vbPropsCollapsed; refreshVisualEditor(); });

  // Brief Inputs panel — Header / Sub-header / Detail / Reference Link auto-sync straight into the
  // Canvas's Brief Summary block (targeted patch only, so focus never drops while typing).
  bindUploadGrid();
  document.getElementById('f_header')?.addEventListener('input', e=>{
    BRIEF_DRAFT.header = e.target.value;
    syncSummaryBlocksInPlace(); scheduleAutosave(); updateBriefReadiness();
  });
  document.getElementById('f_subheader')?.addEventListener('input', e=>{
    BRIEF_DRAFT.subheader = e.target.value;
    syncSummaryBlocksInPlace(); scheduleAutosave();
  });
  document.getElementById('f_detail')?.addEventListener('input', e=>{
    BRIEF_DRAFT.detail = e.target.value;
    syncSummaryBlocksInPlace(); scheduleAutosave(); updateBriefReadiness();
  });
  document.getElementById('f_brieflink')?.addEventListener('input', e=>{
    BRIEF_DRAFT.brieflink = e.target.value;
    syncSummaryBlocksInPlace(); scheduleAutosave(); updateBriefReadiness();
  });
  // CTA / Disclaimer — plain brief-content fields, same autosave pattern as Header/Sub-header/Detail.
  // They don't feed the Visual Brief Summary block (no syncSummaryBlocksInPlace call needed).
  document.getElementById('f_cta')?.addEventListener('input', e=>{
    BRIEF_DRAFT.cta = e.target.value;
    scheduleAutosave();
  });
  document.getElementById('f_disclaimer')?.addEventListener('input', e=>{
    BRIEF_DRAFT.disclaimer = e.target.value;
    scheduleAutosave();
  });

  document.querySelectorAll('[data-vbadd]').forEach(b=>b.onclick=()=>{
    const t = b.dataset.vbadd;
    // Toolbar is now Text / Image / Shape only (per redesign spec). Product / Reference / Link / Note /
    // Brief Field no longer have toolbar buttons — those helpers stay defined for Add Page templates
    // and old saved data, just unreachable from here now.
    if(t==='image'){ triggerVBImageAdd(); return; }
    pushUndoVB();
    let el;
    if(t==='text'){
      el = newVisualElement('text',{width:220,height:70,content:{html:'Double-click to edit text'},style:{fontSize:14,align:'left',color:'#0F172A',lineHeight:1.4,bold:false}});
      el.height = measureTextElementHeight(el, el.width); // Fixed Width + Auto Height from the moment it's created (§32)
    }
    else if(t==='shape') el = newVisualElement('shape',{width:200,height:120,content:{html:''},style:CI_DEFAULT_SHAPE_STYLE()});
    activeVBPage().elements.push(el);
    vb.selectedIds=[el.element_id];
    scheduleAutosave();
    refreshVisualEditor();
  });

  document.getElementById('vbUndoBtn')?.addEventListener('click', undoVB);
  document.getElementById('vbRedoBtn')?.addEventListener('click', redoVB);
  document.querySelectorAll('[data-vbzoom]').forEach(b=>b.onclick=()=>{
    const z = b.dataset.vbzoom;
    vb.zoom = z==='fit' ? 'fit' : Number(z);
    refreshVisualEditor();
  });

  document.querySelectorAll('[data-vbpage]').forEach(el=>el.onclick=()=>{ vb.activePageId=el.dataset.vbpage; vb.selectedIds=[]; STATE.vbTextEditId=null; STATE.vbColorPicker=null; refreshVisualEditor(); });
  document.querySelectorAll('[data-vbpagemenu]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); STATE.vbPageMenuOpenFor = STATE.vbPageMenuOpenFor===b.dataset.vbpagemenu?null:b.dataset.vbpagemenu; refreshVisualEditor(); });
  document.querySelectorAll('[data-vbpageact]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const [action,pid] = b.dataset.vbpageact.split('|');
    const p = vb.pages.find(x=>x.id===pid);
    STATE.vbPageMenuOpenFor = null;
    if(!p){ refreshVisualEditor(); return; }
    // Page ⋮ menu is Duplicate/Delete only now — reordering is done by dragging a page thumbnail
    // (data-dragpage below), and renaming via the "Page name" field in Properties.
    if(action==='duplicate'){
      // Deep-clones the whole page object (elements/text/images/shapes/position/size/style/
      // background/canvas settings all live on this one object), so nothing is left behind.
      pushUndoVB();
      const idx = vb.pages.indexOf(p);
      const clone = JSON.parse(JSON.stringify(p));
      clone.id = uidShort('pg'); clone.name = p.name+' (Copy)';
      clone.elements.forEach(el2=>{ el2.element_id=uidShort('el'); el2.page_id=clone.id; });
      vb.pages.splice(idx+1,0,clone);
      vb.activePageId = clone.id;
      scheduleAutosave();
    } else if(action==='delete'){
      deleteVBPage(pid);
      return;
    }
    refreshVisualEditor();
  });
  document.getElementById('vbAddPageBtn')?.addEventListener('click', ()=>addVisualPage());
  let dragSrcPage = null;
  document.querySelectorAll('[data-dragpage]').forEach(row=>{
    row.addEventListener('dragstart', ()=>{ dragSrcPage = row.dataset.dragpage; row.classList.add('dragging'); });
    row.addEventListener('dragend', ()=>row.classList.remove('dragging'));
    row.addEventListener('dragover', e=>e.preventDefault());
    row.addEventListener('drop', e=>{
      e.preventDefault();
      const targetId = row.dataset.dragpage;
      if(!dragSrcPage || dragSrcPage===targetId) return;
      pushUndoVB();
      const list = vb.pages;
      const srcIdx = list.findIndex(p=>p.id===dragSrcPage), tgtIdx = list.findIndex(p=>p.id===targetId);
      if(srcIdx===-1||tgtIdx===-1) return;
      const [moved] = list.splice(srcIdx,1);
      list.splice(tgtIdx,0,moved);
      scheduleAutosave();
      dragSrcPage=null;
      refreshVisualEditor();
    });
  });

  const canvas = document.getElementById('vbeCanvas');
  if(canvas){
    canvas.addEventListener('mousedown', onVBCanvasMouseDown);
    canvas.addEventListener('click', e=>{ if(e.target===canvas){ vb.selectedIds=[]; refreshVisualEditor(); } });
    canvas.addEventListener('dragover', e=>{ if(e.dataTransfer.types.includes('text/vb-attachment')) e.preventDefault(); });
    canvas.addEventListener('drop', async e=>{
      const attId = e.dataTransfer.getData('text/vb-attachment');
      const att = BRIEF_DRAFT.attachments.find(a=>a.id===attId);
      const page = activeVBPage();
      if(!att || !page) return;
      e.preventDefault();
      // Drag & Drop onto the Canvas gets the same page-filling default size/position as every other
      // insertion path (§34) — not a small fixed box placed under the cursor.
      const fit = await fitImageSizeToPage(att.dataUrl);
      pushUndoVB();
      const el = newVisualElement('image', {x:fit.x, y:fit.y, width:fit.width, height:fit.height, content:{dataUrl:att.dataUrl}, style:{objectFit:'cover'}});
      page.elements.push(el);
      vb.selectedIds=[el.element_id];
      scheduleAutosave();
      refreshVisualEditor();
    });
  }
  document.querySelectorAll('[data-textedit]').forEach(node=>{
    node.addEventListener('mousedown', e=>e.stopPropagation());
    // Text Resize Behavior (§33): while actively typing into a Text element, reflow the box height in
    // real time (direct DOM patch, no refreshVisualEditor() — a full re-render here would drop focus/
    // caret mid-keystroke). The committed state (el.height) is only written at blur, below.
    node.addEventListener('input', ()=>{
      const elLive = getElById(node.dataset.textedit);
      if(!elLive || elLive.type!=='text') return;
      const wrap = node.closest('.vbe-el');
      if(!wrap) return;
      const h = measureTextElementHeight({style:elLive.style, content:{html:node.innerHTML}}, elLive.width);
      wrap.style.height = h+'px';
    });
    node.addEventListener('blur', ()=>{
      const el = getElById(node.dataset.textedit);
      if(!el) return;
      const newHtml = node.innerHTML;
      const contentChanged = el.content.html !== newHtml;
      // Text Box — Fix Text Clipping (§32): commit the final Auto Height for the saved content so the
      // persisted state (and every future re-render) always matches what was shown live while typing.
      const newHeight = el.type==='text' ? measureTextElementHeight({style:el.style, content:{html:newHtml}}, el.width) : el.height;
      const heightChanged = el.type==='text' && el.height !== newHeight;
      if(contentChanged || heightChanged){
        pushUndoVB();
        el.content.html = newHtml;
        if(heightChanged) el.height = newHeight;
        el.updated_at = nowIso();
        scheduleAutosave();
      }
      // A Shape's inline text (or a standalone Text element) is only contenteditable while it's the
      // active double-click-to-edit target — losing focus (click elsewhere, Escape, page switch) exits
      // edit mode back to normal select/drag.
      if(STATE.vbTextEditId===node.dataset.textedit){
        STATE.vbTextEditId = null;
        refreshVisualEditor();
      }
    });
  });
  // Double-click an Image to enter Crop Mode (§35 — Image Crop Tool).
  document.getElementById('vbeCanvas')?.addEventListener('dblclick', e=>{
    const imgWrap = e.target.closest('.vbe-el[data-eltype="image"]');
    if(imgWrap){
      const elImg = getElById(imgWrap.dataset.elid);
      if(elImg && !elImg.locked && elImg.content && elImg.content.dataUrl) openImageCropModal(elImg.element_id);
      return;
    }
  });
  // Double-click a Shape or a Text element to type inline text into it (a plain click still just
  // selects/drags it, same as Image).
  document.getElementById('vbeCanvas')?.addEventListener('dblclick', e=>{
    const wrap = e.target.closest('.vbe-el[data-eltype="shape"], .vbe-el[data-eltype="text"]');
    if(!wrap) return;
    const elS = getElById(wrap.dataset.elid);
    if(!elS || elS.locked) return;
    if(elS.type==='shape' && (elS.style&&elS.style.shape)==='line') return; // a Line has no text box to edit
    STATE.vbTextEditId = elS.element_id;
    vb.selectedIds = [elS.element_id];
    refreshVisualEditor();
    requestAnimationFrame(()=>{
      const node = document.querySelector(`[data-textedit="${elS.element_id}"]`);
      if(!node) return;
      node.focus();
      const range = document.createRange();
      range.selectNodeContents(node);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
  });

  document.getElementById('vbPageNameInput')?.addEventListener('change', e=>{
    const page = activeVBPage(); if(!page) return;
    const v = e.target.value.trim(); if(!v) return;
    pushUndoVB(); page.name=v; scheduleAutosave(); refreshVisualEditor();
  });
  document.getElementById('vbDeletePageBtn')?.addEventListener('click', ()=>{
    const page = activeVBPage(); if(!page) return;
    deleteVBPage(page.id);
  });

  document.getElementById('vbX')?.addEventListener('change', e=>setElNumeric('x', Number(e.target.value)));
  document.getElementById('vbY')?.addEventListener('change', e=>setElNumeric('y', Number(e.target.value)));
  document.getElementById('vbW')?.addEventListener('change', e=>setElNumeric('width', Math.max(10,Number(e.target.value))));
  document.getElementById('vbH')?.addEventListener('change', e=>setElNumeric('height', Math.max(10,Number(e.target.value))));
  document.getElementById('vbRotation')?.addEventListener('change', e=>setElNumeric('rotation', Number(e.target.value)));

  document.getElementById('vbFontFamily')?.addEventListener('change', e=>setElStyle('fontFamily', e.target.value));
  document.getElementById('vbFontSize')?.addEventListener('change', e=>setElStyle('fontSize', Number(e.target.value)));
  document.getElementById('vbFontWeight')?.addEventListener('change', e=>{
    const el=getSingleSelectedEl(); if(!el) return;
    setElStyle('fontWeight', Number(e.target.value));
    if(el.type==='text'||el.type==='note') setElStyle('bold', Number(e.target.value)>=800);
  });
  // Alignment writes to a different style key depending on element type: Shape's box-text layout reads
  // style.textAlign, while Text/Note's simple text-align CSS reads style.align.
  document.querySelectorAll('[data-vbalignt]').forEach(b=>b.onclick=()=>{
    const el=getSingleSelectedEl(); if(!el) return;
    setElStyle(el.type==='shape'?'textAlign':'align', b.dataset.vbalignt);
  });
  document.querySelectorAll('[data-vbvalign]').forEach(b=>b.onclick=()=>setElStyle('vAlign', b.dataset.vbvalign));
  document.getElementById('vbBullet')?.addEventListener('click', ()=>applyTextCommand('insertUnorderedList'));
  document.getElementById('vbNumbered')?.addEventListener('click', ()=>applyTextCommand('insertOrderedList'));
  document.getElementById('vbLetterSpacing')?.addEventListener('change', e=>setElStyle('letterSpacing', Number(e.target.value)));
  document.getElementById('vbTextPadding')?.addEventListener('change', e=>setElStyle('textPadding', Number(e.target.value)));
  document.getElementById('vbLineHeight')?.addEventListener('change', e=>setElStyle('lineHeight', Number(e.target.value)));
  document.getElementById('vbTextLink')?.addEventListener('change', e=>setElStyle('link', e.target.value));

  document.getElementById('vbImageReplace')?.addEventListener('change', async e=>{
    const f = e.target.files[0]; if(!f) return;
    const dataUrl = await resizeImageFile(f);
    const el = getSingleSelectedEl(); if(!el) return;
    pushUndoVB();
    el.content = el.content||{}; el.content.dataUrl=dataUrl; el.content.name=f.name;

    el.updated_at=nowIso();
    scheduleAutosave(); refreshVisualEditor();

  document.getElementById('vbObjectFit')?.addEventListener('change', e=>setElStyle('objectFit', e.target.value));
  document.getElementById('vbOpacity')?.addEventListener('change', e=>setElStyle('opacity', Number(e.target.value)));
  // Image Crop Tool toolbar (§35): Crop opens the modal; Fit/Fill are one-click, no-crop shortcuts; Reset
  // clears an applied crop while leaving the current Fit/Fill choice alone. The original upload
  // (content.dataUrl) is never modified by any of these — see renderImageBlockHTML/openImageCropModal.
  document.getElementById('vbImageCropBtn')?.addEventListener('click', ()=>{
    const el = getSingleSelectedEl(); if(!el) return;
    openImageCropModal(el.element_id);
  });
  document.getElementById('vbImageFitBtn')?.addEventListener('click', ()=>{
    const el = getSingleSelectedEl(); if(!el) return;
    pushUndoVB();
    el.content = el.content||{}; delete el.content.crop;
    el.style = el.style||{}; el.style.objectFit = 'contain';
    el.updated_at = nowIso();
    scheduleAutosave(); refreshVisualEditor();
  });
  document.getElementById('vbImageFillBtn')?.addEventListener('click', ()=>{
    const el = getSingleSelectedEl(); if(!el) return;
    pushUndoVB();
    el.content = el.content||{}; delete el.content.crop;
    el.style = el.style||{}; el.style.objectFit = 'cover';
    el.updated_at = nowIso();
    scheduleAutosave(); refreshVisualEditor();
  });
  document.getElementById('vbImageResetCropBtn')?.addEventListener('click', ()=>{
    const el = getSingleSelectedEl(); if(!el || !el.content || !el.content.crop) return;
    pushUndoVB();

    el.updated_at = nowIso();

  document.getElementById('vbShapeType')?.addEventListener('change', e=>setElStyle('shape', e.target.value));
  document.getElementById('vbShapeBorderW')?.addEventListener('change', e=>setElStyle('borderWidth', Number(e.target.value)));
  document.getElementById('vbShapeRadius')?.addEventListener('change', e=>setElStyle('radius', Number(e.target.value)));
  document.getElementById('vbShapeOpacity')?.addEventListener('input', e=>setElStyle('opacity', Number(e.target.value)));
  document.getElementById('vbResetStyleBtn')?.addEventListener('click', resetElStyleToDefault);

  // Color Picker Popover — a Color control (Text Color, Shape Fill/Stroke, Canvas Background) opens
  // this shared popover right next to itself; every swatch inside it applies to whichever property
  // openColorPicker() was called with (STATE.vbColorPicker.prop).
  document.querySelectorAll('[data-vbcpopen]').forEach(btn=>btn.onclick=(e)=>{ e.stopPropagation(); openColorPicker(btn.dataset.vbcpopen, btn); });
  document.querySelectorAll('[data-vbcpcolor]').forEach(sw=>sw.onclick=()=>applyColorPickerValue(sw.dataset.vbcpcolor));
  const commitVbcpHex = (inputId)=>{
    const input = document.getElementById(inputId);
    if(input) applyColorPickerValue(input.value);
  };
  document.getElementById('vbcpHexInput')?.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commitVbcpHex('vbcpHexInput'); } });
  document.getElementById('vbcpHexInput')?.addEventListener('blur', ()=>commitVbcpHex('vbcpHexInput'));
  document.getElementById('vbcpAddCustom')?.addEventListener('click', ()=>{ if(STATE.vbColorPicker){ STATE.vbColorPicker.customOpen=true; refreshVisualEditor(); } });
  document.getElementById('vbcpEyedrop')?.addEventListener('click', openVBEyedropper);
  document.getElementById('vbcpBack')?.addEventListener('click', ()=>{ if(STATE.vbColorPicker){ STATE.vbColorPicker.customOpen=false; refreshVisualEditor(); } });
  document.getElementById('vbcpSpectrum')?.addEventListener('input', e=>{

  document.getElementById('vbcpCustomCancel')?.addEventListener('click', ()=>{ if(STATE.vbColorPicker){ STATE.vbColorPicker.customOpen=false; refreshVisualEditor(); } });

  document.getElementById('vbFullscreenBtn2')?.addEventListener('click', ()=>{ vb.fullscreen=!vb.fullscreen; STATE.vbTextEditId=null; STATE.vbColorPicker=null; refreshVisualEditor(); });

  document.querySelectorAll('[data-vbalign]').forEach(b=>b.onclick=()=>{
    const page = activeVBPage();
    const sel = vb.selectedIds.map(id=>page.elements.find(x=>x.element_id===id)).filter(Boolean).filter(x=>!x.locked);
    if(!sel.length) return;
    pushUndoVB();
    const CW=960, CH=540, dir=b.dataset.vbalign;
    if(sel.length===1){
      const el = sel[0];
      if(dir==='left') el.x=0; else if(dir==='right') el.x=CW-el.width; else if(dir==='hcenter') el.x=(CW-el.width)/2;
      else if(dir==='top') el.y=0; else if(dir==='bottom') el.y=CH-el.height; else if(dir==='vcenter') el.y=(CH-el.height)/2;
    } else {
      const minX=Math.min(...sel.map(e2=>e2.x)), maxRight=Math.max(...sel.map(e2=>e2.x+e2.width));
      const minY=Math.min(...sel.map(e2=>e2.y)), maxBottom=Math.max(...sel.map(e2=>e2.y+e2.height));
      const cx=(minX+maxRight)/2, cy=(minY+maxBottom)/2;
      sel.forEach(el=>{
        if(dir==='left') el.x=minX; else if(dir==='right') el.x=maxRight-el.width; else if(dir==='hcenter') el.x=cx-el.width/2;
        else if(dir==='top') el.y=minY; else if(dir==='bottom') el.y=maxBottom-el.height; else if(dir==='vcenter') el.y=cy-el.height/2;
      });
    }
    sel.forEach(el=>el.updated_at=nowIso());
    scheduleAutosave(); refreshVisualEditor();
  });
  document.querySelectorAll('[data-vblayer]').forEach(b=>b.onclick=()=>{
    const page = activeVBPage();
    const sel = vb.selectedIds.map(id=>page.elements.find(x=>x.element_id===id)).filter(Boolean);
    if(!sel.length) return;
    pushUndoVB();
    const dir = b.dataset.vblayer;
    const zs = page.elements.map(e2=>e2.z_index||0);
    const maxZ = Math.max(0,...zs), minZ = Math.min(0,...zs);
    sel.forEach(el=>{
      if(dir==='front') el.z_index=maxZ+1; else if(dir==='back') el.z_index=minZ-1;
      else if(dir==='forward') el.z_index=(el.z_index||0)+1; else if(dir==='backward') el.z_index=(el.z_index||0)-1;
      el.updated_at=nowIso();
    });
    scheduleAutosave(); refreshVisualEditor();
  });
  document.getElementById('vbDuplicateBtn')?.addEventListener('click', duplicateSelectedVB);
  document.getElementById('vbLockBtn')?.addEventListener('click', ()=>{
    const page = activeVBPage();
    const sel = vb.selectedIds.map(id=>page.elements.find(x=>x.element_id===id)).filter(Boolean);
    if(!sel.length) return;
    pushUndoVB();
    const target = !sel[0].locked;
    sel.forEach(el=>{ el.locked=target; el.updated_at=nowIso(); });
    scheduleAutosave(); refreshVisualEditor();
  });
  document.getElementById('vbDeleteBtn')?.addEventListener('click', deleteSelectedVB);

  if(!window.__vbKeyboardBound){
    window.__vbKeyboardBound = true;
    document.addEventListener('keydown', (e)=>{
      if(!BRIEF_DRAFT || !BRIEF_DRAFT.visualBrief) return;
      const editorRoot = document.getElementById('vbeRoot');
      if(!editorRoot || !editorRoot.querySelector('.vbe')) return;
      const vb2 = BRIEF_DRAFT.visualBrief;
      const active = document.activeElement;
      const typing = active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.isContentEditable);
      // Esc: while actively editing text (Shape inline text or a Text element), commit + exit edit mode
      // first — it must NOT also delete/deselect the object in the same keystroke. Otherwise, with a
      // selection and not typing anywhere else, Esc just deselects.
      if(e.key==='Escape'){
        if(STATE.vbColorPicker){ e.preventDefault(); STATE.vbColorPicker=null; refreshVisualEditor(); return; }
        if(STATE.vbTextEditId){
          e.preventDefault();
          if(active && active.isContentEditable) active.blur(); // triggers the existing blur-to-save handler
          STATE.vbTextEditId = null;
          refreshVisualEditor();
          return;
        }
        if(!typing && vb2.selectedIds.length){ e.preventDefault(); vb2.selectedIds=[]; refreshVisualEditor(); return; }
        return;
      }
      if((e.key==='Delete'||e.key==='Backspace') && !typing && vb2.selectedIds.length){ e.preventDefault(); deleteSelectedVB(); return; }
      if(e.key.startsWith('Arrow') && !typing && vb2.selectedIds.length){
        e.preventDefault();
        const page = activeVBPage(); if(!page) return;
        const step = e.shiftKey ? 10 : 1;
        const dx = e.key==='ArrowLeft' ? -step : e.key==='ArrowRight' ? step : 0;
        const dy = e.key==='ArrowUp' ? -step : e.key==='ArrowDown' ? step : 0;
        pushUndoVB();
        vb2.selectedIds.forEach(id=>{
          const el = page.elements.find(x=>x.element_id===id);
          if(el && !el.locked){ el.x += dx; el.y += dy; el.updated_at=nowIso(); }
        });
        scheduleAutosave(); refreshVisualEditor();
        return;
      }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !typing){ e.preventDefault(); if(e.shiftKey) redoVB(); else undoVB(); return; }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y' && !typing){ e.preventDefault(); redoVB(); return; }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d' && !typing && vb2.selectedIds.length){ e.preventDefault(); duplicateSelectedVB(); return; }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c' && !typing && vb2.selectedIds.length){ copySelectedVB(); return; }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v' && !typing){ pasteVB(); return; }
    });
  }
}

// Designer Management (GD Worldtech §Designer Management): a designer marked Leave/Inactive is excluded
// from Auto-Assign — callers treat "unavailable" the same as "no mapping" (falls back to Lead assigning
// manually). This only gates WHO gets auto-picked; it never touches the underlying capacity/points math.
function isDesignerAvailableForAutoAssign(name){
  if(!name) return true;
  const rec = (STATE.users||[]).find(u=>u.name===name && (u.role==='designer'||u.role==='lead'));
  return !rec || !rec.designer_status || rec.designer_status==='active';
}
function computeAssigneeFromForm(){
  const cat = document.getElementById('f_category')?.value;
  const typeEl = document.getElementById('f_type');
  if(!cat || cat===OTHER_CATEGORY || !typeEl || !typeEl.value) return null;
  const def = MASTER_TABLE[cat].types[typeEl.value];
  if(!def) return null;
  const role = def.reroute ? MASTER_TABLE[def.reroute].role : MASTER_TABLE[cat].role;
  let name = null;
  if(role==='E-Commerce Designer') name = 'Krissha';
  else if(role==='Content Designer') name = 'Pongpoj';
  else if(role==='Product Designer') name = 'Suriya';
  if(!name) return null; // offline / other -> lead assigns
  if(!isDesignerAvailableForAutoAssign(name)) return null;
  return name;
}
function renderMonthCalendar(person, mode, priority, taskPoints){
  const {month, year} = STATE.cal;
  const first = new Date(year, month, 1);
  const startDow = (first.getDay()+6)%7; // Monday-start
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = first.toLocaleDateString('th-TH',{month:'long', year:'numeric'});
  const dows = ['จ','อ','พ','พฤ','ศ','ส','อา'];
  const tierMode = mode==='picker' && person && priority;
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isPast = dateStr < todayISO();
    let cls = 'avail', title='', blocked = false, overridable=false;
    if(tierMode){
      const ev = evaluateDelivery(person, dateStr, taskPoints||0, priority);
      if(ev.hardLocked){ blocked=true; cls='blocked'; title=ev.reason; }
      else if(!ev.allowed){ blocked=true; cls='blocked'; title=ev.reason; }
      else {
        cls = ev.projected>=DAILY_CAP ? 'full' : (ev.projected>=DAILY_CAP*0.75 ? 'busy' : 'avail');
        if(ev.projected>=DAILY_CAP && ev.needsApproval){ overridable=true; }
        title = `Projected ${ev.projected}/${DAILY_CAP} pt${ev.needsApproval?' — Lead Designer จะพิจารณาพร้อม Capacity':''}${ev.splitUsed?' — กระจาย Workload 2 วันอัตโนมัติ':''}`;
      }
    } else if(person){
      const {taskLoad, cap, isFullLeave} = dayLoadFor(person, dateStr);
      const weekend = isWeekend(dateStr), holiday = isPublicHoliday(dateStr);
      if(isFullLeave || weekend || holiday){ blocked=true; cls='blocked'; title = isFullLeave?'ลาเต็มวัน':(weekend?'วันหยุดสุดสัปดาห์':'วันหยุดนักขัตฤกษ์'); }
      else if(taskLoad >= cap){ cls='full'; title=`${taskLoad.toFixed(1)} pt (เต็ม)`; }
      else if(taskLoad >= cap*0.75){ cls='busy'; title=`${taskLoad.toFixed(1)} pt`; }
      else { cls='avail'; title=`${taskLoad.toFixed(1)} pt`; }
    } else {
      const total = Object.keys(PEOPLE).reduce((s,p)=>s+dayLoadFor(p,dateStr).taskLoad,0);
      if(total >= DAILY_CAP*3) cls='full'; else if(total >= DAILY_CAP*1.5) cls='busy'; else cls='avail';
      title = `${total.toFixed(1)} pt รวมทีม`;
    }
    const selRef = mode==='drawer' ? STATE.dash.drawerDate : STATE.cal.selectedDate;
    const sel = selRef===dateStr ? 'selected' : '';
    cells += `<div class="cal-cell ${cls} ${isPast?'past':''} ${blocked?'blocked':''} ${overridable?'overridable':''} ${sel}" data-caldate="${dateStr}" data-calmode="${mode}" data-blocked="${blocked}" title="${title}">
      <span>${d}</span></div>`;
  }
  const legend = `
    <div class="cal-legend">
      <span><i style="background:var(--ok-bg)"></i>ว่าง (Available)</span>
      <span><i style="background:var(--pri-bg)"></i>ใกล้เต็ม (Nearly Full)</span>
      <span><i style="background:var(--crit-bg)"></i>เต็ม (Full)</span>
      <span><i style="background:#F1F5F9"></i>หยุด/ลา</span>
      <span><i style="background:var(--accent)"></i>เลือก</span>
    </div>`;
  return `
    <div class="cal-head">
      <strong class="display" style="font-size:12px">${monthName}</strong>
      <div class="cal-nav">
        <button type="button" class="btn btn-sm btn-ghost" data-calnav="-1" data-calmode="${mode}">‹</button>
        <button type="button" class="btn btn-sm btn-ghost" data-calnav="1" data-calmode="${mode}">›</button>
      </div>
    </div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    ${legend}`;
}

function canEditBriefTask(t){
  if(!STATE.auth.loggedIn || !t) return false;
  if(['delivered','rejected','closed_max_revision'].includes(t.review_status)) return false;
  if(STATE.auth.role==='po') return hasPermission('po','brief.edit') && t.project_owner_email===STATE.auth.identity;
  if(STATE.auth.role==='admin') return hasPermission('admin','brief.edit');
  if(STATE.auth.role==='designer'){
    if(!hasPermission('designer','brief.edit')) return false;
    // Lead Designer = Full Management Access (Master Dev Spec §2): can edit ANY brief, not just ones they
    // created. A regular Designer can edit only briefs they themselves created (see created_by_email —
    // Master Dev Spec §3). Older tasks created before this field existed have no created_by_email, so a
    // plain Designer correctly can't edit those either (nothing to prove authorship against).
    if(hasAdminAccess()) return true;
    // NOTE: STATE.auth.identity is the DISPLAY name for Designer/Lead accounts, not their email (kept that
    // way so assigned_user_name/PEOPLE/capacity matching are untouched) — created_by_email is a real email,
    // so it must be compared against STATE.auth.user.email, never against identity, for this to ever match.
    return !!t.created_by_email && t.created_by_email===(STATE.auth.user?.email || STATE.auth.identity);
  }
  return false;
}

function bindEditQuantityModal(){
  document.querySelectorAll('[data-editqty]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); STATE.editQuantityUI={taskId:b.dataset.editqty, error:''}; render(); });
  document.getElementById('editQtyBg')?.addEventListener('click', e=>{ if(e.target.id==='editQtyBg'){ STATE.editQuantityUI={taskId:null, error:''}; render(); } });
  document.getElementById('editQtyCancel')?.addEventListener('click', ()=>{ STATE.editQuantityUI={taskId:null, error:''}; render(); });
  document.getElementById('editQtySave')?.addEventListener('click', async ()=>{
    const t = STATE.tasks.find(x=>x.task_id===STATE.editQuantityUI.taskId); if(!t) return;
    const newDeliverables = Number(document.getElementById('eq_deliverables')?.value||0);
    const newResize = Number(document.getElementById('eq_resize')?.value||0);
    const reason = (document.getElementById('eq_reason')?.value||'').trim();
    if(!newDeliverables || newDeliverables<1){ STATE.editQuantityUI.error='กรุณากรอกจำนวน Deliverables อย่างน้อย 1'; render(); return; }
    if(!reason){ STATE.editQuantityUI.error='กรุณาระบุเหตุผล (บังคับกรอก)'; render(); return; }
    const before = {deliverables:t.deliverables, resize_quantity:t.resize_quantity||0, base_points:t.base_points};
    const cat = MASTER_TABLE[t.task_category]; const def = cat ? cat.types[t.task_type] : null;
    const newBase = (def && def.custom ? (Number(t.customPoints)||0) : pointsForTask({task_category:t.task_category, task_type:t.task_type, kv_status_check:t.kv_status_check, deliverables:newDeliverables, customPoints:t.customPoints})) + resizePoints(newResize);
    // Quantity Change History (Master Dev Spec Phase E) — separate from Brief Change History: this is a
    // Designer/Lead action on a live task, not a PO-form re-edit, so it gets its own log with a mandatory
    // Reason on every entry.
    t.quantity_change_history = t.quantity_change_history || [];
    t.quantity_change_history.push({
      timestamp: nowIso(), changedBy: STATE.auth.user?.name || STATE.auth.identity, reason,
      before, after: {deliverables:newDeliverables, resize_quantity:newResize, base_points: Math.round(newBase*100)/100},
    });
    t.deliverables = newDeliverables; t.resize_quantity = newResize; t.base_points = Math.round(newBase*100)/100;
    t.review_history.push({timestamp: nowIso(), action:'EDIT_QUANTITY',
      comment: `Deliverables ${before.deliverables} → ${newDeliverables} · Resize ${before.resize_quantity} → ${newResize} — เหตุผล: ${reason}`,
      by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    // Capacity recalculation (Master Dev Spec Phase E): recompute immediately and ALWAYS allow Save even if
    // this pushes the assignee over Capacity for the day — never block — but surface a clear Warning so
    // Lead Designer knows to Reassign/Override.
    if(t.assigned_user_name && t.prefer_delivery_date){
      const { taskLoad, cap } = dayLoadFor(t.assigned_user_name, t.prefer_delivery_date, t.task_id);
      const projected = Math.round((taskLoad + appliedPoints(t))*100)/100;
      if(projected > cap){
        toast(`⚠ บันทึกแล้ว แต่ ${t.assigned_user_name} เกิน Capacity วันที่ ${fmtDate(t.prefer_delivery_date)} (${projected.toFixed(1)}/${cap.toFixed(1)} pt) — Lead Designer สามารถ Reassign ได้`);
      } else {
        toast('บันทึกจำนวนงานใหม่แล้ว — คำนวณ Point/Capacity ใหม่เรียบร้อย');
      }
    } else {
      toast('บันทึกจำนวนงานใหม่แล้ว');
    }
    STATE.editQuantityUI = {taskId:null, error:''};
    await saveTasks();
    render();
  });
}
// Assign/Reassign Designer (Master Dev Spec Phase F): Lead-only. Moving the assignment is just changing
// assigned_user_name on the ONE task record — every Capacity view (dayLoadFor/taskBreakdownFor/Dashboard/
// Calendar/KPI) already reads that single field as its source of truth, so points move from the old
// designer to the new one for free, with no separate ledger to keep in sync and no way for a point to end
// up double-counted or orphaned.
function canReassign(t){
  if(!STATE.auth.loggedIn || !t) return false;
  if(['delivered','rejected','closed_max_revision'].includes(t.review_status)) return false;
  return STATE.auth.role==='designer' && hasAdminAccess();
}
function reassignCandidates(t){
  return (STATE.users||[])
    .filter(u=>(u.role==='designer'||u.role==='lead') && u.status==='active')
    .sort((a,b)=>a.name.localeCompare(b.name))
    .map(u=>{
      const { taskLoad, cap } = dayLoadFor(u.name, t.prefer_delivery_date, t.task_id);
      return { name:u.name, taskLoad, cap, onLeave: u.designer_status==='leave', inactive: u.designer_status==='inactive' };
    });
}
function renderReassignModal(){
  const t = STATE.tasks.find(x=>x.task_id===STATE.reassignUI.taskId);

      ${err ? `<div class="field-error" style="display:block;margin-bottom:10px">${err}</div>` : ''}
      <div style="display:flex;gap:8px">
        <button type="button" class="btn btn-ghost" style="flex:1" id="reassignCancel">Cancel</button>
        <button type="button" class="btn btn-primary" style="flex:1" id="reassignSave">Save</button>
      </div>
    </div>
  </div>`;
}
function bindReassignModal(){
  document.querySelectorAll('[data-reassign]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); STATE.reassignUI={taskId:b.dataset.reassign, error:''}; render(); });
  document.getElementById('reassignBg')?.addEventListener('click', e=>{ if(e.target.id==='reassignBg'){ STATE.reassignUI={taskId:null, error:''}; render(); } });
  document.getElementById('reassignCancel')?.addEventListener('click', ()=>{ STATE.reassignUI={taskId:null, error:''}; render(); });
  document.getElementById('reassignSave')?.addEventListener('click', async ()=>{
    const t = STATE.tasks.find(x=>x.task_id===STATE.reassignUI.taskId); if(!t) return;
    const newDesigner = document.getElementById('rs_designer')?.value || '';
    const reason = (document.getElementById('rs_reason')?.value||'').trim();
    if(!newDesigner){ STATE.reassignUI.error='กรุณาเลือก Designer'; render(); return; }
    if(!reason){ STATE.reassignUI.error='กรุณาระบุเหตุผล (บังคับกรอก)'; render(); return; }
    const oldDesigner = t.assigned_user_name;
    if(newDesigner===oldDesigner){ STATE.reassignUI.error='Designer คนนี้รับผิดชอบงานนี้อยู่แล้ว'; render(); return; }
    t.reassign_history = t.reassign_history || [];
    t.reassign_history.push({
      timestamp: nowIso(), changedBy: STATE.auth.user?.name || STATE.auth.identity,
      from: oldDesigner||'(Pending Assignment)', to: newDesigner, reason, points: appliedPoints(t),
    });
    // Single source of truth: reassigning is just this one field change — dayLoadFor/taskBreakdownFor
    // filter STATE.tasks by assigned_user_name, so the old designer's load drops and the new designer's
    // load picks it up on the very next render, with no separate point ledger to move or reconcile.
    t.assigned_user_name = newDesigner;
    const newRec = (STATE.users||[]).find(u=>u.name===newDesigner);
    if(newRec) ensurePeopleEntry(newRec.name, newRec.department);
    t.review_history.push({timestamp: nowIso(), action:'REASSIGN',
      comment: `${oldDesigner||'(Pending Assignment)'} → ${newDesigner} — เหตุผล: ${reason}`,
      by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(newDesigner, '📌 คุณได้รับมอบหมายงานใหม่', `"${taskDisplayName(t)}" (${t.task_id}) — จาก ${oldDesigner||'—'} — เหตุผล: ${reason}`);
    if(oldDesigner) notify(oldDesigner, '↪ งานถูก Reassign ไปยังคนอื่น', `"${taskDisplayName(t)}" (${t.task_id}) — เหตุผล: ${reason}`);
    STATE.reassignUI = {taskId:null, error:''};
    await saveTasks();
    render();
    toast(`Reassign แล้ว: ${oldDesigner||'—'} → ${newDesigner}`);
  });
}
// Minimal, scoped HTML-attribute escaper — used only for embedding free-text values (e.g. Detail)
// into data-copytext="..." attributes, where a stray quote/angle-bracket would corrupt the DOM.
// Newlines are encoded as &#10; so the HTML parser restores them as real \n in el.dataset.copytext,
// preserving Detail's line breaks through the copy round-trip (Dev Requirement §Copy Behavior).
function escAttr(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\r\n/g,'\n').replace(/\n/g,'&#10;');
}
// Static (read-only, no drag/resize/selection) rendering of one Visual Brief element for the Task
// Workspace canvas viewer — mirrors renderVisualElementWrap() from the live editor but strips every
// interactive affordance, since this is viewing an already-submitted brief, not authoring one.
function renderTaskWsElement(el, fields, t){
  const style = `left:${el.x}px;top:${el.y}px;width:${el.width}px;height:${el.height}px;z-index:${el.z_index};transform:rotate(${el.rotation||0}deg)`;
  return `<div class="vbe-el" style="${style};cursor:default">
    <div class="vbe-el-inner">${renderVisualElementBodyWithFields(el, fields, t)}</div>
  </div>`;
}
function computeTaskWsFitZoom(){
  const wrap = document.getElementById('taskwsCanvasWrap');
  if(!wrap) return 100;
  const availW = wrap.clientWidth - 52;
  const availH = wrap.clientHeight - 52;
  const byW = (availW/960)*100;
  const byH = availH>0 ? (availH/540)*100 : byW;
  return Math.max(20, Math.min(150, Math.round(Math.min(byW, byH))));
}

function detectLinkSource(url){
  const u = (url||'').toLowerCase();
  if(!u) return '';
  if(u.includes('docs.google.com/presentation') || u.includes('slides.google.com')) return 'Google Slides';
  if(u.includes('docs.google.com/spreadsheets')) return 'Google Sheets';
  if(u.includes('docs.google.com/document')) return 'Google Docs';
  if(u.includes('drive.google.com')) return 'Google Drive';
  if(u.includes('canva.com')) return 'Canva';
  if(u.includes('figma.com')) return 'Figma';
  if(u.includes('dropbox.com')) return 'Dropbox';
  return 'Link';
}

    // overwrite the other, and Created At/System Created At never factor into either.
    {label:'Original Deadline (Backdated)', val: t.is_backdated ? (t.historical_deadline_unknown ? 'ไม่ทราบ (Deadline Unknown)' : (t.historical_deadline_date ? fmtDate(t.historical_deadline_date) : '')) : ''},
    {label:'Historical Priority', val: t.is_backdated ? (PRIORITY_TH_LABEL[t.historical_priority]||t.historical_priority||'') : ''},
    {label:'Current Deadline Status', val: t.is_backdated ? (DEADLINE_STATUS_TH[currentDeadlineStatusFor(t.historical_deadline_date, t.historical_deadline_unknown, t.review_status==='delivered')]||'') : ''},
    {label:'Priority Override', val: (t.is_backdated && t.priority_override) ? `${PRIORITY_TH_LABEL[t.priority_override.calculated]||t.priority_override.calculated} → ${PRIORITY_TH_LABEL[t.priority_override.value]||t.priority_override.value} — เหตุผล: ${t.priority_override.reason} (โดย ${t.priority_override.changed_by})` : ''},
    {label:'Record Source', val: t.is_backdated ? (t.record_source||'BACKDATED') : ''},
    {label:'SLA Target', val: t.sla_date ? fmtDate(t.sla_date) : ''},
    {label:'Workload / Points', val: (pts||pts===0) ? `${pts.toFixed(2)} pt` : ''},
    // Task Data Model (Master Dev Spec §3): three distinct people can appear on one brief — Created By
    // (who actually submitted it), Brief Owner (the PO/stakeholder it's for — "Requested By" wording kept
    // for continuity with the rest of the app), and Assignee (Assigned Designer). All three collapse to
    // the same person for a normal PO-submitted brief, which is why Created By only shows when it
    // meaningfully differs from Brief Owner (i.e. a Designer/Lead Designer created it on someone's behalf).
    {label:'Created By', val: (t.created_by_email && t.created_by_email!==t.project_owner_email) ? `${t.created_by_name||t.created_by_email}${t.created_by_role?' ('+(ROLE_LABEL[t.created_by_role]||t.created_by_role)+')':''}` : ''},
    {label:'Requested By (Brief Owner)', val: requester},
    {label:'Department', val: t.department},
    {label:'Assignee', val: t.assigned_user_name},
  ].filter(f=>f.val!==undefined && f.val!==null && String(f.val).trim()!=='');
  if(!fields.length) return '<div class="hint">ยังไม่มีข้อมูล Task Info</div>';
  return `<div class="row2" style="margin-bottom:0">
    ${fields.map(f=>`<div><div class="hint">${f.label}</div><strong>${f.val}</strong></div>`).join('')}
  </div>`;
}

/* ---------- Directories ---------- */
function copyToClipboard(text, btnEl){
  const done = ()=>{
    if(!btnEl) return;
    const original = btnEl.innerHTML;
    btnEl.innerHTML = '✓ Copied';
    btnEl.classList.add('copied');
    setTimeout(()=>{ btnEl.innerHTML = original; btnEl.classList.remove('copied'); }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>toast('ไม่สามารถ Copy ได้'));
  } else {
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      done();
    }catch(e){ toast('ไม่สามารถ Copy ได้'); }
  }
}
async function renameProductColor(product, oldName, newName){
  const trimmed = newName.trim();
  if(!trimmed || trimmed===oldName) return;
  if(product.colors.includes(trimmed)){ toast('มีสีนี้อยู่แล้ว'); render(); return; }
  const idx = product.colors.indexOf(oldName);
  if(idx===-1) return;
  product.colors[idx] = trimmed;
  product.assets.forEach(a=>{ if(a.color===oldName) a.color=trimmed; });
  if(STATE.pui.colorTab===oldName) STATE.pui.colorTab = trimmed;
  product.updatedAt = new Date().toISOString();
  await saveProducts();
  render();
}
async function deleteProductColor(product, name){
  const used = product.assets.filter(a=>a.color===name).length;
  if(used>0){
    toast(`This color is used by ${used} asset shortcut${used===1?'':'s'}. Please reassign those shortcuts before deleting this color.`);
    return;
  }
  product.colors = product.colors.filter(c=>c!==name);
  if(STATE.pui.colorTab===name) STATE.pui.colorTab='ALL';
  product.updatedAt = new Date().toISOString();
  await saveProducts();
  render();
}

function canManageProducts(){
  return STATE.auth.role==='designer' && (STATE.auth.identity===LEAD || STATE.auth.identity==='Suriya');

function isValidDriveLink(url){
  return /^https?:\/\/(drive|docs)\.google\.com\//i.test((url||'').trim());
}
function categoryCounts(){
  const counts = {};
  STATE.products.forEach(p=>{ counts[p.category] = (counts[p.category]||0)+1; });
  return counts;
}
function filteredSortedProducts(){
  const q = STATE.pui.search.trim().toLowerCase();
  let list = STATE.products.filter(p=>{
    if(STATE.pui.category!=='ALL' && p.category!==STATE.pui.category) return false;
    if(q && ![p.nameTh,p.nameEn,p.sku].some(v=>(v||'').toLowerCase().includes(q))) return false;
    return true;
  });
  const sorters = {
    az: (a,b)=>a.nameTh.localeCompare(b.nameTh),
    za: (a,b)=>b.nameTh.localeCompare(a.nameTh),
    newest: (a,b)=>b.createdAt.localeCompare(a.createdAt),
    updated: (a,b)=>b.updatedAt.localeCompare(a.updatedAt),
    category: (a,b)=>a.category.localeCompare(b.category) || a.nameTh.localeCompare(b.nameTh),
  };
  list.sort(sorters[STATE.pui.sort] || sorters.az);
  return list;
}
