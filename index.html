        <div class="ft-preview-label">Live Preview</div>
        <canvas id="ftCanvas" class="ft-canvas" width="800" height="800" data-ftmode="${mode}"></canvas>
        <div class="ft-canvas-meta">${current ? escapeFtHtml(current.name) : (items.length ? '' : 'ยังไม่มีรูปสินค้า')}</div>
      </div>
      <div class="ft-navbar">
        <button class="ft-navbtn" id="ftNavPrev" ${items.length>1?'':'disabled'}>← ก่อนหน้า</button>
        <div class="ft-navcenter">
          <div class="ft-nct">${items.length ? (st.currentIndex+1)+' / '+items.length : '0 / 0'}</div>
          <div class="ft-ncf">${current ? escapeFtHtml(current.name) : ''}</div>
        </div>
        <button class="ft-navbtn" id="ftNavNext" ${items.length>1?'':'disabled'}>ถัดไป →</button>
        ${mode==='whitebg' ? `
          <div class="ft-export-actions">
            <button class="ft-btn ft-btn-primary" id="ftWbgExportCurrent" ${current?'':'disabled'}>บันทึกรูปนี้</button>
            <button class="ft-btn" id="ftWbgExportAll" ${items.length?'':'disabled'} style="background:#16a34a;color:#fff">Export ทั้งหมด (${items.length})</button>
          </div>` : ''}
      </div>
    </div>`;
}

function renderFtCSV(){
  return `
  <div class="ft-layout">
    <div class="ft-csv-empty">
      <div class="ico">📄</div>
      <h3>CSV Batch Mode</h3>
      <p>โหมดนำเข้า/ประมวลผลรูปสินค้าแบบชุดผ่านไฟล์ CSV ยังไม่เปิดใช้งานในเวอร์ชันนี้ — สงวนไว้สำหรับการพัฒนาต่อในอนาคต กรุณาใช้โหมด Manual หรือ White Background ไปก่อนค่ะ</p>
    </div>
  </div>`;
}

function ftAddToQueue(newAssets){
  const w = ftWbgState();
  const existingNames = new Set(w.queue.map(a=>a.name.toLowerCase()));
  let added = 0;
  newAssets.forEach(a=>{
    if(existingNames.has(a.name.toLowerCase())) return;
    w.queue.push(a);
    existingNames.add(a.name.toLowerCase());
    added++;
  });
  return added;
}

function bindFtNav(mode){
  const st = mode==='manual' ? ftManualState() : ftWbgState();
  document.getElementById('ftNavPrev')?.addEventListener('click', ()=>{
    if(st.currentIndex>0){ st.currentIndex--; render(); }
  });
  document.getElementById('ftNavNext')?.addEventListener('click', ()=>{
    if(st.currentIndex < st.items.length-1){ st.currentIndex++; render(); }
  });
}

function bindFtManual(){
  const m = ftManualState();

  document.querySelector('[data-ftmanualframelabel]')?.addEventListener('click', ()=>{
    document.getElementById('ftManualFrameInput')?.click();
  });
  document.getElementById('ftManualFrameInput')?.addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(m.frameUrl){ delete FT_IMG_CACHE[m.frameUrl]; URL.revokeObjectURL(m.frameUrl); }
    m.frameUrl = URL.createObjectURL(file);
    m.frameName = file.name;
    render();
  });

  document.querySelector('[data-ftmanualprodlabel]')?.addEventListener('click', ()=>{
    document.getElementById('ftManualProdInput')?.click();
  });
  document.getElementById('ftManualProdInput')?.addEventListener('change', (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const wasEmpty = m.items.length===0;
    files.forEach(file=>{
      m.items.push({
        id: 'ft_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        name: file.name,
        previewUrl: URL.createObjectURL(file),
        transform: {...m.global},
        _img: null,
      });
    });
    if(wasEmpty) m.currentIndex = 0;
    render();
  });

  document.querySelectorAll('[data-ftmanualpick]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-ftmanualremove]')) return;
      m.currentIndex = parseInt(el.getAttribute('data-ftmanualpick'),10);
      render();
    });
  });
  document.querySelectorAll('[data-ftmanualremove]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(el.getAttribute('data-ftmanualremove'),10);
      const it = m.items[idx];
      if(it && it.previewUrl){ delete FT_IMG_CACHE[it.previewUrl]; URL.revokeObjectURL(it.previewUrl); }
      m.items.splice(idx,1);
      if(m.currentIndex >= m.items.length) m.currentIndex = Math.max(0, m.items.length-1);
      render();
    });
  });

  const current = m.items[m.currentIndex] || null;
  const target = () => current ? current.transform : m.global;
  document.getElementById('ftManualScale')?.addEventListener('input', (e)=>{
    target().scale = parseFloat(e.target.value);
    const el = document.getElementById('ftManualScaleVal'); if(el) el.textContent = Math.round(target().scale)+'%';
    ftRedrawCanvas();
  });
  document.getElementById('ftManualX')?.addEventListener('input', (e)=>{
    target().x = parseFloat(e.target.value);
    const el = document.getElementById('ftManualXVal'); if(el) el.textContent = ftSigned(target().x);
    ftRedrawCanvas();
  });
  document.getElementById('ftManualY')?.addEventListener('input', (e)=>{
    target().y = parseFloat(e.target.value);
    const el = document.getElementById('ftManualYVal'); if(el) el.textContent = ftSigned(target().y);
    ftRedrawCanvas();
  });
  document.getElementById('ftManualApplyAll')?.addEventListener('click', ()=>{
    if(!current) return;
    m.items.forEach(it=>{ it.transform = {...current.transform}; });
    toast('ใช้ค่าปรับตำแหน่งกับทุกรูปแล้ว');
    render();
  });

  document.querySelectorAll('[data-ftmanualfmt]').forEach(el=>{
    el.addEventListener('click', ()=>{ m.exportFormat = el.getAttribute('data-ftmanualfmt'); render(); });
  });
  document.querySelectorAll('[data-ftmanualsize]').forEach(el=>{
    el.addEventListener('click', ()=>{ m.exportSize = parseInt(el.getAttribute('data-ftmanualsize'),10); render(); });
  });
  document.querySelectorAll('[data-ftmanuallimit]').forEach(el=>{
    el.addEventListener('click', ()=>{ m.exportLimit = el.getAttribute('data-ftmanuallimit'); render(); });
  });

  document.getElementById('ftManualExportCurrent')?.addEventListener('click', ()=> ftExportCurrent('manual'));
  document.getElementById('ftManualExportAll')?.addEventListener('click', ()=> ftExportAll('manual'));

  bindFtNav('manual');
}

function bindFtWhiteBG(){
  const w = ftWbgState();

  document.querySelectorAll('[data-ftsource]').forEach(el=>{
    el.addEventListener('click', ()=>{ w.sourceTab = el.getAttribute('data-ftsource'); render(); });
  });

  document.getElementById('ftDriveLoad')?.addEventListener('click', ()=>{
    const url = document.getElementById('ftDriveUrl')?.value.trim() || '';
    if(!url){ toast('กรุณาวางลิงก์ Google Drive Folder ก่อน'); return; }
    w.driveUrl = url;
    w.driveReference = url;
    const added = ftAddToQueue([
      {id:'ft_drive_'+Date.now()+'_1', name:'WT-AF301.jpg', previewUrl:'', source:'Google Drive', selected:true},
      {id:'ft_drive_'+Date.now()+'_2', name:'WT-RC18.jpg', previewUrl:'', source:'Google Drive', selected:true},
    ]);
    toast(added ? `โหลดจาก Drive แล้ว ${added} รูป` : 'ไม่มีรูปใหม่ (ซ้ำกับ Queue เดิม)');
    render();
  });

  document.getElementById('ftProductSearchBtn')?.addEventListener('click', ()=>{
    const kw = document.getElementById('ftProductSearch')?.value.trim() || '';
    if(!kw){ toast('กรุณาระบุ SKU หรือชื่อสินค้าก่อน'); return; }
    w.productSearch = kw;
    w.productReference = kw;
    const added = ftAddToQueue([
      {id:'ft_prod_'+Date.now(), name:kw+'.jpg', previewUrl:'', source:'Product System', selected:true},
    ]);
    toast(added ? 'พบสินค้าและเพิ่มเข้า Queue แล้ว' : 'ไม่มีรูปใหม่ (ซ้ำกับ Queue เดิม)');
    render();
  });

  document.querySelector('[data-ftlocallabel]')?.addEventListener('click', ()=>{
    document.getElementById('ftLocalInput')?.click();
  });
  document.getElementById('ftLocalInput')?.addEventListener('change', (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const assets = files.map(file=>({
      id:'ft_local_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      name:file.name, previewUrl:URL.createObjectURL(file), source:'Local', selected:true,
    }));
    const added = ftAddToQueue(assets);
    toast(`เพิ่มจากเครื่อง ${added} รูป`);
    render();
  });

  document.querySelectorAll('[data-ftassetcheck]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-ftassetcheck');
      const a = w.queue.find(x=>x.id===id);
      if(a) a.selected = el.checked;
      render();
    });
  });
  document.getElementById('ftAssetSelectAll')?.addEventListener('change', (e)=>{
    w.queue.forEach(a=>{ a.selected = e.target.checked; });
    render();
  });
  document.getElementById('ftAssetSearch')?.addEventListener('input', (e)=>{
    w.searchKw = e.target.value;
    render();
  });
  document.getElementById('ftClearQueue')?.addEventListener('click', ()=>{
    w.queue.forEach(a=>{ if(a.source==='Local' && a.previewUrl){ delete FT_IMG_CACHE[a.previewUrl]; URL.revokeObjectURL(a.previewUrl); } });
    w.queue = [];
    render();
  });
  document.getElementById('ftImportSelected')?.addEventListener('click', ()=>{
    const selected = w.queue.filter(a=>a.selected);
    if(!selected.length){ toast('กรุณาเลือกรูปอย่างน้อย 1 รูปก่อนนำเข้า'); return; }
    w.items = selected.map(a=>({
      id: a.id, name: a.name, previewUrl: a.previewUrl, source: a.source,
      transform: {scale:100,x:0,y:0}, _img:null,
    }));
    w.currentIndex = 0;
    toast(`นำเข้า ${selected.length} รูปเรียบร้อย`);
    render();
  });

  document.getElementById('ftRefDriveOpen')?.addEventListener('click', ()=>{ if(w.driveReference) window.open(w.driveReference, '_blank'); });
  document.getElementById('ftRefDriveCopy')?.addEventListener('click', ()=>{ if(w.driveReference) ftCopyText(w.driveReference); });
  document.getElementById('ftRefProductOpen')?.addEventListener('click', ()=>{ if(w.productReference) window.open(w.productReference, '_blank'); });
  document.getElementById('ftRefProductCopy')?.addEventListener('click', ()=>{ if(w.productReference) ftCopyText(w.productReference); });
  document.getElementById('ftRefAdd')?.addEventListener('click', ()=>{
    const link = prompt('วางลิงก์ไฟล์อ้างอิง/ไฟล์ทำงาน:');
    if(link) toast('เพิ่มลิงก์อ้างอิงแล้ว');
  });

  document.getElementById('ftGuideToggle')?.addEventListener('change', (e)=>{
    w.showGuide = e.target.checked;
    ftRedrawCanvas();
  });

  const current = w.items[w.currentIndex] || null;
  document.getElementById('ftWbgScale')?.addEventListener('input', (e)=>{
    if(!current) return;
    current.transform.scale = parseFloat(e.target.value);
    const el = document.getElementById('ftWbgScaleVal'); if(el) el.textContent = Math.round(current.transform.scale)+'%';
    ftRedrawCanvas();
  });
  document.getElementById('ftWbgX')?.addEventListener('input', (e)=>{
    if(!current) return;
    current.transform.x = parseFloat(e.target.value);
    const el = document.getElementById('ftWbgXVal'); if(el) el.textContent = ftSigned(current.transform.x);
    ftRedrawCanvas();
  });
  document.getElementById('ftWbgY')?.addEventListener('input', (e)=>{
    if(!current) return;
    current.transform.y = parseFloat(e.target.value);
    const el = document.getElementById('ftWbgYVal'); if(el) el.textContent = ftSigned(current.transform.y);
    ftRedrawCanvas();
  });
  document.getElementById('ftWbgReset')?.addEventListener('click', ()=>{
    if(!current) return;
    current.transform = {scale:100,x:0,y:0};
    render();
  });

  document.getElementById('ftWbgExportCurrent')?.addEventListener('click', ()=> ftExportCurrent('whitebg'));
  document.getElementById('ftWbgExportAll')?.addEventListener('click', ()=> ftExportAll('whitebg'));

  bindFtNav('whitebg');
}

function bindFrameTool(){
  if(!document.querySelector('.ft-page')) return;

  document.querySelectorAll('[data-ftsub]').forEach(el=>{
    el.addEventListener('click', ()=>{
      STATE.frameTool.sub = el.getAttribute('data-ftsub');
      render();
    });
  });

  const sub = ftCurrentSub();
  if(sub==='manual') bindFtManual();
  else if(sub==='whitebg') bindFtWhiteBG();

  ftRedrawCanvas();
}

function ftRedrawCanvas(){
  const canvas = document.getElementById('ftCanvas');
  if(!canvas) return;
  const mode = canvas.getAttribute('data-ftmode');
  const ctx = canvas.getContext('2d');
  const st = mode==='manual' ? ftManualState() : ftWbgState();
  const current = st.items[st.currentIndex] || null;

  if(current && !current._img && current.previewUrl){
    current._img = ftEnsureImage(current.previewUrl);
  }

  const opts = mode==='manual'
    ? {
        mode:'manual',
        bgImg: st.frameUrl ? ftEnsureImage(st.frameUrl) : null,
        productItem: current,
        areaPct: {x:0.12,y:0.12,w:0.76,h:0.76},
        showGuide: false,
        brandmark: false,
      }
    : {
        mode:'whitebg',
        bgImg: null,
        productItem: current,
        areaPct: {x:0.09,y:0.176,w:0.82,h:0.736},
        showGuide: st.showGuide,
        brandmark: true,
      };

  ftDrawComposite(ctx, canvas.width, canvas.height, opts);
}

function ftComposeDataUrl(mode, item, sizePx, format, limitKey){
  const off = document.createElement('canvas');
  off.width = sizePx; off.height = sizePx;
  const ctx = off.getContext('2d');
  const opts = mode==='manual'
    ? { mode:'manual', bgImg: ftManualState().frameUrl ? ftEnsureImage(ftManualState().frameUrl) : null, productItem:item, areaPct:{x:0.12,y:0.12,w:0.76,h:0.76}, showGuide:false, brandmark:false }
    : { mode:'whitebg', bgImg:null, productItem:item, areaPct:{x:0.09,y:0.176,w:0.82,h:0.736}, showGuide:false, brandmark:true };
  ftDrawComposite(ctx, sizePx, sizePx, opts);

  if(format==='png'){
    return off.toDataURL('image/png');
  }
  const limit = ftLimitBytes(limitKey);
  let quality = 0.94, dataUrl = off.toDataURL('image/jpeg', quality);
  while(limit !== Infinity && dataUrl.length*0.75 > limit && quality > 0.35){
    quality -= 0.08;
    dataUrl = off.toDataURL('image/jpeg', quality);
  }
  return dataUrl;
}

function ftDownloadDataUrl(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function ftExportCurrent(mode){
  const st = mode==='manual' ? ftManualState() : ftWbgState();
  const item = st.items[st.currentIndex];
  if(!item){ toast('ไม่มีรูปให้บันทึก'); return; }
  const size = mode==='manual' ? st.exportSize : 1200;
  const format = mode==='manual' ? st.exportFormat : 'png';
  const dataUrl = ftComposeDataUrl(mode, item, size, format, mode==='manual' ? st.exportLimit : 'none');
  ftDownloadDataUrl(dataUrl, ftBaseName(item.name)+'_frame.'+format);
  toast('บันทึกรูปแล้ว');
}

function ftExportAll(mode){
  const st = mode==='manual' ? ftManualState() : ftWbgState();
  if(!st.items.length){ toast('ไม่มีรูปให้ Export'); return; }
  const size = mode==='manual' ? st.exportSize : 1200;
  const format = mode==='manual' ? st.exportFormat : 'png';
  st.items.forEach((item,i)=>{
    setTimeout(()=>{
      const dataUrl = ftComposeDataUrl(mode, item, size, format, mode==='manual' ? st.exportLimit : 'none');
      ftDownloadDataUrl(dataUrl, ftBaseName(item.name)+'_frame.'+format);
    }, i*250);
  });
  toast(`กำลังดาวน์โหลด ${st.items.length} รูป (ทีละไฟล์)`);
}

/* ============================= BOOT ============================= */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="placeholder" style="padding-top:80px"><div class="ico">⏳</div>กำลังโหลดระบบ...</div>`;
  await loadData();
  render();
})();
</script>
