.taskws-backbtn{background:none;border:none;color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.taskws-backbtn:hover{color:var(--accent)}
.taskws-titlerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}

<!-- ============================= CENTRAL STORAGE (Firebase) =============================
     Every save/load in this app goes through exactly two calls: window.storage.get(key) and
     window.storage.set(key, value) — see loadData()/saveKey() in the main script below. Nothing
     else in this file talks to storage directly. That means data lives OUTSIDE this HTML file,
     in the Firestore project you point this at — so:
       1) Replacing this .html file with a newer version (a feature update) never resets data —
          the new file reads from the exact same Firestore project as the old one.
       2) Every Designer / Lead Designer / Project Owner who opens the page reads and writes the
          SAME shared data, not a private copy per browser/device.
     Without this wired up, window.storage does not exist at all and every field silently falls
     back to blank/seed data on every page load — nothing is saved anywhere.

     ---- ONE-TIME SETUP (about 5 minutes, free) ----
     1. Go to https://console.firebase.google.com -> "Add project" (the free Spark plan is enough
        for this). You can turn off Google Analytics for the project, it isn't needed.
     2. In the new project: left menu "Build" -> "Firestore Database" -> "Create database" ->
        pick any region close to your users -> start in "Production mode".
     3. Click the ⚙️ gear icon (top-left) -> "Project settings" -> scroll to "Your apps" -> click
        the "</>" (Web) icon -> give it any nickname -> "Register app" (skip Firebase Hosting,
        not needed) -> it will show you a `firebaseConfig = {...}` object. Copy it.
     4. Paste those values into FIREBASE_CONFIG below, replacing the placeholder strings.
     5. Back in Firestore -> "Rules" tab, replace the rules with the block below, then "Publish".
        (This app authenticates users on the client side only — see the login code further down
        — so there is no server-side identity to check yet. These rules leave the database open
        to anyone with the project's web config, which is visible in this file's source. That is
        an acceptable tradeoff for an internal tool behind a private link, same as the client-side
        password checks already used elsewhere in this app — but it means the data is only as
        private as the link to this page. If that's not acceptable, the next hardening step is
        adding real Firebase Authentication + rules scoped to signed-in users — a separate task.)

            rules_version = '2';
            service cloud.firestore {
              match /databases/{database}/documents {
                match /worldtech_storage/{doc} {
                  allow read, write: if true;
                }
              }
            }

     6. Save this file and upload/commit it to your GitHub repo as usual — no other code changes
        needed. Open the page; if the red banner at the top is gone, it's connected.
  -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    // If something already defined window.storage before this script ran (an automated test
    // harness's own stub via Playwright's addInitScript, or any other embedding host), leave it
    // alone entirely — never override an already-provided storage bridge. This block only ever
    // activates as the DEFAULT for a plain browser tab that has nothing else providing it.
    if (typeof window.storage === 'undefined') {
      // ---- PASTE YOUR OWN FIREBASE PROJECT'S CONFIG HERE (step 3-4 above) ----
      const FIREBASE_CONFIG = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID",
      };
      const FIRESTORE_COLLECTION = 'worldtech_storage';

      let __fbReady = false;
      try {
        if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY') {
          firebase.initializeApp(FIREBASE_CONFIG);
          window.__fbDb = firebase.firestore();
          __fbReady = true;
        }
      } catch (e) { console.error('Firebase init failed', e); }

      // Small in-memory cache so the many window.storage.get() calls loadData() fires at boot
      // don't all round-trip to Firestore individually after the first read of a given key within
      // this page view. set() always writes straight through (never served from cache).
      const __fbCache = {};
      window.storage = {
        get: async (key) => {
          if (!__fbReady) { window.__storageOffline = true; return null; }
          try {
            if (key in __fbCache) return __fbCache[key];
            const snap = await window.__fbDb.collection(FIRESTORE_COLLECTION).doc(key).get();
            const result = snap.exists ? { value: snap.data().value } : null;
            __fbCache[key] = result;
            return result;
          } catch (e) { console.error('storage.get failed for', key, e); return null; }
        },
        set: async (key, value) => {
          if (!__fbReady) { window.__storageOffline = true; return false; }
          try {
            __fbCache[key] = { value };
            await window.__fbDb.collection(FIRESTORE_COLLECTION).doc(key).set({ value, updated_at: new Date().toISOString() });
            return true;
          } catch (e) { console.error('storage.set failed for', key, e); return false; }
        },
      };

      // Loud, impossible-to-miss warning if someone deploys this file before step 3-4 above is
      // done — better than silently losing every edit on the next refresh.
      if (!__fbReady) {
        window.addEventListener('DOMContentLoaded', () => {
          const banner = document.createElement('div');
          banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;padding:9px 16px;font:600 13px system-ui,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.25)';
          banner.textContent = '⚠️ ยังไม่ได้เชื่อมต่อ Central Storage (FIREBASE_CONFIG) — ข้อมูลทุกอย่างที่แก้ไขตอนนี้จะหายเมื่อ Refresh หน้า ดูวิธีตั้งค่าในคอมเมนต์ต้นไฟล์';
          document.body.prepend(banner);
        });
      }
    }
  </script>

// creates/renames a Designer/Lead account now calls this to make sure PEOPLE always has an entry for

function ensurePeopleEntry(name, department){
  if(!name || PEOPLE[name]) return;

  else if(department==='Content') role = 'Content Designer';

  PEOPLE[name] = {role};
}

// Fixed-date public holidays confirmed for 2026 (พ.ศ.2569). Lunar-based days (Makha Bucha, Asahna Bucha,
// Buddhist Lent Day) shift every year — Admin should add them here once confirmed by the Bank of Thailand calendar.
const THAI_HOLIDAYS_2026 = [
  "2026-01-01","2026-01-02","2026-04-06","2026-04-13","2026-04-14","2026-04-15",
  "2026-05-01","2026-05-04","2026-05-31","2026-07-28","2026-08-12",
  "2026-10-13","2026-10-16","2026-10-23","2026-12-05","2026-12-10","2026-12-31",
];
function isWeekend(dateStr){ const dow = new Date(dateStr+"T00:00:00").getDay(); return dow===0||dow===6; }
function isPublicHoliday(dateStr){ return THAI_HOLIDAYS_2026.includes(dateStr); }
const URGENCY_REASONS = ["Campaign Launch","Live / Event","Marketplace Deadline","Client Deadline","Management Request","Production Emergency","Last-minute Business Requirement","Other"];
// Format a Date using its LOCAL calendar fields (not toISOString, which converts to UTC and
// rolls back to the previous day for any positive UTC offset, e.g. Thailand UTC+7).
function toLocalISODate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function workingDaysBetween(fromDate, toDate){
  if(toDate <= fromDate) return 0;
  let d = new Date(fromDate+"T00:00:00"); let count = 0;
  while(toLocalISODate(d) < toDate){
    d.setDate(d.getDate()+1);
    const ds = toLocalISODate(d);
    if(!isWeekend(ds) && !isPublicHoliday(ds)) count++;
  }
  return count;
}
function priorityFromDiff(diff){
  if(diff<=0) return 'CRITICAL';
  if(diff===1) return 'URGENT';
  if(diff===2) return 'PRIORITY';
  return 'STANDARD';
}
function earliestDeliveryForPriority(priority){
  const target = PRIORITY_SLA[priority];
  if(target===0){
    const t = todayISO();
    return (!isWeekend(t) && !isPublicHoliday(t)) ? t : addBusinessDays(t,1);
  }
  return addBusinessDays(todayISO(), target);
}
// Given a Priority shortcut, find the earliest date that is both on/after that priority's SLA
// window AND actually selectable for that designer (skips hard-locked and, for Standard/Priority,
// over-capacity dates) — so pressing a Priority pill always lands on a date consistent with it.
function findValidDateForPriority(person, priority, taskPoints){
  let d = earliestDeliveryForPriority(priority);
  if(!person) return d;
  for(let i=0;i<60;i++){
    const ev = evaluateDelivery(person, d, taskPoints, priority);
    if(ev.allowed) return d;
    d = addBusinessDays(d, 1);
  }
  return d;
}
// The business day immediately before dateStr, skipping weekends and configured holidays —
// the "Day 2" a Standard/Priority task can auto-split onto when Day 1 alone isn't enough.
function previousBusinessDay(dateStr){
  let d = new Date(dateStr+"T00:00:00"), ds;
  do{
    d.setDate(d.getDate()-1);
    ds = toLocalISODate(d);
  } while(isWeekend(ds) || isPublicHoliday(ds));
  return ds;
}
// Auto Split Workload (max 2 Business Days): fill the requested delivery date first with whatever
// real capacity it has left, then push the remainder onto the previous business day — never later
// than the requested date, and always against each day's *actual* available capacity (cap minus
// what's already loaded there, leave included). Only called once a single day is already known not
// to be enough (see evaluateDelivery), so `remaining` here is always > 0.
function computeCapacitySplit(person, dateStr, taskPoints, excludeId){
  const day1 = dateStr;
  const l1 = dayLoadFor(person, day1, excludeId);
  const avail1 = Math.max(0, Math.round((l1.cap - l1.taskLoad)*100)/100);
  const onDay1 = Math.min(taskPoints, avail1);
  const remaining = Math.round((taskPoints - onDay1)*100)/100;
  const day2 = previousBusinessDay(day1);
  const l2 = dayLoadFor(person, day2, excludeId);
  const avail2 = Math.max(0, Math.round((l2.cap - l2.taskLoad)*100)/100);
  const onDay2 = Math.min(remaining, avail2);
  const allocation = [];
  if(onDay2>0) allocation.push({date:day2, pt:Math.round(onDay2*100)/100});
  if(onDay1>0) allocation.push({date:day1, pt:Math.round(onDay1*100)/100});
  const totalAllocated = Math.round((onDay1+onDay2)*100)/100;
  const covered = totalAllocated >= Math.round((taskPoints-0.005)*100)/100;
  return {covered, allocation, day1, day2, avail1, avail2, totalAllocated};
}
// Generalized Auto Capacity Allocation for STANDARD priority only (Dev Handoff spec — replaces the
// 2-day-then-block rule above for Standard; Priority/Critical/Urgent keep the original logic untouched,
// see evaluateDelivery below). Cascades FORWARD from the requested date across as many business days as
// it takes, and — per the spec's "never blocks submission" rule — always finishes covered:true: in the
// pathological case where MAX_STEPS business days are all still full, the (tiny, practically-unreachable)
// remainder lands on the last day searched rather than refusing the Brief outright.
function computeForwardCapacitySplit(person, dateStr, taskPoints, excludeId){
  let remaining = Math.round((taskPoints||0)*100)/100;
  const allocation = [];
  let d = dateStr;
  const MAX_STEPS = 120;
  for(let steps=0; remaining>0.005 && steps<MAX_STEPS; steps++){
    const {taskLoad, cap} = dayLoadFor(person, d, excludeId);
    const avail = Math.max(0, Math.round((cap - taskLoad)*100)/100);
    const onDay = Math.min(remaining, avail);
    if(onDay>0){
      allocation.push({date:d, pt:Math.round(onDay*100)/100});
      remaining = Math.round((remaining-onDay)*100)/100;
    }
    if(remaining>0.005) d = addBusinessDays(d, 1);
  }
  if(remaining>0.005){
    const last = allocation.length ? allocation[allocation.length-1].date : d;
    const existing = allocation.find(a=>a.date===last);
    if(existing) existing.pt = Math.round((existing.pt+remaining)*100)/100;
    else allocation.push({date:last, pt:remaining});
  }
  const totalAllocated = Math.round(allocation.reduce((s,a)=>s+a.pt,0)*100)/100;
  return {covered:true, allocation, totalAllocated};
}
// Core validation used by both the calendar (preview) and submit (final check).
// Standard/Priority: normal capacity check, no bypass — but a day that can't fit the task alone now
// gets one more chance via Auto-Split (see computeCapacitySplit) before being refused outright.
// Urgent/Critical: always routes through Lead Approval, and Lead reviews capacity (which may be
// exceeded) as part of that approval — unaffected by Auto-Split.
function evaluateDelivery(person, dateStr, taskPoints, priority){
  const weekend = isWeekend(dateStr), holiday = isPublicHoliday(dateStr);
  const {taskLoad, isFullLeave, internalDeduct, isAllDayInternal} = dayLoadFor(person, dateStr);
  const hardLocked = weekend || holiday || isFullLeave || isAllDayInternal;
  const projected = Math.round((taskLoad + (taskPoints||0))*100)/100;
  const diff = workingDaysBetween(todayISO(), dateStr);
  const needsApproval = !!PRIORITY_NEEDS_APPROVAL[priority];
  if(hardLocked){
    return {allowed:false, hardLocked:true, needsApproval, overCapacity:false, projected, current:taskLoad, diff,
      reason: isFullLeave ? 'ดีไซเนอร์ลาเต็มวัน (Hard Lock)' : (isAllDayInternal ? 'ดีไซเนอร์ไม่ว่างทั้งวัน — Internal Task (Hard Lock)' : (weekend ? 'วันหยุดสุดสัปดาห์ (Hard Lock)' : 'วันหยุดนักขัตฤกษ์ (Hard Lock)'))};
  }
  // Internal Task hours (logged, non-Brief time) shrink the effective daily ceiling for THIS day only —
  // leave's effect on overCapacity is intentionally left exactly as before (unchanged pre-existing
  // behavior, out of scope here) so this only ever adds a new reason to split/approve, never removes one.
  const effectiveCap = Math.round((DAILY_CAP - (internalDeduct||0))*100)/100;
  const overCapacity = projected > effectiveCap;
  if(!needsApproval && overCapacity){
    // Auto Capacity Allocation (Dev Handoff spec): Standard priority cascades forward across as many
    // business days as needed and never blocks submission. Priority keeps the original 2-day-then-block
    // logic completely unchanged ("Priority ใช้ Logic เดิม").
    if(priority==='STANDARD'){
      const split = computeForwardCapacitySplit(person, dateStr, taskPoints||0);
      return {allowed:true, hardLocked:false, needsApproval, overCapacity:true, projected, current:taskLoad, diff,
        splitUsed:true, splitAllocation:split.allocation, splitDay2Date:split.allocation[0]?.date};
    }
    const split = computeCapacitySplit(person, dateStr, taskPoints||0);
    if(split.covered){
      return {allowed:true, hardLocked:false, needsApproval, overCapacity:true, projected, current:taskLoad, diff,
        splitUsed:true, splitAllocation:split.allocation, splitDay2Date:split.day2};
    }
    return {allowed:false, hardLocked:false, needsApproval, overCapacity:true, projected, current:taskLoad, diff,
      splitAttempted:true, splitAllocation:split.allocation,
      reason:'Capacity ไม่เพียงพอภายในช่วงงาน 2 วัน กรุณาเลือกวันส่งถัดไป'};
  }
  return {allowed:true, hardLocked:false, needsApproval, overCapacity, projected, current:taskLoad, diff};
}

/* ---------- Internal Task (Dev Handoff — Capacity, Internal Task & Performance System) ----------
   Internal Task = time a Designer spends on non-Brief work (meetings, admin, mentoring, etc.) that still
   consumes her Daily Capacity. Every category below is bucketed into exactly one of two classes for the
   Performance system (Phase N): 'operational' (personal/admin time — not delivering value to a specific
   colleague/team initiative) vs 'contribution' (helping the team). Both classes reduce Production Hours
   identically (see productionHoursFor()) — a Designer is never penalized in her Productivity ratio for
   logging honest non-Brief time — the class split exists purely as a Lead-only reporting breakdown so
   "team-supportive work isn't scored as negative performance" without silently inflating the ratio either. */
const INTERNAL_TASK_CATEGORIES = [
  "Team Meeting","Onboarding / Mentoring","QC / Peer Review Support","Process Improvement",
  "Training / Self-Development","Admin / Documentation","Tool / Asset Maintenance",
  "Personal Break / Errand","Other",
];
const INTERNAL_CATEGORY_CLASS = {
  "Team Meeting":"contribution", "Onboarding / Mentoring":"contribution", "QC / Peer Review Support":"contribution",
  "Process Improvement":"contribution", "Training / Self-Development":"operational",
  "Admin / Documentation":"operational", "Tool / Asset Maintenance":"operational",
  "Personal Break / Errand":"operational", "Other":"operational",
};
const INTERNAL_CLASS_LABEL = {operational:"Operational", contribution:"Team Contribution"};
function internalTaskClass(it){ return INTERNAL_CATEGORY_CLASS[it.category] || 'operational'; }
// How many hours a single Internal Task entry consumes on its date. All Day/Unavailable is a hard lock —
// it consumes the entire Daily Capacity regardless of any time fields.
function internalTaskHours(it){
  if(!it) return 0;
  if(it.allDay) return DAILY_CAP;
  if(it.timeMode==='duration') return Math.max(0, Math.round((Number(it.durationHours)||0)*100)/100);
  if(it.timeMode==='specific' && it.startTime && it.endTime){
    const [sh,sm] = it.startTime.split(':').map(Number);
    const [eh,em] = it.endTime.split(':').map(Number);
    const mins = (eh*60+(em||0)) - (sh*60+(sm||0));
    return mins>0 ? Math.round((mins/60)*100)/100 : 0;
  }
  return 0;
}
// Total Internal Task hours a person already has logged on dateStr (used by dayLoadFor() to shrink the
// day's available Capacity, and by the Internal Task modal to preview remaining hours before saving).
function internalLoadFor(person, dateStr, excludeId){
  return Math.round(STATE.internalTasks
    .filter(it=>it.person===person && it.date===dateStr && it.id!==excludeId)
    .reduce((s,it)=>s+internalTaskHours(it),0) * 100)/100;
}
function isAllDayUnavailable(person, dateStr, excludeId){
  return STATE.internalTasks.some(it=>it.person===person && it.date===dateStr && it.allDay && it.id!==excludeId);
}
// Lead Designer = full manage access over every Designer's Internal Tasks (same identity check reused
// throughout the app for every other Lead-only gate — Colors, CI Guidelines, Reassign, etc.).
function isLead(){ return STATE.auth.role==='designer' && STATE.auth.identity===LEAD; }
function canCreateInternalTaskFor(person){
  if(isLead()) return true;
  return STATE.auth.role==='designer' && STATE.auth.identity===person;
}
function canManageInternalTask(it){ return it && canCreateInternalTaskFor(it.person); }
// Project Owner never sees Internal Task detail (name/category/note) — only aggregate Capacity Status.
// A Designer viewing a *colleague's* day (Team Calendar) sees only a generic Internal/Unavailable marker,
// never the colleague's task name/category/note — full detail is Lead Designer (any Designer) or the
// Designer herself (her own entries) only.
function canViewInternalDetail(it){
  if(!it || !STATE.auth.loggedIn || STATE.auth.role==='po') return false;
  if(isLead()) return true;
  return STATE.auth.identity===it.person;
}

function uid(){ return "TSK-" + new Date().getFullYear() + "-" + Math.random().toString(36).slice(2,7).toUpperCase(); }
function todayISO(){ return toLocalISODate(new Date()); }
function addBusinessDays(dateStr, days){
  let d = new Date(dateStr+"T00:00:00"); let added=0;
  while(added<days){
    d.setDate(d.getDate()+1);
    const ds = toLocalISODate(d);
    const day = d.getDay();
    if(day!==0 && day!==6 && !isPublicHoliday(ds)) added++;
  }
  return toLocalISODate(d);
}
function fmtDate(s){ if(!s) return "-"; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'}); }
function fmtDateTime(s){ if(!s) return "-"; const d=new Date(s); return d.toLocaleString('th-TH',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
// Resize (Master Dev Spec Phase E): Resize Point = CEIL(Resize Quantity / 4), ADDED ON TOP of the base
// point from pointsForTask() below — applies to every task type/category, and is never merged into a
// single combined formula with Deliverables (they're computed and stored separately, then summed).
function resizePoints(qty){ return Math.ceil((Number(qty)||0)/4); }
function pointsForTask(t){
  const cat = MASTER_TABLE[t.task_category]; if(!cat) return 0;
  const def = cat.types[t.task_type]; if(!def) return 0;
  const deliverables = Number(t.deliverables)||1;
  if(def.custom) return Number(t.customPoints)||0; // Lead Designer sets the final total directly
  // E-Commerce + "ไม่มี KV — ต้องสร้างใหม่" only: the first deliverable is a full new-KV build (3pt),
  // every additional deliverable reuses that same new KV so it's cheaper (1pt each) — this replaces
  // the normal per-deliverable kv/noKv math for this one combination. Any other category (Content's
  // own kv/noKv types included) and any other KV status keep the original logic below untouched.
  if(t.task_category === "E-Commerce" && def.kv !== undefined && t.kv_status_check === "NEED_NEW_KV"){
    return Math.round((3 + (deliverables - 1)) * 100) / 100;
  }
  let base = 0;
  if(def.kv !== undefined) base = t.kv_status_check === "HAS_WORKING_FILE" ? def.kv : def.noKv;
  else base = def.base || 0;
  base = base * deliverables;
  return Math.round(base*100)/100;
}
function appliedPoints(t){
  const rate = REVISE_RATES[t.revise_status] ?? 0;
  const base = t.base_points || 0;
  return t.revise_status && t.revise_status!=="None" ? Math.round(base*rate*100)/100 : base;
}
// How many of a task's points land on one specific day. Most tasks live entirely on
// prefer_delivery_date (unchanged fallback below). A task that went through Auto-Split Capacity
// (see computeCapacitySplit) instead carries a capacity_allocation:[{date,pt}] recorded at submit
// time against its *base* points — here that per-day share is scaled by the task's current applied
// rate (appliedPoints/base_points) so a later revision's multiplier still applies evenly across the
// days it was split onto, without re-running the split. This is the one place that decides how much
// of a task counts against a given day, so every capacity view (Calendar, Designer Workload,
// Dashboard, Assignment, Task Detail, Report) reads it via dayLoadFor()/taskBreakdownFor() below and
// they can never disagree.
function taskLoadOnDate(t, dateStr){
  const total = appliedPoints(t);
  if(Array.isArray(t.capacity_allocation) && t.capacity_allocation.length){
    const entry = t.capacity_allocation.find(a=>a.date===dateStr);
    if(!entry) return 0;
    const base = t.base_points || 0;
    if(base<=0) return 0;
    return Math.round(total * (entry.pt/base) * 100)/100;
  }
  return t.prefer_delivery_date===dateStr ? total : 0;
}
function dayLoadFor(person, dateStr, excludeId){
  const taskLoad = STATE.tasks
    .filter(t=>t.assigned_user_name===person && t.task_id!==excludeId
      && !["rejected","closed_max_revision"].includes(t.review_status))
    .reduce((s,t)=>s+taskLoadOnDate(t,dateStr),0);
  const leave = STATE.leaves.find(l=>l.person===person && l.date===dateStr);
  const leaveDeduct = leave ? (leave.type==="full" ? DAILY_CAP : DAILY_CAP/2) : 0;
  // Internal Task hours (Dev Handoff — Capacity, Internal Task & Performance System): logged Internal Task
  // time shrinks the day's available Capacity exactly like leave does — every call site below reads `cap`,
  // never the literal DAILY_CAP, so Auto-Split/Reassign/Assignment/Calendar all respect it automatically.
  const internalDeduct = Math.min(DAILY_CAP, internalLoadFor(person, dateStr, excludeId));
  const isAllDayInternal = isAllDayUnavailable(person, dateStr, excludeId);
  return {taskLoad: Math.round(taskLoad*100)/100, leaveDeduct, internalDeduct,
    cap: Math.round((DAILY_CAP - leaveDeduct - internalDeduct)*100)/100,
    isFullLeave: leave && leave.type==="full", isAllDayInternal};
}

/* ---------- Team Dashboard: shared capacity/status engine (single source of truth,
   also usable by Brief Calendar / Process Board so numbers never disagree) ---------- */
const DASH_STATUS_META = {
  leave:    {label:'On Leave',        rank:0, cls:'st-leave'},
  holiday:  {label:'Company Holiday', rank:0, cls:'st-leave'},
  critical: {label:'Critical Overload', rank:1, cls:'st-critical'},
  high:     {label:'High Overload',   rank:2, cls:'st-high'},
  over:     {label:'Over Capacity',   rank:3, cls:'st-over'},
  full:     {label:'Full',            rank:4, cls:'st-full'},
  nearlyfull:{label:'Nearly Full',    rank:5, cls:'st-nearly'},
  available:{label:'Available',       rank:6, cls:'st-avail'},
};
function capacityStatusKey(points){
  if(points<=5) return 'available';
  if(points<=7) return 'nearlyfull';
  if(points===8) return 'full';
  if(points<=10) return 'over';
  if(points<=12) return 'high';
  return 'critical';
}
// Which tasks actually load onto dateStr, and how much — a split task shows up (with its per-day
// share) on every day it was allocated to, not just its prefer_delivery_date, so this always adds up
// to the same total dayLoadFor() reports for that day.
function taskBreakdownFor(person, dateStr){
  const tasks = STATE.tasks.filter(t=>t.assigned_user_name===person
    && !["rejected","closed_max_revision"].includes(t.review_status)
    && taskLoadOnDate(t, dateStr) > 0);
  const master = tasks.filter(t=>!t.revise_status || t.revise_status==="None");
  const revision = tasks.filter(t=>t.revise_status && t.revise_status!=="None");
  const masterPts = Math.round(master.reduce((s,t)=>s+taskLoadOnDate(t,dateStr),0)*100)/100;
  const revisionPts = Math.round(revision.reduce((s,t)=>s+taskLoadOnDate(t,dateStr),0)*100)/100;
  return {master, revision, masterPts, revisionPts, total: Math.round((masterPts+revisionPts)*100)/100, tasks};
}
// Single shared status computation for a designer on a given date.
function designerDayStatus(person, dateStr){
  const {taskLoad, isFullLeave} = dayLoadFor(person, dateStr);
  const holiday = isWeekend(dateStr) || isPublicHoliday(dateStr);
  let key;
  if(isFullLeave) key='leave';
  else if(holiday) key='holiday';
  else key = capacityStatusKey(taskLoad);
  const meta = DASH_STATUS_META[key];
  return {points: taskLoad, key, label: meta.label, rank: meta.rank, cls: meta.cls, isFullLeave, holiday};
}
function earliestAvailableFor(person, fromDateStr){
  let d = new Date((fromDateStr||todayISO())+"T00:00:00");
  for(let i=0;i<60;i++){
    const ds = toLocalISODate(d);
    if(!isWeekend(ds) && !isPublicHoliday(ds)){
      const {taskLoad, isFullLeave} = dayLoadFor(person, ds);
      if(!isFullLeave && taskLoad<=DAILY_CAP) return ds;
    }
    d.setDate(d.getDate()+1);
  }
  return null;
}
function addDaysISO(dateStr, n){
  const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  return toLocalISODate(d);
}

function isDateLocked(person, dateStr, incomingPts, priority){
  const {taskLoad, cap, isFullLeave} = dayLoadFor(person, dateStr);
  if(isFullLeave) return {locked:true, reason:"ลาเต็มวัน — ไม่สามารถแทรกงานได้ทุกกรณี (Hard Lock)"};
  if(priority !== "STANDARD") return {locked:false};
  if(taskLoad + incomingPts > cap) return {locked:true, reason:`เกิน Capacity (${(taskLoad+incomingPts).toFixed(2)}/${cap.toFixed(2)} pts) — งาน Standard ต้องเลือกวันที่ Capacity ยังไม่เต็ม`};
  return {locked:false};
}

// Single source of truth for "who is logged in" — every role goes through here, matched against
// Admin-managed User Management (STATE.users). This is also where a real backend would sit after a real
// Google OAuth exchange: verify the company email, then load name/department/role/status from the DB.
// `opts.viaGoogle`/`opts.viaPassword` record which of the two login channels this attempt came through,
// so a legitimate account using the wrong channel (a Designer typing their email into the Google box, or
// a PO trying the password form) gets a helpful redirect instead of a generic "not authorized" screen —
// password correctness itself is checked by the caller (completeDesignerLogin) before this ever runs.
function completeLogin(email, opts){
  opts = opts || {};
  const user = findUserByEmail(email);
  if(!user){
    STATE.accessDenied = true; STATE.accessDeniedEmail = email; STATE.googleChooserOpen = false; render(); return;
  }
  if(opts.viaGoogle && user.role!=='po'){
    toast('บัญชีนี้เป็น Designer / Lead Designer กรุณาเข้าสู่ระบบด้วย Email + Password'); return;
  }
  if(opts.viaPassword && user.role==='po'){
    toast('บัญชีนี้เป็น Project Owner กรุณาเข้าสู่ระบบด้วย Continue with Google'); return;
  }
  if(user.status!=='active'){
    STATE.accessDenied = true; STATE.accessDeniedEmail = email; STATE.googleChooserOpen = false; render(); return;
  }
  user.last_login = new Date().toISOString();
  saveUsers();
  // Designers/Lead keep identity = their name (unchanged from before) so assigned_user_name / PEOPLE / the
  // whole capacity engine keep matching exactly as they did pre-login-rebuild. PO/Admin identity = email,
  // also unchanged from before.
  const isDesignerLike = user.role==='designer' || user.role==='lead';
  const identity = isDesignerLike ? user.name : user.email;
  // STATE.auth.role stays 'designer' for a Lead Designer too — every existing permission check in the app
  // (canAct/isLead in the Task Detail modal, canManageLeave, etc.) already distinguishes the Lead from a
  // regular Designer by NAME (STATE.auth.identity===LEAD), not by a separate auth role, so introducing a
  // literal 'lead' auth role here would silently strip Krissha of her Lead-only actions. user.role itself
  // (on STATE.auth.user) still records the real "Lead Designer" identity/User-Management role for display.
  const authRole = isDesignerLike ? 'designer' : user.role;
  STATE.auth = {loggedIn:true, role:authRole, identity, isAdminUnlocked:user.role==='admin'||!!user.is_admin, user};
  STATE.accessDenied = false; STATE.accessDeniedEmail = null; STATE.googleChooserOpen = false;
  STATE.adminModeActive = false; STATE.adminModePanelOpen = false;
  if(user.role==='po'){ STATE.tab='workflow'; STATE.sideSection='poHome'; }
  else if(user.role==='admin'){ STATE.tab='workflow'; STATE.sideSection='users'; }
  else { STATE.tab='workspace'; STATE.sideSection='board'; }
  render();
}

function hexIsValid(hex){ return /^#[0-9A-Fa-f]{6}$/.test(hex); }
function normalizeHex(input){
  let h = (input||'').trim();
  if(!h.startsWith('#')) h = '#'+h;
  return h.toUpperCase();
}
function getContrastColor(hex){
  if(!hexIsValid(hex)) return '#0F172A';
  const h = hex.replace('#','');
  const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#0F172A' : '#FFFFFF';
}
function copyColorValue(text, toastLabel, iconEl){
  const after = ()=>{
    toast(toastLabel);
    if(iconEl){
      const orig = iconEl.textContent;
      iconEl.textContent = '✓';
      setTimeout(()=>{ iconEl.textContent = orig; }, 1400);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(after).catch(()=>toast('Unable to copy color'));
  } else {
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      after();
    }catch(e){ toast('Unable to copy color'); }
  }
}

  STATE.ciCategories.push(trimmed);
  await saveCICategories();
  render();
}
async function renameCICategory(oldName, newName){
  const trimmed = newName.trim();
  if(!trimmed || trimmed===oldName) return;
  if(STATE.ciCategories.includes(trimmed)){ toast('มีหมวดชื่อนี้อยู่แล้ว'); render(); return; }
  const idx = STATE.ciCategories.indexOf(oldName);
  if(idx===-1) return;
  STATE.ciCategories[idx] = trimmed;
  STATE.ciGuidelines.forEach(g=>{ if(g.category===oldName) g.category=trimmed; });
  if(STATE.ciUI.categoryFilter===oldName) STATE.ciUI.categoryFilter=trimmed;
  await Promise.all([saveCICategories(), saveCIGuidelines()]);
  render();
}
async function deleteCICategory(name){
  const count = STATE.ciGuidelines.filter(g=>g.category===name).length;
  if(count>0){
    toast(`This category contains ${count} guideline cards. Please move or delete them before removing the category.`);
    return;
  }
  STATE.ciCategories = STATE.ciCategories.filter(c=>c!==name);
  if(STATE.ciUI.categoryFilter===name) STATE.ciUI.categoryFilter='ALL';
  await saveCICategories();
  render();
}

  d.setDate(d.getDate()-dow);

// "My Work" merged Daily Timeline (Dev Handoff spec): every BRIEF entry loading onto dateStr (via
// taskBreakdownFor — the same single source of truth every other capacity view already reads, so this
// never disagrees with Team Dashboard/Calendar) plus every INTERNAL entry logged on dateStr, in one list
// so a Designer can see exactly where her day went. viewerCanManage lets a Lead viewing a colleague's day
// (from renderDesignerDrawer) reuse this same renderer with Add/Edit/Delete controls switched on.
function renderMyWorkTimeline(person, dateStr, viewerCanManage){
  const bd = taskBreakdownFor(person, dateStr);
  const briefRows = bd.tasks.slice().sort((a,b)=>(a.task_name||'').localeCompare(b.task_name||''));
  const internalRows = STATE.internalTasks.filter(it=>it.person===person && it.date===dateStr)
    .sort((a,b)=>(a.allDay?'':a.startTime||'99:99').localeCompare(b.allDay?'':b.startTime||'99:99'));
  const canManage = viewerCanManage===undefined ? canCreateInternalTaskFor(person) : viewerCanManage;
  if(briefRows.length===0 && internalRows.length===0){

let BRIEF_DRAFT = { platforms:new Set(), customPlatform:'', kv:'', priority:'STANDARD', prioritySource:'system_default', urgencyReason:'', urgencyNote:'', attachments:[], deptOther:'', typeOther:'', categoryOther:'' };
function uidShort(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

/* ---------- Visual Brief Editor: data-model helpers ---------- */
// Style defaults for a freshly-added Shape element — reuses the real WORLDTECH CI Primary Blue token
// (DEFAULT_PRIMARY_COLORS[0].hex) instead of hardcoding a color, per the redesign spec's explicit
// instruction not to invent new colors when a real Brand Token already exists.
function CI_DEFAULT_SHAPE_STYLE(){
  return {
    shape:'rect', fill:DEFAULT_PRIMARY_COLORS[0].hex, stroke:'transparent', borderWidth:0, radius:8, opacity:1,
    textColor:'#FFFFFF', fontFamily:'inherit', fontSize:14, fontWeight:400,
    textAlign:'center', vAlign:'middle', letterSpacing:0, lineHeight:1.4, textPadding:10,
  };
}
// Text Box — Fix Text Clipping (Master Dev Spec §32/33): a standalone Text element is Fixed Width +
// Auto Height — its box height is never left as a stale/user-dragged number, it's always recalculated
// from how the actual content wraps at the element's current width, using a single reused hidden
// measuring node (cheap enough to call on every keystroke/resize-drag tick without layout-thrashing the
// real canvas). Every call site that can change a text element's width, font settings or content calls
// this afterwards so the bounding box always covers 100% of the text — see call sites in
// bindVisualEditor() (typing, Properties panel font fields), startVBResize() (drag-resize) and the
// data-vbadd 'text' handler (initial creation).
let _vbTextMeasureEl = null;
function measureTextElementHeight(el, width){
  const s = (el && el.style) || {};
  if(!_vbTextMeasureEl){
    _vbTextMeasureEl = document.createElement('div');
    Object.assign(_vbTextMeasureEl.style, {
      position:'fixed', left:'-99999px', top:'0', visibility:'hidden',
      boxSizing:'border-box', overflowWrap:'anywhere', wordBreak:'break-word',
    });
    document.body.appendChild(_vbTextMeasureEl);
  }
  const weight = s.fontWeight!=null ? s.fontWeight : (s.bold?800:400);
  const node = _vbTextMeasureEl;
  node.style.width = Math.max(10, Math.round(width))+'px';
  node.style.fontFamily = s.fontFamily && s.fontFamily!=='inherit' ? s.fontFamily : 'var(--font-app)';
  node.style.fontSize = (s.fontSize||14)+'px';
  node.style.fontWeight = String(weight);
  node.style.lineHeight = String(s.lineHeight||1.4);
  node.style.letterSpacing = (s.letterSpacing||0)+'px';
  node.style.padding = (s.textPadding!=null?s.textPadding:4)+'px';
  node.innerHTML = (el && el.content && el.content.html) || '';
  return Math.max(30, node.scrollHeight);
}
function newVisualElement(type, overrides={}){
  const vb = BRIEF_DRAFT.visualBrief;
  const page = vb.pages.find(p=>p.id===vb.activePageId) || vb.pages[0];

  const base = {
    element_id: uidShort('el'), page_id: page.id, type,
    x:60, y:60, width:240, height:100, rotation:0,
    z_index: maxZ+1, locked:false,
    content:{}, style:{},
    created_by: STATE.auth.identity||'unknown', created_at: nowIso(), updated_at: nowIso(),
  };
  return Object.assign(base, overrides);
}

/* ---------- Drafts (Dev Brief §26/§27): save-before-submit + autosave. A Draft is stored in its own
   STATE.drafts list as a task-SHAPED object so it can be rehydrated with the exact same
   loadBriefDraftFromTask() used for "Edit Brief" — no separate parsing/restore code path to maintain.
   Drafts never touch STATE.tasks, so they never appear on the Process Board and never count toward
   Capacity — that guarantee falls out for free from submitBrief() being the only place a task is created. ---------- */
function myOwnedTasks(){ return STATE.tasks.filter(t=>t.project_owner_email===STATE.auth.identity); }
function myDrafts(){ return STATE.drafts.filter(d=>d.owner_email===STATE.auth.identity); }
function buildDraftSnapshot(){
  const platforms = Array.from(BRIEF_DRAFT.platforms).map(p=>p==='อื่นๆ ระบุ' ? (BRIEF_DRAFT.customPlatform.trim()||'อื่นๆ') : p);
  // project_owner_email here is the Brief Owner, not the drafter — for a Designer/Lead Designer drafting on
  // someone else's behalf that's whatever they've typed into the visible "Brief Owner Email" field so far
  // (see renderBriefForm), same as the real submitBrief() path. Who actually owns/can-resume this Draft is
  // tracked separately as owner_email (always STATE.auth.identity — see the draft object built below).
  const ownerEmailField = document.getElementById('f_owner')?.value?.trim();
  return {
    created_by_email: STATE.auth.user?.email || STATE.auth.identity,
    created_by_name: STATE.auth.user?.name || STATE.auth.identity,
    created_by_role: STATE.auth.user?.role || STATE.auth.role,
    project_owner_email: ownerEmailField || STATE.auth.identity,
    department: STATE.auth.user?.department || '',
    department_other: null,
    project_name: document.getElementById('f_project')?.value?.trim() || '',
    task_name: document.getElementById('f_taskname')?.value || '',
    task_category: document.getElementById('f_category')?.value || '',
    task_type: document.getElementById('f_type')?.value || '',
    task_type_other: BRIEF_DRAFT.typeOther || null,
    kv_status_check: BRIEF_DRAFT.kv || null,
    kv_asset_link: document.getElementById('f_kvlink_input')?.value || '',
    deliverables: Number(document.getElementById('f_deliverables')?.value || 1),
    resize_quantity: Number(document.getElementById('f_resize')?.value || 0),
    platform: platforms,
    priority: BRIEF_DRAFT.priority,
    prefer_delivery_date: STATE.cal.selectedDate,
    brief_link: document.getElementById('f_brieflink')?.value || '',
    brief_details: {
      header: document.getElementById('f_header')?.value || '',
      sub_header: document.getElementById('f_subheader')?.value || '',
      detail: document.getElementById('f_detail')?.value || '',
      cta: document.getElementById('f_cta')?.value || '',
      disclaimer: document.getElementById('f_disclaimer')?.value || '',
      attachments: BRIEF_DRAFT.attachments.slice(),
      extra_links: BRIEF_DRAFT.extraLinks.slice(),
      visual_brief: {pages: JSON.parse(JSON.stringify(BRIEF_DRAFT.visualBrief.pages))},
    },
  };
}
function isBriefFormEffectivelyEmpty(snap){
  return !snap.task_name && !snap.project_name && !snap.task_category && !snap.brief_details.detail && !snap.brief_details.header;
}
async function upsertDraft(){
  const snap = buildDraftSnapshot();
  const id = STATE.editingDraftId || genId('DRAFT');
  const draft = {id, task_id:id, owner_email: STATE.auth.identity, updated_at: new Date().toISOString(), ...snap};
  const idx = STATE.drafts.findIndex(d=>d.id===id);
  if(idx>=0) STATE.drafts[idx] = draft; else STATE.drafts.push(draft);
  STATE.editingDraftId = id;
  await saveDrafts();
  return draft;
}
function updateBriefAutosavePill(){
  const pill = document.getElementById('briefAutosavePill');
  if(!pill) return;
  const label = STATE.briefAutosaveState==='editing' ? 'Saving…'
    : STATE.briefAutosaveState==='saved' ? `Saved automatically ${STATE.briefAutosaveAt ? new Date(STATE.briefAutosaveAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : ''}`
    : '';
  pill.textContent = label;
  pill.className = 'vbe-savepill ' + (STATE.briefAutosaveState==='editing' ? 'editing' : STATE.briefAutosaveState==='saved' ? 'saved' : '');
  pill.style.display = label ? 'inline-block' : 'none';
}
let briefDraftAutosaveTimer = null;
function scheduleBriefDraftAutosave(){
  // Autosave-as-Draft only applies to a Project Owner composing a NEW brief — editing an already-submitted
  // brief (STATE.editingTaskId set) goes through its own Revision history instead, unchanged.
  if(STATE.auth.role!=='po' || STATE.editingTaskId) return;
  STATE.briefAutosaveState = 'editing'; updateBriefAutosavePill();
  if(briefDraftAutosaveTimer) clearTimeout(briefDraftAutosaveTimer);
  briefDraftAutosaveTimer = setTimeout(async ()=>{
    const snap = buildDraftSnapshot();
    if(isBriefFormEffectivelyEmpty(snap)){ STATE.briefAutosaveState='idle'; updateBriefAutosavePill(); return; }
    await upsertDraft();
    STATE.briefAutosaveState = 'saved'; STATE.briefAutosaveAt = new Date().toISOString();
    updateBriefAutosavePill();
  }, 1500);
}
async function saveDraftManually(){
  const snap = buildDraftSnapshot();
  if(isBriefFormEffectivelyEmpty(snap)){ toast('กรอกข้อมูลอย่างน้อยชื่องานก่อนบันทึกฉบับร่าง'); return; }
  await upsertDraft();
  STATE.briefAutosaveState='saved'; STATE.briefAutosaveAt=new Date().toISOString(); updateBriefAutosavePill();
  toast('💾 บันทึกฉบับร่างแล้ว — ดูได้ที่ Drafts');
}
function resumeDraft(draftId){
  const draft = STATE.drafts.find(d=>d.id===draftId);
  if(!draft) return;
  loadBriefDraftFromTask(draft); // reuses the exact "Edit Brief" rehydration path — same field shape
  STATE.editingTaskId = null; // a Draft was never submitted — must NOT take the Edit/Revision path in submitBrief()
  STATE.editingDraftId = draft.id;
  STATE.briefAutosaveState='saved'; STATE.briefAutosaveAt=draft.updated_at;
  STATE.tab='workflow'; STATE.sideSection='brief';
  render();
}
async function deleteDraft(draftId){
  if(!confirm('ลบ Draft นี้?')) return;
  STATE.drafts = STATE.drafts.filter(d=>d.id!==draftId);
  await saveDrafts();
  render();
}

/* ---------- Project Owner-facing simplified status (Dev Brief §22/§23) ----------
   Collapses the richer internal Designer workflow (STATUS_ORDER/STATUS_LABEL, unchanged) into the 5 steps
   a Project Owner should see. Internal statuses/logic are not touched — this is a pure display mapping. */
const PO_STATUS_STEPS = ['submitted','assigned','in_progress','review','completed'];
const PO_STATUS_LABEL = {submitted:'Submitted', assigned:'Assigned', in_progress:'In Progress', review:'Review', completed:'Completed', rejected:'Rejected'};
function poStatus(t){
  const s = t.review_status;
  if(['rejected','closed_max_revision'].includes(s)) return 'rejected';
  if(s==='delivered') return 'completed';
  if(['pending_review','pending_client_review','revision'].includes(s)) return 'review';
  if(s==='in_progress') return 'in_progress';
  if(s==='new') return 'assigned';
  return 'submitted'; // pending_lead_approval
}
// Master Dev Spec §11 — UX rule: a Project Owner's view must prioritize Task Name -> Status -> DL ->
// Required Action -> Artwork/Platform -> Brief Date -> Last Update -> Designer (Designer is secondary
// info for a PO, unlike the internal Process Board where the Designer/assignee is a primary field).
// "Required Action" tells the PO in plain language what's currently happening / what they need to do —
// mine:true marks the one state where the PO themselves is the one blocking progress (Final Check).
function poRequiredAction(t){
  const s = t.review_status;
  if(s==='pending_lead_approval') return {text:'รอ Lead Designer อนุมัติ', mine:false};
  if(s==='new') return {text:'รอ Designer เริ่มงาน', mine:false};
  if(s==='in_progress') return {text:'Designer กำลังทำงาน', mine:false};
  if(s==='pending_review'||s==='pending_client_review') return {text:'⚠ รอคุณตรวจสอบ/ยืนยันงาน', mine:true};
  if(s==='revision') return {text:'Designer กำลังแก้ไขงาน', mine:false};
  if(s==='delivered') return {text:'✓ ส่งมอบเรียบร้อย', mine:false};
  if(['rejected','closed_max_revision'].includes(s)) return {text:'บรีฟถูกปฏิเสธ', mine:false};
  return {text:'', mine:false};
}
function lastUpdateOf(t){
  const hist = t.review_history||[];
  return (hist.length ? hist[hist.length-1].timestamp : null) || t.brief_timestamp;
}

/* ---------- Backdated Task (Master Dev Spec Phase G) ----------
   Designer/Lead Designer only — a Project Owner never sees this entry point (see PO_FORBIDDEN_SECTIONS
   and the sidebar groups above). Logs work that already happened outside the normal Brief -> Assign ->
   Process Board flow, so it deliberately skips Auto-Assign/Capacity-blocking/KV requirements/Visual Brief:
   it's a record of completed-or-ongoing work, not a new request. Three distinct dates matter here:
   Actual Brief Date and Actual Delivery Date are whatever the user says (freely backdated, stored as
   brief_timestamp/prefer_delivery_date so every existing Capacity/KPI/Dashboard view attributes the point
   to that real period for free) — system_created_at is separate and ALWAYS "now", never backdated, so
   there's always an honest record of when the entry was actually made in the system. */
function canCreateBackdated(){ return STATE.auth.loggedIn && STATE.auth.role==='designer'; }
let BACKDATED_DRAFT = { kv:'' };
const BACKDATED_STATUS_OPTIONS = [
  {value:'todo', label:'To Do', review_status:'new'},
  {value:'in_progress', label:'In Progress', review_status:'in_progress'},
  {value:'revision', label:'Revision', review_status:'revision'},
  {value:'pending', label:'Pending', review_status:'pending_review'},
  {value:'completed', label:'Completed', review_status:'delivered'},
];
const PRIORITY_TH_LABEL = {CRITICAL:'Critical', URGENT:'Urgent', PRIORITY:'Priority', STANDARD:'Standard', UNKNOWN:'Unknown (Deadline ไม่ทราบ)'};
const DEADLINE_STATUS_TH = {Completed:'Completed', Unknown:'ไม่ทราบ', Overdue:'Overdue (เลยกำหนดเดิมแล้ว)', 'Due Soon':'Due Soon (ใกล้ครบกำหนดเดิม)', 'On Track':'On Track'};
// Dev Spec — Backdated Task & Historical Work Migration §5: for BACKDATED/MIGRATED records, Priority is
// NEVER derived from Today or System Created At — only from the historical Actual Brief Date -> Original
// Deadline window, reusing the exact same SLA tiers (priorityFromDiff/workingDaysBetween) that already
// drive Priority everywhere else in the app. §16 Deadline Unknown short-circuits to 'UNKNOWN' rather than
// guessing from Actual Delivery Date / Created At / Today.
function historicalPriorityFor(briefDate, deadlineDate, deadlineUnknown){
  if(deadlineUnknown || !briefDate || !deadlineDate) return 'UNKNOWN';
  return priorityFromDiff(workingDaysBetween(briefDate, deadlineDate));
}
// §6 Historical Priority ≠ Current Urgency: Current Deadline Status only says whether the ORIGINAL
// deadline has since passed — it must never feed back into (or overwrite) Historical Priority.
function currentDeadlineStatusFor(deadlineDate, deadlineUnknown, isCompleted){
  if(isCompleted) return 'Completed';
  if(deadlineUnknown || !deadlineDate) return 'Unknown';
  const today = todayISO();
  if(deadlineDate < today) return 'Overdue';
  if(deadlineDate <= addBusinessDays(today,1)) return 'Due Soon';
  return 'On Track';
}
// §9 Current Capacity for a Backdated Active Task: Capacity must start counting from the day the record
// is brought into the Current Workflow (System Created At / today), never retroactively from the historical
// Brief Date — but if the Original Deadline is genuinely still in the future, target that date instead of
// artificially pulling it back to today.
function liveTargetDateForActiveBackdated(deadlineDate, deadlineUnknown){
  const today = todayISO();
  if(!deadlineUnknown && deadlineDate && deadlineDate > today) return deadlineDate;
  return today;
}

function bindBackdatedTaskForm(){
  if(!document.getElementById('backdatedForm')) return;
  BACKDATED_DRAFT = { kv:'' };
  const updateCalcPriority = ()=>{
    const briefDate = document.getElementById('bt_briefdate')?.value || '';
    const deadlineDate = document.getElementById('bt_deadline')?.value || '';
    const deadlineUnknown = !!document.getElementById('bt_deadline_unknown')?.checked;
    const isCompleted = document.getElementById('bt_workstatus')?.value === 'completed';
    const calcEl = document.getElementById('btCalcPriority');
    const statusEl = document.getElementById('btDeadlineStatusHint');
    // Show "—" (nothing calculated yet) until there's at least a Brief Date to work from, rather than
    // eagerly flashing "Unknown" before the Designer/Lead has typed anything.
    if(!briefDate){
      if(calcEl) calcEl.textContent = '—';
      if(statusEl) statusEl.textContent = 'กรอก Actual Brief Date และ Original Deadline เพื่อคำนวณ Priority';
      return;
    }
    const calc = historicalPriorityFor(briefDate, deadlineDate, deadlineUnknown);
    if(calcEl) calcEl.textContent = PRIORITY_TH_LABEL[calc] || calc;
    if(statusEl){ const status = currentDeadlineStatusFor(deadlineDate, deadlineUnknown, isCompleted); statusEl.textContent = `Deadline Status: ${DEADLINE_STATUS_TH[status]||status}`; }
  };
  document.getElementById('bt_owner')?.addEventListener('input', e=>{
    const preview = document.getElementById('btOwnerAutoPreview');
    if(preview) preview.innerHTML = renderOwnerAutoPreviewHTML(e.target.value);
  });
  document.getElementById('bt_category')?.addEventListener('change', e=>{
    const cat = MASTER_TABLE[e.target.value];
    const typeEl = document.getElementById('bt_type');
    const kvWrap = document.getElementById('btKvWrap');
    const customWrap = document.getElementById('btCustomWrap');
    // §11: leaving E-Commerce (or clearing Category) always clears the stored KV Status back to null.
    BACKDATED_DRAFT.kv = '';
    const kvSelect = document.getElementById('bt_kv'); if(kvSelect) kvSelect.value = '';
    if(!cat){ typeEl.disabled = true; typeEl.innerHTML = '<option value="">— เลือกประเภท Artwork —</option>'; kvWrap.style.display='none'; customWrap.style.display='none'; return; }
    typeEl.disabled = false;
    typeEl.innerHTML = '<option value="">— เลือกประเภท Artwork —</option>' + Object.keys(cat.types).map(t=>`<option value="${t}">${t}</option>`).join('');
    kvWrap.style.display = (e.target.value==='E-Commerce') ? 'block' : 'none';
    customWrap.style.display = 'none';
  });
  document.getElementById('bt_type')?.addEventListener('change', e=>{
    const catVal = document.getElementById('bt_category').value;
    const def = MASTER_TABLE[catVal]?.types?.[e.target.value];
    document.getElementById('btCustomWrap').style.display = (def && def.custom) ? 'block' : 'none';
  });
  document.getElementById('bt_kv')?.addEventListener('change', e=>{ BACKDATED_DRAFT.kv = e.target.value; });
  document.getElementById('bt_briefdate')?.addEventListener('input', updateCalcPriority);
  document.getElementById('bt_deadline')?.addEventListener('input', updateCalcPriority);
  document.getElementById('bt_deadline_unknown')?.addEventListener('change', e=>{
    const deadlineEl = document.getElementById('bt_deadline');
    if(deadlineEl){ deadlineEl.disabled = e.target.checked; if(e.target.checked) deadlineEl.value=''; }
    updateCalcPriority();
  });
  document.getElementById('bt_workstatus')?.addEventListener('change', e=>{
    const completed = e.target.value === 'completed';
    const deliveryWrap = document.getElementById('btDeliveryWrap');
    if(deliveryWrap) deliveryWrap.style.display = completed ? 'block' : 'none';
    const assigneeReq = document.getElementById('btAssigneeReq');
    if(assigneeReq) assigneeReq.style.display = completed ? 'none' : 'inline';
    updateCalcPriority();
  });
  document.getElementById('bt_override_toggle')?.addEventListener('change', e=>{
    const wrap = document.getElementById('btOverrideWrap');
    if(wrap) wrap.style.display = e.target.checked ? 'grid' : 'none';
  });
  updateCalcPriority();
  document.getElementById('clearBackdatedBtn')?.addEventListener('click', ()=>{
    // UX: only interrupt with a confirmation if the Designer has actually typed/selected something —
    // an empty/untouched form clears silently, same as every other "Clear Form" control in the app.
    const dirty = ['bt_owner','bt_taskname','bt_category','bt_reason'].some(id=>(document.getElementById(id)?.value||'').trim());
    if(dirty && !confirm('ต้องการล้างข้อมูลทั้งหมดหรือไม่? ข้อมูลที่กรอกไว้จะหายไป')) return;
    render();
    toast('ล้างฟอร์มแล้ว');
  });
  document.getElementById('backdatedForm').onsubmit = submitBackdatedTask;
}

  const submitBtn = document.getElementById('submitBackdatedBtn');
  if(submitBtn?.disabled) return; // guard against double-submit while a save is already in flight
  document.querySelectorAll('.bt-invalid').forEach(el=>el.classList.remove('bt-invalid'));
  const ownerEmail = document.getElementById('bt_owner')?.value?.trim() || '';
  const taskName = document.getElementById('bt_taskname')?.value?.trim() || '';
  const category = document.getElementById('bt_category')?.value || '';
  const typeName = document.getElementById('bt_type')?.value || '';
  const briefDate = document.getElementById('bt_briefdate')?.value || '';
  const deadlineUnknown = !!document.getElementById('bt_deadline_unknown')?.checked;
  const deadlineDate = deadlineUnknown ? '' : (document.getElementById('bt_deadline')?.value || '');
  const statusVal = document.getElementById('bt_workstatus')?.value || 'todo';
  const statusMeta = BACKDATED_STATUS_OPTIONS.find(o=>o.value===statusVal) || BACKDATED_STATUS_OPTIONS[0];
  const isCompleted = statusMeta.review_status === 'delivered';
  const deliveryDate = document.getElementById('bt_deliverydate')?.value || '';
  const assigneeEl = document.getElementById('bt_assignee');
  const assignedDesigner = assigneeEl?.value || (STATE.auth.user?.name || STATE.auth.identity);
  const reason = document.getElementById('bt_reason')?.value?.trim() || '';
  const lead = isLead();
  const overrideActive = lead && !!document.getElementById('bt_override_toggle')?.checked;
  const overrideValue = overrideActive ? (document.getElementById('bt_override_value')?.value || 'STANDARD') : '';
  const overrideReason = overrideActive ? (document.getElementById('bt_override_reason')?.value?.trim() || '') : '';
  if(!ownerEmail || !ownerEmail.includes('@')){ toast('กรุณากรอก Brief Owner Email ให้ถูกต้อง'); markBtFieldInvalid('bt_owner'); return; }
  if(!taskName){ toast('กรุณากรอกชื่องาน'); markBtFieldInvalid('bt_taskname'); return; }
  if(!category || !typeName){ toast('กรุณาเลือกหมวดหมู่และประเภทงาน'); markBtFieldInvalid(!category?'bt_category':'bt_type'); return; }
  if(category==='E-Commerce' && !BACKDATED_DRAFT.kv){ toast('กรุณาระบุ KV Status'); markBtFieldInvalid('bt_kv'); return; }
  if(!briefDate){ toast('กรุณาระบุ Actual Brief Date'); markBtFieldInvalid('bt_briefdate'); return; }
  if(!deadlineUnknown && !deadlineDate){ toast('กรุณาระบุ Original Deadline หรือเลือก "ไม่ทราบ Original Deadline"'); markBtFieldInvalid('bt_deadline'); return; }
  if(isCompleted && !deliveryDate){ toast('กรุณาระบุ Actual Delivery Date เมื่อ Status = Completed'); markBtFieldInvalid('bt_deliverydate'); return; }
  if(!isCompleted && !assignedDesigner){ toast('กรุณาระบุ Assigned Designer'); markBtFieldInvalid('bt_assignee'); return; }
  if(!reason){ toast('กรุณาระบุเหตุผล (บังคับกรอก)'); markBtFieldInvalid('bt_reason'); return; }
  if(overrideActive && !overrideReason){ toast('กรุณาระบุเหตุผลสำหรับ Override Priority'); markBtFieldInvalid('bt_override_reason'); return; }
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'กำลังบันทึก...'; }
  const def = MASTER_TABLE[category]?.types?.[typeName];
  const deliverables = Number(document.getElementById('bt_deliverables')?.value || 1);
  const resizeQty = Number(document.getElementById('bt_resize')?.value || 0);
  const customPoints = Number(document.getElementById('bt_custom')?.value || 0);
  const base = (def && def.custom ? customPoints : pointsForTask({task_category:category, task_type:typeName, kv_status_check:BACKDATED_DRAFT.kv, deliverables})) + resizePoints(resizeQty);
  // §5 Historical Priority is calculated from Actual Brief Date -> Original Deadline ONLY, never from
  // Today or System Created At. §10 lets the Lead Designer override it, with a mandatory Reason and a full
  // Audit Log entry (Calculated / Override / Reason / Changed By / Changed At) — Designer never can.
  const calculatedPriority = historicalPriorityFor(briefDate, deadlineDate, deadlineUnknown);
  const effectivePriority = overrideActive ? overrideValue : (calculatedPriority==='UNKNOWN' ? 'STANDARD' : calculatedPriority);
  const now = nowIso();
  const priorityOverride = overrideActive ? {
    calculated: calculatedPriority, value: overrideValue, reason: overrideReason,
    changed_by: STATE.auth.user?.name || STATE.auth.identity, changed_at: now,
  } : null;
  // §14: an Active (non-Completed) task must be assigned and enter that Designer's Current Queue; a
  // Completed one just needs Assigned Designer recorded for Historical Performance/KPI attribution.
  const finalAssignee = assignedDesigner || STATE.auth.user?.name || STATE.auth.identity;
  // §7/§9: a Completed record is attributed to its real historical Actual Delivery Date (so it counts
  // toward that period's KPI, never today's); an Active one only starts affecting Current Capacity from
  // today (or a still-future Original Deadline) forward — never retroactively into the historical dates.
  const liveDeliveryDate = isCompleted ? deliveryDate : liveTargetDateForActiveBackdated(deadlineDate, deadlineUnknown);
  const owner = findUserByEmail(ownerEmail);
  const task = {
    task_id: uid(),
    created_by_email: STATE.auth.user?.email || STATE.auth.identity,
    created_by_name: STATE.auth.user?.name || STATE.auth.identity,
    created_by_role: STATE.auth.user?.role || STATE.auth.role,
    project_owner_email: ownerEmail, department: owner?.department || '', department_other: null,
    project_name: '', task_name: taskName,
    priority: effectivePriority, needsApproval: false, platform: [],
    task_category: category, task_type: typeName, task_type_other: null,
    kv_status_check: (category==='E-Commerce') ? BACKDATED_DRAFT.kv : null, kv_asset_link: '',
    deliverables, original_deliverables: deliverables, resize_quantity: resizeQty, quantity_change_history: [],
    customPoints: def && def.custom ? customPoints : 0,
    brief_link: '', brief_details: {header:'',sub_header:'',detail:'',cta:'',disclaimer:'',attachments:[],extra_links:[],visual_brief:defaultVisualBrief()},
    // Actual Brief Date reuses the same field every other view already reads (Capacity/KPI/Dashboard/
    // Calendar), giving "attributed to the actual time period" for free once prefer_delivery_date below is
    // set correctly for each status.
    brief_timestamp: briefDate+"T00:00:00.000Z",
    prefer_delivery_date: liveDeliveryDate, sla_date: liveDeliveryDate,
    assigned_role: (MASTER_TABLE[category]||{}).role || 'Pending Assignment',
    suggested_designer: finalAssignee, assigned_user_name: finalAssignee,
    base_points: Math.round(base*100)/100,
    capacity_allocation: null,
    revise_status: 'None', aw_link:'', aw_delivery_timestamp:'',
    // Backdated Status handling: Completed skips the whole workflow (terminal 'delivered' immediately, no
    // Current Queue / Capacity / Auto-Assign / Bypass Capacity / Urgent Notification triggered — §7); any
    // other status enters the Process Board exactly like a normal task at that stage — §8/§13.
    review_status: statusMeta.review_status,
    review_comment:'', revision_count:0, edit_revision:1, edit_history:[], deadline_extension_request:null,
    prioritySource:'system_default', projectedCapacity:null, overCapacity:false,
    urgencyReason:null, urgencyNote:null, overrideBy:null, overrideAt:null,
    is_backdated: true, backdated_reason: reason,
    // §2 Record Source: distinguishes this from a normal LIVE brief and a future bulk MIGRATED import —
    // Created At/System Created At below is for Audit ONLY and must never be used to compute Priority.
    record_source: 'BACKDATED',
    historical_brief_date: briefDate,
    historical_deadline_date: deadlineUnknown ? null : deadlineDate,
    historical_deadline_unknown: deadlineUnknown,
    actual_delivery_date: isCompleted ? deliveryDate : null,
    historical_priority: calculatedPriority,
    priority_override: priorityOverride,
    system_created_at: now, // NEVER backdated — the honest "actually entered on" timestamp, Audit-only
    review_history: [{timestamp: now, action:'BACKDATED_TASK_CREATED',
      comment: `Actual Brief Date: ${fmtDate(briefDate)} · Original Deadline: ${deadlineUnknown?'ไม่ทราบ':fmtDate(deadlineDate)} · Actual Delivery Date: ${deliveryDate?fmtDate(deliveryDate):'-'} · Historical Priority: ${calculatedPriority}${priorityOverride?` (Override → ${priorityOverride.value})`:''} · สถานะ: ${statusMeta.label} · Assigned: ${finalAssignee} · เหตุผล: ${reason}`,
      by: STATE.auth.user?.name || STATE.auth.identity || 'system'}],
  };
  if(priorityOverride){
    task.review_history.push({timestamp: now, action:'PRIORITY_OVERRIDE',
      comment: `Calculated: ${priorityOverride.calculated} → Override: ${priorityOverride.value} — เหตุผล: ${priorityOverride.reason}`,
      by: priorityOverride.changed_by});
  }
  STATE.tasks.push(task);
  await saveTasks();
  toast(`📌 บันทึก Backdated Task แล้ว — ${taskDisplayName(task)}`);
  STATE.sideSection = 'board';
  render();
}

// Text elements use the exact same select/drag-vs-edit model as Shape's inline text (see the comment
// above renderShapeBlockHTML): contenteditable + pointer-events are only switched on while
// STATE.vbTextEditId matches this element (double-click to enter). Outside edit mode the div is
// non-interactive (pointer-events:none), so a plain click/drag hits the .vbe-el wrapper underneath and
// goes through the normal select/move path — it never gets swallowed as a native text-caret placement.
function renderTextBlockHTML(el){
  const s = el.style||{};
  const weight = s.fontWeight!=null ? s.fontWeight : (s.bold?800:400);
  const isEditing = STATE.vbTextEditId===el.element_id;
  const styleStr = `font-family:${s.fontFamily&&s.fontFamily!=='inherit'?s.fontFamily:'var(--font-app)'};font-size:${s.fontSize||14}px;font-weight:${weight};text-align:${s.align||'left'};color:${s.color||'#0F172A'};line-height:${s.lineHeight||1.4};letter-spacing:${s.letterSpacing||0}px;padding:${s.textPadding!=null?s.textPadding:4}px;cursor:${isEditing?'text':'inherit'};pointer-events:${isEditing?'auto':'none'};`;
  return `<div class="vbe-el-text" contenteditable="${isEditing && !el.locked ? 'true':'false'}" data-textedit="${el.element_id}" style="${styleStr}" title="${s.link?('Link: '+s.link):''}">${el.content.html||''}</div>`;
}
// Shapes and standalone Text elements share one inline-edit model: double-click to enter edit mode
// (see the dblclick handler in bindVisualEditor() and STATE.vbTextEditId). The text node shares the
// same data-textedit / blur-to-save mechanism across Shape/Text/Note; contenteditable + pointer-events
// are only switched on while STATE.vbTextEditId matches this element, so a plain single click always
// selects/drags the element like Image does — it never falls into native text-caret/selection instead.
function renderShapeBlockHTML(el){
  const s = el.style||{}, c = el.content||{};
  const shape = s.shape||'rect';
  if(shape==='line'){
    return `<div class="vbe-el-shape" style="background:${s.fill||DEFAULT_PRIMARY_COLORS[0].hex};height:${s.borderWidth||4}px;margin-top:calc(50% - ${(s.borderWidth||4)/2}px);opacity:${s.opacity!=null?s.opacity:1}"></div>`;
  }
  const radius = shape==='circle' ? '50%' : `${s.radius!=null?s.radius:8}px`;
  const boxStyle = `background:${s.fill||DEFAULT_PRIMARY_COLORS[0].hex};border:${s.borderWidth||0}px solid ${s.stroke&&s.stroke!=='transparent'?s.stroke:'transparent'};border-radius:${radius};opacity:${s.opacity!=null?s.opacity:1};position:relative`;
  const isEditing = STATE.vbTextEditId===el.element_id;
  const vAlignMap = {top:'flex-start', middle:'center', bottom:'flex-end'};
  const hAlignMap = {left:'flex-start', center:'center', right:'flex-end'};
  const pad = s.textPadding!=null ? s.textPadding : 10;
  const textStyle = `font-family:${s.fontFamily&&s.fontFamily!=='inherit'?s.fontFamily:'var(--font-app)'};`+
    `font-size:${s.fontSize||14}px;font-weight:${s.fontWeight||400};color:${s.textColor||'#FFFFFF'};`+
    `text-align:${s.textAlign||'center'};line-height:${s.lineHeight||1.4};letter-spacing:${s.letterSpacing||0}px;`+
    `padding:${pad}px;display:flex;align-items:${vAlignMap[s.vAlign||'middle']};justify-content:${hAlignMap[s.textAlign||'center']};`+
    `width:100%;height:100%;box-sizing:border-box;overflow:auto;outline:none;word-break:break-word;`+
    `cursor:${isEditing?'text':'inherit'};pointer-events:${isEditing?'auto':'none'}`;
  return `<div class="vbe-el-shape" style="${boxStyle}">
    <div class="vbe-el-shape-text" contenteditable="${isEditing && !el.locked ? 'true' : 'false'}" data-textedit="${el.element_id}" data-shapetext="1" style="${textStyle}">${c.html||''}</div>
  </div>`;
}
function renderNoteBlockHTML(el){
  return `<div class="vbe-el-note" contenteditable="${el.locked?'false':'true'}" data-textedit="${el.element_id}">${el.content.html||'Note…'}</div>`;
}
function renderImageBlockHTML(el){
  const c = el.content||{}, s = el.style||{};
  if(!c.dataUrl) return `<div class="vbe-el-image"><span style="font-size:22px;color:var(--ink-faint)">🖼️</span></div>`;
  const crop = c.crop;
  // Image Crop Tool (§35/§36): a crop is applied non-destructively — c.dataUrl is always the original
  // upload, untouched; only a normalized {x,y,w,h} sub-rectangle (crop) is stored, and rendered here as a
  // background-image sized/positioned so exactly that sub-rectangle fills the box. See the box-model
  // derivation in openImageCropModal()/applyImageCropFromState() below.
  if(crop && crop.w>0 && crop.h>0 && !(crop.x<=0 && crop.y<=0 && crop.w>=1 && crop.h>=1)){
    const bgSizeX = crop.w>0 ? 100/crop.w : 100;
    const bgSizeY = crop.h>0 ? 100/crop.h : 100;
    const bgPosX = crop.w<1 ? (100*crop.x/(1-crop.w)) : 0;
    const bgPosY = crop.h<1 ? (100*crop.y/(1-crop.h)) : 0;
    return `<div class="vbe-el-image" style="background-image:url('${c.dataUrl}');background-repeat:no-repeat;background-size:${bgSizeX}% ${bgSizeY}%;background-position:${bgPosX}% ${bgPosY}%;opacity:${s.opacity!=null?s.opacity:1}"></div>`;
  }
  return `<div class="vbe-el-image"><img src="${c.dataUrl}" style="object-fit:${s.objectFit||'cover'};opacity:${s.opacity!=null?s.opacity:1}"></div>`;
}

}

// Patch any currently-rendered dynamic_summary / brief_field blocks in place (their own inner

function syncSummaryBlocksInPlace(){

/* ---------- WORLDTECH Color Picker Popover ----------
   One shared, contextual floating component reused for Text Color, Shape Fill/Stroke and Canvas
   Background — replaces the old always-visible "CI Color Palette" strip that used to sit below the
   Canvas (Designer had to scroll away from the element they were editing to use it). Structure follows
   the Google Docs/Slides reference: WORLDTECH CI swatches (rounded-square, real Brand Color tokens) ->
   Custom (+ Custom Color / Eyedropper) -> a 10-column general Color Palette grid (circular swatches,
   8 shades per hue, generated from HSL so the ramp stays consistent rather than 80 hand-picked hexes)
   -> a Hex field. Opens right next to whichever Color control (a "trigger" button) was clicked. */
function hslToHex(h, s, l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}
function paletteRamp(hue, sat){ return [96,88,76,63,50,38,27,17].map(l=>hslToHex(hue, sat, l)); }
const COLOR_PALETTE_ROWS = 8;
const COLOR_PALETTE_COLUMNS = [
  {name:'Gray', shades:['#FFFFFF','#F1F3F4','#DADCE0','#BDC1C6','#9AA0A6','#5F6368','#3C4043','#202124']},
  {name:'Red', shades:paletteRamp(4, 72)},
  {name:'Orange', shades:paletteRamp(28, 82)},
  {name:'Yellow', shades:paletteRamp(45, 85)},
  {name:'Green', shades:paletteRamp(142, 50)},
  {name:'Teal', shades:paletteRamp(178, 55)},
  {name:'Blue', shades:paletteRamp(214, 75)},
  {name:'Purple', shades:paletteRamp(262, 50)},
  {name:'Pink', shades:paletteRamp(330, 62)},
  {name:'Brown', shades:paletteRamp(22, 40)},
];
// A "Color" control anywhere in Properties — Text Color, Shape Fill/Stroke, Canvas Background — is
// rendered as this trigger button (swatch + hex + caret) instead of a native <input type="color">.
// data-vbcpopen names which property it edits; openColorPicker() reads that off the clicked button.
function vbcpTriggerHTML(prop, hex){
  const h = (hex||'#000000').toUpperCase();
  return `<button type="button" class="vbcp-trigger" data-vbcpopen="${prop}"><span class="vbcp-swatchdot" style="background:${h}"></span><span class="vbcp-hexlabel">${h}</span><span class="vbcp-caret">▾</span></button>`;
}
function vbcpIsLight(hex){
  const r=parseInt(hex.slice(1,3),16)||0, g=parseInt(hex.slice(3,5),16)||0, b=parseInt(hex.slice(5,7),16)||0;
  return (0.299*r + 0.587*g + 0.114*b) > 175;
}
function vbcpSwatchHTML(hex, current, {ci=false, title=''}={}){
  const isSel = hex.toUpperCase()===String(current||'').toUpperCase();
  return `<button type="button" class="vbcp-swatch ${ci?'ci':''} ${isSel?'selected':''} ${vbcpIsLight(hex)?'light':''}" data-vbcpcolor="${hex}" style="background:${hex}" title="${title||hex}"></button>`;
}
// The current value of whichever property the popover is targeting — drives the checkmark on the
// matching swatch and the hex field's starting value.
function vbColorPickerCurrentHex(){
  const cp = STATE.vbColorPicker;

  if(cp.prop==='pageBg'){ const page = activeVBPage(); return (page && page.bgColor) || '#FFFFFF'; }
  const el = getSingleSelectedEl();

  if(cp.prop==='textColor') return (el.type==='shape' ? s.textColor : s.color) || (el.type==='shape' ? '#FFFFFF' : '#0F172A');
  return '#1B76FF';
}
function openColorPicker(prop, btnEl){

function applyColorPickerValue(hex){
  const cp = STATE.vbColorPicker;
  if(!cp) return;

  if(v && !v.startsWith('#')) v = '#'+v;
  if(!/^#[0-9A-Fa-f]{6}$/.test(v)){ toast('รูปแบบสีไม่ถูกต้อง — ใช้ #RRGGBB'); return; }
  if(cp.prop==='pageBg'){
