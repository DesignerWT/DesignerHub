<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Worldtech</title>
<!-- Global typeface: Futura 100 Thai (licensed font, load via your organization's font host/CDN or local @font-face). Falls back to system sans-serif if unavailable. -->
<style>
:root{
  --font-app: "Futura 100 Thai", sans-serif;
  --bg-light:#F8F9FA; --bg-dark:#0F172A;
  --surface:rgba(255,255,255,0.75);
  --surface-solid:#FFFFFF;
  --accent:#6366F1; --accent2:#3B82F6;
  --ink:#0F172A; --ink-soft:#475569; --ink-faint:#94A3B8;
  --line:rgba(15,23,42,0.08);
  --crit-bg:#FEE2E2; --crit-tx:#DC2626;
  --urg-bg:#FFEDD5; --urg-tx:#EA580C;
  --pri-bg:#FEF3C7; --pri-tx:#D97706;
  --std-bg:#DBEAFE; --std-tx:#2563EB;
  --ok-bg:#D1FAE5; --ok-tx:#059669;
  --r-card:16px; --r-input:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
  --shadow-md:0 8px 24px -8px rgba(15,23,42,.18);
  --shadow-lift:0 16px 32px -12px rgba(99,102,241,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(99,102,241,.08), transparent),
    radial-gradient(900px 500px at -10% 20%, rgba(59,130,246,.06), transparent),
    var(--bg-light);
  font-family:var(--font-app);
  color:var(--ink);
  min-height:100vh;
}
.mono{font-family:var(--font-app), monospace}
.display{font-family:var(--font-app)}

.app{display:flex;flex-direction:column;min-height:100vh}
.topnav{
  display:flex;align-items:center;gap:4px;
  padding:10px 18px;background:var(--surface);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
  overflow-x:auto;
}
.brandmark{
  font-family:var(--font-app);font-weight:700;font-size:15px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px;padding-right:14px;margin-right:6px;
  border-right:1px solid var(--line);white-space:nowrap;color:var(--ink);
}
.brandmark .dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-block}
.tabbtn{
  border:none;background:transparent;padding:9px 14px;border-radius:10px;
  font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  transition:.2s ease;position:relative;
}
.tabbtn:hover{color:var(--ink);background:rgba(99,102,241,.06)}
.tabbtn.active{color:var(--accent)}
.tabbtn.active::after{
  content:'';position:absolute;left:12px;right:12px;bottom:-11px;height:2.5px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;
  transition:all .25s ease-out;
}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface-solid);width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:var(--shadow-sm);font-size:15px}
.iconbtn:hover{background:rgba(99,102,241,.07)}
.dot-badge{position:absolute;top:-4px;right:-4px;background:var(--crit-tx);color:#fff;font-size:9.5px;font-weight:800;
  min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.userpill{
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;margin-left:8px;
  background:var(--surface-solid);border:1px solid var(--line);font-size:12.5px;font-weight:600;
  box-shadow:var(--shadow-sm);cursor:pointer;
}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}

.body-row{display:flex;flex:1;min-height:0}
.sidebar{
  width:220px;flex-shrink:0;padding:16px 10px;border-right:1px solid var(--line);
  background:rgba(255,255,255,.4);backdrop-filter:blur(8px);display:flex;flex-direction:column;
}
.sidebar .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);
  font-weight:700;margin:16px 10px 6px;}
.sidebar .grp:first-child{margin-top:4px}
.sidenav-btn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;
  padding:9px 10px;border-radius:var(--r-input);font-size:13px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;margin-bottom:2px;transition:.15s;
}
.sidenav-btn:hover{background:rgba(99,102,241,.07);color:var(--ink)}
.sidenav-btn.active{background:var(--accent);color:#fff;box-shadow:var(--shadow-lift)}
.admin-pin{margin-top:auto;text-align:center;font-size:10.5px;color:var(--ink-faint);padding:8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.main{flex:1;padding:22px 26px 60px;overflow-y:auto;min-width:0}

h1.pagetitle{font-family:var(--font-app);font-size:22px;margin:0 0 3px;letter-spacing:-.01em}
.pagesub{color:var(--ink-soft);font-size:13px;margin:0 0 20px}

.card{
  background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:var(--r-card);box-shadow:var(--shadow-sm);padding:18px;
  transition:transform .2s ease, box-shadow .2s ease;
}
.card.hover-lift:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px}}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
.b-CRITICAL{background:var(--crit-bg);color:var(--crit-tx);animation:pulse 1.8s infinite}
.b-URGENT{background:var(--urg-bg);color:var(--urg-tx);animation:pulse 1.8s infinite}
.b-PRIORITY{background:var(--pri-bg);color:var(--pri-tx)}
.b-STANDARD{background:var(--std-bg);color:var(--std-tx)}
.b-OK{background:var(--ok-bg);color:var(--ok-tx)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.btn{border:none;border-radius:var(--r-input);padding:9px 16px;font-weight:700;font-size:13px;
  cursor:pointer;transition:.15s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -6px rgba(99,102,241,.55)}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:rgba(15,23,42,.05);color:var(--ink)}
.btn-ghost:hover{background:rgba(15,23,42,.09)}
.btn-danger{background:var(--crit-bg);color:var(--crit-tx)}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 0 5px}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--r-input);padding:9px 11px;
  font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(99,102,241,.35);border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1300px){.row4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.row4{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.warn-box{background:var(--pri-bg);color:var(--pri-tx);border-radius:var(--r-input);padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.lock-box{background:var(--crit-bg);color:var(--crit-tx);border-radius:var(--r-input);padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.info-box{background:var(--std-bg);color:var(--std-tx);border-radius:var(--r-input);padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.split-success-box{background:var(--ok-bg);color:var(--ok-tx);border-radius:var(--r-input);padding:10px 12px;margin-bottom:12px}
.split-success-title{font-size:12.5px;font-weight:700;margin-bottom:6px}
.split-breakdown{background:rgba(255,255,255,.55);border-radius:8px;padding:6px 10px}
.split-row{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;padding:3px 0}
.split-row.split-total{border-top:1px solid rgba(5,150,105,.25);margin-top:2px;padding-top:5px;font-weight:700}
.split-tag{display:inline-block;background:var(--ok-bg);color:var(--ok-tx);border-radius:5px;padding:1px 5px;font-size:9.5px;font-weight:700;margin-left:4px;vertical-align:middle}

/* ---------- My Work timeline (Internal Task + Brief merged) ---------- */
.mywork-list{display:flex;flex-direction:column;gap:2px}
.mywork-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.mywork-row:last-child{border-bottom:none}
.mywork-name{font-weight:700;font-size:12.5px;flex:1;min-width:0}
.mywork-meta{color:var(--ink-faint);font-size:11px;flex-shrink:0}
.mywork-pts{font-weight:700;font-size:11.5px;flex-shrink:0;white-space:nowrap}
.mywork-actions{display:flex;gap:4px;flex-shrink:0}
.perf-table{width:100%;border-collapse:collapse}
.perf-table th{text-align:left;font-size:11px;color:var(--ink-faint);padding:6px 8px;border-bottom:1px solid var(--line)}
.perf-table td{padding:8px;border-bottom:1px dashed var(--line);font-size:12.5px}
.perf-table tr:last-child td{border-bottom:none}
.perf-metric-card{background:var(--card-bg,#fff);border:1px solid var(--line);border-radius:10px;padding:12px}
.perf-metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}

.gaugewrap{background:rgba(15,23,42,.06);border-radius:999px;height:9px;overflow:hidden;margin-top:8px}
.gaugefill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease}
.gaugefill.over{background:linear-gradient(90deg,#DC2626,#EA580C)}

.board-toolbar{display:flex;gap:10px;align-items:flex-end;margin-bottom:28px;flex-wrap:wrap}
.board-section{margin-bottom:36px}
.board-section-title{font-family:var(--font-app);font-weight:800;font-size:17px;margin-bottom:14px;
  padding:10px 16px;border-left:4px solid var(--accent);border-radius:8px;
  background:rgba(99,102,241,.06);color:var(--ink);letter-spacing:-.01em}
.board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;width:100%}
.col{min-width:0}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 14px}
.col-head .n{font-weight:700;font-size:13px;color:var(--ink-soft)}
.col-head .cnt{background:rgba(15,23,42,.08);color:var(--ink-soft);font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;flex-shrink:0}
.taskcard{background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;padding:12px;
  margin-bottom:10px;box-shadow:var(--shadow-sm);transition:.18s;cursor:pointer}
.taskcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:6px}
.tc-title{font-weight:700;font-size:13px;line-height:1.3}
.tc-meta{font-size:11px;color:var(--ink-faint);margin:5px 0 8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(99,102,241,.09);color:var(--accent);font-weight:700;font-size:10.5px;padding:2px 8px;border-radius:999px}
.tc-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px}
.assignee{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink-soft)}
.tc-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.empty-col{border:1.5px dashed var(--line);border-radius:14px;padding:18px 10px;min-height:76px;
  display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-faint);font-size:12px}
.linkbox{display:flex;gap:6px;margin-top:9px}
.linkbox input{flex:1;font-size:11.5px;padding:7px 9px;min-width:0}
.linkchip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);font-weight:700;margin-top:9px}
.linkchip a{color:var(--accent)}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:120;
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:22px;box-shadow:var(--shadow-md);max-height:88vh;overflow-y:auto;margin:auto}
.modal h3{font-family:var(--font-app);margin:0 0 4px}
.modal-close{position:absolute;top:16px;right:16px;border:none;background:rgba(15,23,42,.06);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow-md);
  animation:toastin .25s ease-out;max-width:90vw;text-align:center}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

.statline{display:flex;align-items:baseline;gap:8px}
.statnum{font-family:var(--font-app);font-size:26px;font-weight:700}
.statlbl{font-size:11.5px;color:var(--ink-soft);font-weight:600}
hr.div{border:none;border-top:1px solid var(--line);margin:18px 0}
.placeholder{padding:40px 20px;text-align:center;color:var(--ink-faint)}
.placeholder .ico{font-size:34px;margin-bottom:8px}

/* timeline */
.tl-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
.tl-body{flex:1}
.tl-action{font-weight:700;font-size:12.5px}
.tl-time{font-size:10.5px;color:var(--ink-faint)}
.tl-comment{font-size:12px;color:var(--ink-soft);margin-top:2px}

/* calendar — compact (~60% smaller than default) */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-nav{display:flex;gap:4px;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:280px}
.cal-dow{font-size:8px;font-weight:700;color:var(--ink-faint);text-align:center;padding-bottom:2px}
.cal-cell{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:.15s;position:relative}
.cal-cell.empty{visibility:hidden}
.cal-cell.avail{background:var(--ok-bg);color:var(--ok-tx)}
.cal-cell.busy{background:var(--pri-bg);color:var(--pri-tx)}
.cal-cell.full{background:var(--crit-bg);color:var(--crit-tx)}
.cal-cell.full.overridable{cursor:pointer}
.cal-cell.blocked{background:#F1F5F9;color:var(--ink-faint);cursor:not-allowed}
.cal-cell.leave{background:repeating-linear-gradient(45deg,#E2E8F0,#E2E8F0 3px,#CBD5E1 3px,#CBD5E1 6px);color:var(--ink-faint)}
.cal-cell.past{opacity:.35;cursor:default}
.cal-cell:hover:not(.past):not(.empty):not(.blocked){transform:scale(1.1);border-color:var(--accent)}
.cal-cell.selected{background:var(--accent)!important;color:#fff!important;outline:none}
.cal-legend{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;font-size:9px;color:var(--ink-soft)}
.cal-legend span{display:inline-flex;align-items:center;gap:3px}
.cal-legend i{width:7px;height:7px;border-radius:2px;display:inline-block}

/* directory */
.dirgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.dircard{background:var(--surface-solid);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);transition:.18s}
.dircard:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.dircard .thumb{height:90px;background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(59,130,246,.12));display:flex;align-items:center;justify-content:center;font-size:30px}
.dircard .body{padding:12px}
.dircard .name{font-weight:700;font-size:13px;margin-bottom:2px}
.dircard .sub{font-size:11px;color:var(--ink-faint)}

/* product asset management */
.pdir-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pdir-toolbar input{flex:1;min-width:200px}
.pdir-toolbar select{width:auto;min-width:130px}
.pdir-quickfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.qf-pill{padding:6px 12px;border-radius:999px;border:1.3px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.qf-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
/* Compact product grid — no fixed card size, wraps freely so more SKUs fit per row */
.pdirgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
@media(max-width:1100px){.pdirgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){.pdirgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.pdirgrid{grid-template-columns:repeat(2,1fr);gap:8px}}
@media(max-width:380px){.pdirgrid{grid-template-columns:repeat(1,1fr)}}
.pcard{position:relative}
.pcard.clickable{cursor:pointer}
.pcard .kebab{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border:1px solid var(--line);width:24px;height:24px;border-radius:7px;cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2}
.pcard-menu{position:absolute;top:34px;right:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-md);z-index:5;min-width:130px;overflow:hidden}
.pcard-menu button{display:block;width:100%;text-align:left;padding:9px 12px;border:none;background:none;font-size:12.5px;cursor:pointer;color:var(--ink)}
.pcard-menu button:hover{background:rgba(15,23,42,.05)}
.pcard-menu button.danger{color:var(--crit-tx)}
.pcard-menu button:disabled{color:var(--ink-faint);cursor:not-allowed;opacity:.5}
.pcard-menu button:disabled:hover{background:none}
.pcard .thumb{height:62px;font-size:20px}
.pcard .body{padding:8px}
.pcard .name{font-size:11.5px;font-weight:700;margin-bottom:1px;line-height:1.25}
.pcard .name-en{font-size:9.5px;color:var(--ink-faint);margin-top:0;line-height:1.2}
.pcard .sub{font-size:9.5px;color:var(--ink-faint)}
.pcard .chip{font-size:9px;padding:1px 6px;margin-top:4px;display:inline-block}
.pcard .drive-primary{display:block;width:100%;text-align:center;margin-top:8px;padding:7px 6px;
  font-size:11px;border-radius:8px;text-decoration:none}
.pcard .drive-none{display:block;width:100%;text-align:center;margin-top:8px;padding:7px 6px;
  font-size:11px;border-radius:8px;background:rgba(15,23,42,.05);color:var(--ink-faint);font-weight:600;
  border:none;cursor:not-allowed}
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px;flex-wrap:wrap}
.pagination button{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.pagination button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.field-error{color:var(--crit-tx);font-size:11px;margin-top:4px;font-weight:600}
.cat-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:none}
.cat-row input{flex:1}
.cat-row .cat-count{font-size:11px;color:var(--ink-faint);min-width:56px;text-align:right}

/* login */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:#fff;border-radius:20px;box-shadow:var(--shadow-md);padding:32px;max-width:380px;width:100%}
.loginbox .lbrand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.dsg-account-list{display:flex;flex-direction:column;gap:8px}
.dsg-account-row{width:100%;text-align:left;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s}
.dsg-account-row:hover{border-color:var(--accent);background:rgba(99,102,241,.05)}
.dsg-selected-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;font-size:13px;color:var(--ink-soft)}
.roletabs{display:flex;gap:6px;background:rgba(15,23,42,.05);padding:4px;border-radius:12px;margin-bottom:18px}
.roletab{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.gchooser-row{width:100%;display:flex;align-items:center;gap:12px;padding:11px 24px;border:none;background:#fff;cursor:pointer;font-family:inherit}
.gchooser-row:hover{background:#F8FAFC}
.gchooser-row .avatar{width:34px;height:34px;font-size:14px;flex-shrink:0}
.roletab.active{background:#fff;color:var(--accent);box-shadow:var(--shadow-sm)}
.login-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-faint);font-size:11px;font-weight:600;text-transform:uppercase}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.adminlogin-modal{padding-top:8px}
.adminlogin-badge{width:44px;height:44px;border-radius:12px;background:rgba(15,23,42,.06);display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 10px}

/* notif */
.notifdrop{position:absolute;top:46px;right:18px;width:320px;background:#fff;border-radius:16px;box-shadow:var(--shadow-md);
  border:1px solid var(--line);z-index:80;max-height:400px;overflow-y:auto}
.notifitem{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.notifitem:last-child{border-bottom:none}
.notifitem.unread{background:rgba(99,102,241,.05)}
.notifitem .t{font-weight:700;margin-bottom:2px}
.notifitem .m{color:var(--ink-soft)}
.notifitem .ts{color:var(--ink-faint);font-size:10.5px;margin-top:3px}

/* brief form v2 */
.formgrid{display:grid;grid-template-columns:160px 1fr 330px;gap:22px;align-items:start;max-width:1680px}
@media(max-width:1300px){.formgrid{grid-template-columns:1fr 330px}}
@media(max-width:900px){.formgrid{grid-template-columns:1fr}}
.summary-card{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto}
.section-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.requester-card{background:#F8FAFC;padding:14px 16px;border-radius:12px;border:1px solid var(--line)}

/* ---------- Backdated Task redesign: single centered Admin-form (replaces the old narrow-card-column
   layout) — professional Operational Form styling per Dev Prompt "Redesign หน้า Backdated Task" ---------- */
.bt-page{background:#F6F7FB;margin:-22px -26px;padding:22px 26px 40px}
.bt-page .pagetitle{margin-bottom:2px}
.bt-wrap{max-width:1050px;margin:0 auto}
.bt-form{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:8px 32px 28px;box-shadow:var(--shadow-sm)}
.bt-section{padding:24px 0;border-bottom:1px solid #E5E7EB}
.bt-section:last-of-type{border-bottom:none;padding-bottom:8px}
.bt-section-title{font-family:var(--font-app);font-weight:800;font-size:14px;letter-spacing:.02em;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.bt-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
/* 30% / 30% / 20% / 20% per spec — Deliverables and Resize always share the same row on Desktop. */
.bt-grid-4{display:grid;grid-template-columns:30fr 30fr 20fr 20fr;gap:16px 20px;align-items:start}
@media(max-width:900px){.bt-grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.bt-grid-4,.bt-grid-2{grid-template-columns:1fr}}
.bt-helper-row{font-size:12px;color:var(--ink-faint);margin-top:2px}
.bt-estpoint{background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px}
.bt-estpoint-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.bt-estpoint-value{font-family:var(--font-app);font-size:24px;font-weight:800;color:var(--ink)}
.bt-estpoint-hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.bt-meta{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:10px}
.bt-footer{display:flex;justify-content:flex-end;gap:10px;padding-top:20px;position:sticky;bottom:0;background:#fff}
.bt-footer .btn{width:auto;padding:11px 22px}
.bt-footer .btn-primary{background:#1B76FF;box-shadow:none}
.bt-footer .btn-primary:hover{background:#1662D6;filter:none;transform:none}
.bt-footer .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.bt-form input,.bt-form select,.bt-form textarea{padding:11px 12px;font-size:13.5px}
.bt-invalid{border-color:var(--crit-tx) !important}
@media(max-width:640px){.bt-form{padding:8px 18px 20px}.bt-footer{flex-direction:column-reverse}.bt-footer .btn{width:100%}}
.po-timeline{display:flex;align-items:flex-start;margin:8px 0 4px}
.po-tl-step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px}
.po-tl-dot{width:14px;height:14px;border-radius:50%;background:#E2E8F0;border:2px solid #E2E8F0;flex-shrink:0}
.po-tl-step.done .po-tl-dot{background:var(--accent);border-color:var(--accent)}
.po-tl-step.current .po-tl-dot{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.po-tl-label{font-size:10.5px;color:var(--ink-faint);font-weight:600;text-align:center}
.po-tl-step.done .po-tl-label,.po-tl-step.current .po-tl-label{color:var(--ink);font-weight:700}
.po-tl-line{flex:1;height:2px;background:#E2E8F0;margin-top:6px}
.po-tl-line.done{background:var(--accent)}
.section-title{font-weight:700;font-size:13.5px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.req-badge{background:var(--crit-bg);color:var(--crit-tx);font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}

.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.pilltoggle-platform{display:inline-flex;align-items:center;padding:8px 13px;border-radius:8px;border:1.3px solid var(--line);
  font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink-soft);transition:.15s;user-select:none;height:34px}
.pilltoggle-platform:hover{border-color:#93C5FD}
.pilltoggle-platform.active{border-color:#3B82F6;border-width:2px;background:#EFF6FF;color:#1D4ED8;padding:7px 12px}
.prioritydate-row{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media(max-width:700px){.prioritydate-row{grid-template-columns:1fr}}
.pilltoggle{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);
  font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink-soft);transition:.15s;user-select:none}
.pilltoggle:hover{border-color:var(--accent)}
.pilltoggle.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pilltoggle.active.pri-CRITICAL{background:var(--crit-tx);border-color:var(--crit-tx)}
.pilltoggle.active.pri-URGENT{background:var(--urg-tx);border-color:var(--urg-tx)}
.pilltoggle.active.pri-PRIORITY{background:var(--pri-tx);border-color:var(--pri-tx)}
.pilltoggle.active.pri-STANDARD{background:var(--ok-tx);border-color:var(--ok-tx)}

.radiocard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s}
.radiocard.active{border-color:var(--accent);background:rgba(99,102,241,.05)}
.radiocard .rc-head{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px}
.radiocard input[type=radio]{width:auto;accent-color:var(--accent);flex-shrink:0}
.radiocard .rc-sub{margin-top:10px}

.sumrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.sumbox{background:#F1F5F9;border-radius:10px;padding:10px;text-align:center}
.sumbox .v{font-family:var(--font-app);font-size:20px;font-weight:700}
.sumbox .l{font-size:9.5px;color:var(--ink-soft);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.rolepill{display:flex;align-items:center;gap:8px;background:rgba(99,102,241,.08);color:var(--accent);
  font-weight:700;font-size:12.5px;padding:9px 12px;border-radius:10px;margin-top:6px}
.readybadge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:8px 10px;border-radius:10px;margin:10px 0}
.readybadge.ok{background:var(--ok-bg);color:var(--ok-tx)}
.readybadge.pending{background:var(--pri-bg);color:var(--pri-tx)}
.summary-title{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;margin-bottom:4px}
.eyebrow{font-size:10px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.selecteddate-line{font-size:11.5px;color:var(--ink-soft);margin-top:8px;font-weight:600}

/* ---------- Team Dashboard ---------- */
.dash-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.dash-updated{font-size:11.5px;color:var(--ink-faint);text-align:right}
.dash-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
@media(max-width:1100px){.dash-summary{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.dash-summary{grid-template-columns:repeat(2,1fr)}}
.dsum-card{background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm)}
.dsum-card.attn{border-color:var(--crit-tx);background:var(--crit-bg)}
.dsum-card .dv{font-family:var(--font-app);font-size:22px;font-weight:700}
.dsum-card .dl{font-size:10.5px;color:var(--ink-soft);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.dash-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.dash-filters input, .dash-filters select{width:auto;min-width:130px}
.dash-datenav{display:flex;align-items:center;gap:6px;background:var(--surface-solid);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.dash-datenav strong{font-size:12.5px;padding:0 4px}
.dash-viewtoggle{display:flex;background:rgba(15,23,42,.05);border-radius:10px;padding:3px;gap:2px}
.dash-viewtoggle button{border:none;background:transparent;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.dash-viewtoggle button.active{background:#fff;color:var(--accent);box-shadow:var(--shadow-sm)}

.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-leave{background:#E2E8F0;color:#475569}
.st-critical{background:#7F1D1D;color:#fff}
.st-high{background:var(--crit-bg);color:var(--crit-tx)}
.st-over{background:#FED7AA;color:#C2410C}
.st-full{background:var(--pri-bg);color:var(--pri-tx)}
.st-nearly{background:var(--std-bg);color:var(--std-tx)}
.st-avail{background:var(--ok-bg);color:var(--ok-tx)}

.drow{display:flex;align-items:center;gap:14px;background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;
  padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm);flex-wrap:wrap}
.drow-id{display:flex;align-items:center;gap:10px;min-width:150px}
.drow-id .nm{font-weight:700;font-size:13px}
.drow-id .rl{font-size:11px;color:var(--ink-faint)}
.drow-cap{min-width:90px}
.drow-cap .capnum{font-family:var(--font-app);font-weight:700;font-size:15px}
.drow-cap .capover{color:var(--crit-tx);font-size:10.5px;font-weight:700;margin-left:4px}
.drow-bar{width:70px;height:7px;border-radius:99px;background:rgba(15,23,42,.08);overflow:hidden;margin-top:4px}
.drow-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.drow-bar i.over{background:linear-gradient(90deg,#DC2626,#991B1B)}
.drow-breakdown{font-size:10.5px;color:var(--ink-soft);min-width:90px}
.drow-strip{display:flex;gap:3px;flex:1;min-width:180px}
.strip-cell{flex:1;text-align:center;border-radius:7px;padding:4px 2px;font-size:9.5px;font-weight:700;cursor:pointer;min-width:26px}
.strip-cell .sd{opacity:.7;font-size:8.5px;display:block}
.drow-avail{min-width:80px;font-size:11px;color:var(--ink-soft)}
.drow-action{margin-left:auto}

.dash-matrix{width:100%;border-collapse:collapse;font-size:12px}
.dash-matrix th, .dash-matrix td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
.dash-matrix th{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase}
.dash-matrix th.today-col{color:var(--accent)}
.dash-matrix td:first-child, .dash-matrix th:first-child{text-align:left;font-weight:700}
.matrix-cell{border-radius:8px;padding:5px 6px;font-weight:700;cursor:pointer;display:inline-block;min-width:44px}
.matrix-box{position:relative;border-radius:10px;padding:8px 6px 6px;cursor:pointer;min-width:76px;border:1.5px solid transparent}
.matrix-box.mb-avail{background:#ECFDF5;border-color:#A7F3D0}
.matrix-box.mb-near{background:#FFFBEB;border-color:#FDE68A}
.matrix-box.mb-locked{background:#FEF2F2;border-color:#FECACA}
.matrix-box.mb-off{background:#F1F5F9;border-color:var(--line)}
.matrix-box .mb-pts{font-family:var(--font-app);font-weight:700;font-size:13px}
.matrix-box .mb-pts small{font-weight:600;color:var(--ink-faint);font-size:10px}
.matrix-box .mb-badge{position:absolute;top:-7px;right:-6px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px}
.matrix-box.mb-avail .mb-badge{background:#059669;color:#fff}
.matrix-box.mb-near .mb-badge{background:#D97706;color:#fff}
.matrix-box.mb-locked .mb-badge{background:#DC2626;color:#fff}
.matrix-box .mb-bar{height:4px;border-radius:99px;background:rgba(15,23,42,.08);margin-top:5px;overflow:hidden}
.matrix-box .mb-bar i{display:block;height:100%}
.matrix-box.mb-avail .mb-bar i{background:#059669}
.matrix-box.mb-near .mb-bar i{background:#D97706}
.matrix-box.mb-locked .mb-bar i{background:#DC2626}
.matrix-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--ink-soft)}
.matrix-legend span{display:inline-flex;align-items:center;gap:6px}
.matrix-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.drawer-bg{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:110;display:flex;justify-content:flex-end}
.drawer{width:min(480px,92vw);background:#fff;height:100%;overflow-y:auto;padding:20px;box-shadow:-8px 0 24px rgba(15,23,42,.15);position:relative}
.drawer-close{position:absolute;top:16px;right:16px;border:none;background:rgba(15,23,42,.06);width:30px;height:30px;border-radius:9px;cursor:pointer}
.shortcut-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.shortcut-row.dragging{opacity:.4}
.shortcut-row .drag-handle{cursor:grab;color:var(--ink-faint);font-size:14px;flex-shrink:0}
.shortcut-row .shortcut-btn{flex:1;text-align:left;justify-content:flex-start}
.shortcut-row .shortcut-actions{display:flex;gap:4px;flex-shrink:0}
.shortcut-row .shortcut-actions button{border:none;background:rgba(15,23,42,.05);width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:11px}
.shortcut-row .shortcut-actions button.danger{color:var(--crit-tx)}
.color-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- CI Reference Center (Brand Colors + CI Guidelines) ---------- */
.ci-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.ci-usage-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:10px 0 8px}
.ci-usage-bar .primary-seg{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.ci-usage-bar .occasion-seg{background:#E2E8F0}
.ci-usage-legend{display:flex;gap:16px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.ci-usage-legend span i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.ci-section-title{font-family:var(--font-app);font-weight:800;font-size:16px;margin:32px 0 2px}
.ci-section-sub{font-size:12px;color:var(--ink-faint);margin-bottom:14px}
.ci-section-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
/* Compact Color Cards (§40): Desktop shows Primary 4-5/row, Occasion 5-6/row; smaller swatch + tighter padding
   than the original oversized cards, while every value (HEX/RGB/CMYK/Pantone) stays copyable. */
.ci-grid-primary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ci-grid-occasion{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:1300px){.ci-grid-primary{grid-template-columns:repeat(4,1fr)}.ci-grid-occasion{grid-template-columns:repeat(5,1fr)}}
@media(max-width:1100px){.ci-grid-primary{grid-template-columns:repeat(3,1fr)}.ci-grid-occasion{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.ci-grid-primary{grid-template-columns:repeat(2,1fr)}.ci-grid-occasion{grid-template-columns:repeat(2,1fr)}}

.color-card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;position:relative;
  box-shadow:0 1px 3px rgba(15,23,42,.04);transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.color-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(15,23,42,.14)}
.color-card .swatch{height:92px;cursor:pointer;flex-shrink:0}
.color-card.occasion .swatch{height:80px}
.color-card .swatch.white-border{border-bottom:1px solid #E5E7EB}
.color-card .kebab{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:9px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(4px);border:none;cursor:pointer;font-size:14px;
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;z-index:3;transition:.15s}
.color-card .kebab:hover{background:rgba(15,23,42,.08);color:var(--ink)}
.color-card .cc-body{padding:10px 12px}
.color-card .cc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px}
.color-card .cc-name{font-family:var(--font-app);font-weight:700;font-size:14px;letter-spacing:-.01em;line-height:1.25}
.color-card.occasion .cc-name{font-size:12.5px}
.color-card .cc-hex{font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;gap:6px}
.cval-list{display:flex;flex-direction:column;gap:5px}
.cval-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:5px;
  border-top:1px solid rgba(15,23,42,.05);cursor:pointer}
.cval-row:first-child{padding-top:0;border-top:none}
.cval-row .cval-k{font-size:10.5px;color:var(--ink-faint);font-weight:500;flex-shrink:0}
.cval-row .cval-v{font-size:11.5px;font-weight:600;font-family:var(--font-app);color:var(--ink);text-align:right}
.cval-copy{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--ink-faint);flex-shrink:0;transition:.15s}
.cval-row:hover .cval-copy, .color-card .cc-hex:hover .cval-copy{background:rgba(15,23,42,.06);color:var(--ink-soft)}
.color-card .pcard-menu{top:36px;right:6px;min-width:150px}
.ci-note-bar{background:rgba(99,102,241,.045);border:1px solid rgba(99,102,241,.14);border-radius:16px;
  padding:16px 20px;margin-top:32px;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.ci-note-bar strong{color:var(--ink)}
.ci-note-bar .ci-ratio-line{font-size:13.5px;margin-top:4px}

/* ---------- CI Guidelines (§41-43) — dynamic categories, not hardcoded ---------- */
.ci-cat-pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.ci-cat-pill{background:#F1F5F9;color:var(--ink-soft);border:1px solid transparent;border-radius:999px;
  padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.ci-cat-pill:hover{background:#E2E8F0}
.ci-cat-pill.on{background:var(--accent);color:#fff}
.ci-guide-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1300px){.ci-guide-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.ci-guide-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.ci-guide-grid{grid-template-columns:1fr}}
.ci-guide-card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:14px;overflow:hidden;position:relative;
  box-shadow:0 1px 3px rgba(15,23,42,.04);transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.ci-guide-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(15,23,42,.14)}
.ci-guide-thumb{height:100px;background:#F8FAFC;background-size:cover;background-position:center;flex-shrink:0}
.ci-guide-thumb-empty{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink-faint)}
.ci-guide-card .kebab{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:9px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(4px);border:none;cursor:pointer;font-size:14px;
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;z-index:3;transition:.15s}
.ci-guide-card .kebab:hover{background:rgba(15,23,42,.08);color:var(--ink)}
.ci-guide-card .pcard-menu{top:36px;right:6px;min-width:150px}
.ci-guide-body{padding:10px 12px 12px}
.ci-guide-cat{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
.ci-guide-title{font-family:var(--font-app);font-weight:700;font-size:13.5px;line-height:1.3;margin-top:2px}
.ci-guide-desc{font-size:11.5px;color:var(--ink-faint);margin-top:4px;line-height:1.4;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Leave Calendar ---------- */
.lv-header-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.lv-viewonly-pill{background:#F1F5F9;color:var(--ink-soft);font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.lv-rule-card{display:flex;gap:10px;flex-wrap:wrap;background:var(--surface-solid);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin:14px 0 20px;box-shadow:var(--shadow-sm)}
.lv-rule-item{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.lv-rule-item .lv-pt-pill{font-family:var(--font-app);font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px}
.lv-rule-item .lv-pt-pill.full{background:var(--crit-bg);color:var(--crit-tx)}
.lv-rule-item .lv-pt-pill.half{background:var(--pri-bg);color:var(--pri-tx)}
.lv-rule-item .lv-hardlock-pill{background:#1F2937;color:#fff;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.lv-layout{display:grid;grid-template-columns:35% 1fr;gap:18px;align-items:start}
.lv-layout.viewonly{grid-template-columns:1fr}
@media(max-width:900px){.lv-layout{grid-template-columns:1fr}}
.lv-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.lv-filters select{width:auto;min-width:150px}
.lv-cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.lv-cal-nav strong{font-family:var(--font-app);font-size:14px}
.lv-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lv-dow{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-align:center;padding-bottom:4px}
.lv-cell{min-height:76px;border-radius:10px;padding:5px;background:#F8FAFC;border:1px solid var(--line);cursor:default}
.lv-cell.has-leave{cursor:pointer;background:#fff}
.lv-cell.today{border-color:var(--accent);border-width:1.5px}
.lv-cell .lv-daynum{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:3px}
.lv-chip{font-size:9px;font-weight:700;padding:2px 5px;border-radius:6px;margin-bottom:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-chip.full{background:var(--crit-bg);color:var(--crit-tx)}
.lv-chip.half{background:var(--pri-bg);color:var(--pri-tx)}
.lv-chip.more{background:rgba(15,23,42,.06);color:var(--ink-faint)}
.lv-upcoming-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  margin-bottom:8px;background:var(--surface-solid)}
.lv-upcoming-date{font-family:var(--font-app);font-weight:700;font-size:12px;color:var(--ink-soft);min-width:52px;text-align:center;
  background:#F1F5F9;border-radius:9px;padding:6px 4px}
.lv-upcoming-info{flex:1}
.lv-upcoming-info .nm{font-weight:700;font-size:12.5px}
.lv-upcoming-info .tp{font-size:11px;color:var(--ink-faint)}
.lv-upcoming-pt{font-weight:700;font-size:12px;color:var(--crit-tx)}
.lv-empty-compact{padding:20px 14px;text-align:center;color:var(--ink-faint);font-size:12px;min-height:120px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dcopy-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.dcopy-row:last-of-type{border-bottom:none}
.dcopy-row .dcopy-text{font-size:12.5px;font-weight:600;word-break:break-word}
.copy-btn{border:1px solid var(--line);background:#fff;width:26px;height:26px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--ink-soft);flex-shrink:0;transition:.15s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{background:var(--ok-bg);color:var(--ok-tx);border-color:var(--ok-bg);width:auto;padding:0 10px;font-size:10.5px;font-weight:700}
.insight-list{list-style:none;padding:0;margin:0;font-size:12.5px}
.insight-list li{padding:6px 0;border-bottom:1px dashed var(--line)}
.insight-list li:last-child{border-bottom:none}

/* ---------- Personal Workspace (My Dashboard) ---------- */
.ws-header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.ws-icon{width:52px;height:52px;border-radius:14px;background:rgba(99,102,241,.1);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ws-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:900px){.ws-stats{grid-template-columns:repeat(2,1fr)}}
.ws-stat-card{background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm)}
.ws-stat-card .lbl{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-bottom:8px}
.ws-stat-card .num{font-family:var(--font-app);font-size:28px;font-weight:700}
.ws-stat-card .num .unit{font-size:14px;color:var(--ink-faint);font-weight:600}
.ws-stat-card .num.danger{color:var(--crit-tx)}
.ws-stat-card .num.ok{color:var(--ok-tx)}
.ws-tasklist{background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:20px}
.ws-task-row{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ws-task-row:last-child{border-bottom:none}
.ws-task-row:hover{background:rgba(99,102,241,.03)}
.ws-task-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ws-task-name{font-weight:700;font-size:13.5px;flex:1;min-width:180px}
.ws-task-date{font-size:12px;color:var(--ink-soft);min-width:90px;text-align:right;font-weight:700}
.ws-task-date.overdue{color:var(--crit-tx)}
.ws-task-pts{font-weight:700;font-size:12.5px;color:var(--accent);min-width:52px;text-align:right}
.ws-task-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-faint)}
.ws-meta-sep{color:var(--ink-faint)}
.ws-bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.ws-bottom{grid-template-columns:1fr}}
.week-strip{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:14px}
.week-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week-bar{width:100%;border-radius:8px 8px 3px 3px;min-height:6px;transition:height .3s}
.week-bar-label{font-size:10px;color:var(--ink-faint);font-weight:700}
.week-bar-val{font-size:11px;font-weight:700}
.notif-feed{list-style:none;margin:0;padding:0}
.notif-feed li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.notif-feed li:last-child{border-bottom:none}
.notif-feed .nf-icon{flex-shrink:0;font-size:14px;margin-top:1px}
.notif-feed .nf-msg{font-size:12.5px}
.notif-feed .nf-time{font-size:10.5px;color:var(--ink-faint);margin-top:2px}

/* ---------- Project Owner briefs table + Admin management tables ---------- */
.po-briefs-table{width:100%;border-collapse:collapse;background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);font-size:12.5px}
.po-briefs-table th,.po-briefs-table td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.po-briefs-table th{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;background:#F8FAFC}
.po-briefs-table tbody tr{cursor:pointer}
.po-briefs-table tbody tr:last-child td{border-bottom:none}
.po-briefs-table tbody tr:hover{background:rgba(99,102,241,.03)}
.admin-table{width:100%;border-collapse:collapse;background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);font-size:12.5px;margin-bottom:16px}
.admin-table th,.admin-table td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.admin-table th{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;background:#F8FAFC}
.admin-table tbody tr:last-child td{border-bottom:none}
.admin-table tbody tr:hover{background:rgba(99,102,241,.03)}
.admin-table .row-actions{display:flex;gap:6px;justify-content:flex-end}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.status-pill.st-active{background:rgba(16,185,129,.12);color:#059669}
.status-pill.st-inactive{background:rgba(239,68,68,.12);color:#DC2626}
.status-pill.st-leave{background:rgba(245,158,11,.12);color:#D97706}
.admin-formcard{background:#F8FAFC;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.admin-formcard .row2,.admin-formcard .row3{display:grid;gap:12px;margin-bottom:12px}
.admin-formcard .row2{grid-template-columns:1fr 1fr}
.admin-formcard .row3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:800px){.admin-formcard .row2,.admin-formcard .row3{grid-template-columns:1fr}}

/* delivery info + capacity override */
.delivery-info{background:#F8FAFC;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px}
.delivery-info .di-row{display:flex;justify-content:space-between;padding:3px 0}
.delivery-info .di-k{color:var(--ink-faint);font-weight:600}
.delivery-info .di-v{font-weight:700}
.override-panel{border-radius:12px;padding:12px 14px;margin-top:10px;border:1.5px solid}
.override-panel.urgency{background:#FFF7ED;border-color:#FED7AA}
.override-panel .op-title{font-weight:700;font-size:12.5px;margin-bottom:6px}
.override-panel.urgency .op-title{color:#C2410C}
.override-panel .op-msg{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px}

/* attachments */
.upload-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
@media(max-width:520px){.upload-grid{grid-template-columns:repeat(3,1fr)}}
.upload-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.upload-thumb img{width:100%;height:100%;object-fit:cover}
.upload-thumb .rm{position:absolute;top:3px;right:3px;background:rgba(15,23,42,.65);color:#fff;border:none;
  width:18px;height:18px;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upload-add{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--ink-faint);font-size:20px}
.upload-add:hover{border-color:var(--accent);color:var(--accent)}
.ref-upload-grid{grid-template-columns:repeat(3,1fr)}
.upload-thumb .use-oncanvas{position:absolute;left:0;right:0;bottom:0;border:none;background:rgba(15,23,42,.72);color:#fff;
  font-size:8.5px;font-weight:700;padding:3px 0;cursor:pointer;opacity:0;transition:opacity .12s}
.upload-thumb:hover .use-oncanvas{opacity:1}
.upload-thumb{cursor:grab}

/* summary sidebar */
.sumlist{font-size:12px;margin-top:2px}
.sumlist .sl-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sumlist .sl-row:last-child{border-bottom:none}
.sumlist .sl-k{color:var(--ink-faint);font-weight:600;flex-shrink:0}
.sumlist .sl-v{color:var(--ink);font-weight:700;text-align:right;word-break:break-word}
.sumlist .sl-empty{color:var(--ink-faint);font-weight:500}
.sum-chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}

/* ---------- Brief v3: section numbering + mode toggle ---------- */
.brief-steps{display:flex;flex-direction:column;gap:16px}
.step-title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;margin-bottom:14px;color:var(--ink)}
.step-num{width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.modetabs{display:flex;background:rgba(15,23,42,.05);border-radius:12px;padding:4px;gap:2px;margin-bottom:16px}
.modetab{flex:1;text-align:center;padding:10px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);border:none;background:transparent;font-family:inherit}
.modetab.active{background:#fff;color:var(--accent);box-shadow:var(--shadow-sm)}
.linkrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.linkrow input{flex:1}
.linkrow .rm-linkrow{border:none;background:rgba(15,23,42,.06);width:32px;height:32px;border-radius:8px;cursor:pointer;flex-shrink:0}
.drivebtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;background:rgba(99,102,241,.09);
  color:var(--accent);font-weight:700;font-size:12px;text-decoration:none;border:1.3px solid rgba(99,102,241,.18)}
.drivebtn:hover{background:rgba(99,102,241,.16)}
.linkcard{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:#F8FAFC;border:1px solid var(--line);margin-bottom:8px}
.linkcard .lc-ic{font-size:14px;flex-shrink:0}
.linkcard .lc-label{font-weight:700;font-size:12.5px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkcard .lc-open{font-size:11px;font-weight:700;color:var(--accent);text-decoration:none;flex-shrink:0}
.linkcard .lc-edit, .linkcard .lc-rm{border:none;background:rgba(15,23,42,.06);width:24px;height:24px;border-radius:6px;cursor:pointer;flex-shrink:0;font-size:11px}
.attach-dropzone{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:1.5px dashed var(--line);border-radius:12px;background:#FBFCFE;padding:22px 16px;cursor:pointer;font-family:inherit;text-align:center}
.attach-dropzone:hover{border-color:var(--accent);background:rgba(99,102,241,.04)}
.attach-dropzone .adz-ic{font-size:22px}
.attach-dropzone .adz-title{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.attach-dropzone .adz-sub{font-size:10.5px;color:var(--ink-faint)}

/* ---------- Brief Stepper (left rail) ---------- */
.brief-stepper{display:flex;flex-direction:column;gap:0;padding:6px 4px 0 0;position:sticky;top:76px}
.stepper-item{display:flex;align-items:flex-start;gap:9px;cursor:pointer;padding-bottom:30px;position:relative;border:none;background:transparent;text-align:left;font-family:inherit;width:100%}
.stepper-item:last-child{padding-bottom:0}
.stepper-item:last-child .stepper-connector{display:none}
.stepper-dot{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);color:var(--ink-faint);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;transition:all .15s}
.stepper-connector{position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.stepper-label{padding-top:3px;min-width:0;display:flex;flex-direction:column}
.stepper-label-th{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:normal;line-height:1.25}
.stepper-label-en{display:block;font-size:9px;color:var(--ink-faint);white-space:nowrap;margin-top:2px;letter-spacing:.02em;text-transform:uppercase}
.stepper-item.active .stepper-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.stepper-item.active .stepper-label-th{color:var(--accent)}
.stepper-item.done .stepper-dot{background:var(--ok-tx);border-color:var(--ok-tx);color:#fff}
.stepper-item.done .stepper-connector{background:var(--ok-tx)}
@media(max-width:1300px){.brief-stepper{display:none}}

/* ---------- SLA / Due-Date stat cards ---------- */
.sla-stat-row{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px}
.pd-daterow{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:2px}
@media(max-width:760px){.pd-daterow{grid-template-columns:1fr}}
.sla-stat-card{background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.sla-stat-card .ssc-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin-bottom:6px}
.sla-stat-card .ssc-value{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.3}
.sla-stat-card .ssc-sub{font-size:10.5px;color:var(--ink-soft);margin-top:3px}
.sla-stat-card.warn{background:var(--pri-bg);border-color:rgba(217,119,6,.25)}
.sla-stat-card.warn .ssc-value, .sla-stat-card.warn .ssc-label{color:var(--pri-tx)}

/* ---------- Brief Completeness ---------- */
.completeness-box{margin:12px 0 14px}
.completeness-pct{font-family:var(--font-app);font-size:22px;font-weight:800;color:var(--accent)}
.cchk-list{font-size:12px;margin-top:8px}
.cchk-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.cchk-row .ck-lbl{color:var(--ink-soft);font-weight:600}
.cchk-row .ck-mark{font-weight:800}
.cchk-row .ck-mark.yes{color:var(--ok-tx)}
.cchk-row .ck-mark.no{color:var(--pri-tx)}

/* ---------- Visual Brief Editor ---------- */
.vbe{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow-sm)}
.vbe-topbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#F8FAFC;flex-wrap:wrap}
.vbe-topbar .vbe-title{font-weight:700;font-size:12.5px;margin-right:auto}
.vbe-backbtn{border:none;background:transparent;color:var(--ink-soft);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;padding:0}
.vbe-backbtn:hover{color:var(--accent)}
/* Plain text + dot, not a pill/button — per the redesign spec's "Saving..." / "● Saved" wording. */
.vbe-savepill{font-size:10.5px;font-weight:600;padding:0;background:none;color:var(--ink-faint)}
.vbe-savepill.editing{color:#B45309}
.vbe-savepill.saving{color:#B45309}
.vbe-savepill.saved{color:#16A34A}
.vbe-toolbar{display:flex;align-items:center;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fff}
.vbe-tool{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:7px 12px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink-soft);
  font-family:inherit;white-space:nowrap;transition:border-color .12s,color .12s,background .12s}
.vbe-tool:hover{border-color:var(--accent);color:var(--accent);background:rgba(99,102,241,.05)}
.vbe-tool:active,.vbe-tool.active{border-color:var(--accent);color:var(--accent);background:rgba(99,102,241,.1)}
.vbe-toolsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
/* Brief Inputs -> Toolbar -> [Canvas | Properties sidebar] row -> Pages strip -> CI Color Palette.
   Canvas + Properties sit side-by-side (Canvas ~70-75%, Properties a ~300-340px right rail) whenever
   there's room; below that they wrap to a stacked layout automatically (flex-wrap, not a viewport
   media query) — this editor is often embedded in a narrower form column, not just shown full-width,
   so sizing off the *available* space here is what actually keeps the Canvas from being squeezed
   unusable, per the spec's "Canvas never gets squeezed unusable" requirement. */
.vbe-body{display:flex;flex-direction:column;min-height:0}
.vbe-fullscreen .vbe-body{flex:1;min-height:0;overflow-y:auto}
.vbe-workspace{display:flex;flex-wrap:wrap;align-items:stretch;min-width:0;min-height:0}
.vbe-fullscreen .vbe-workspace{flex:1;min-height:0}
@media(max-width:1100px){
  .vbe-props{border-left:none;border-top:1px solid var(--line)}
  .vbe-props.collapsed{width:100%;padding:10px 16px}
  .vbe-props.collapsed .vbe-props-head .plabel{display:block}
}
.vbe-inputs{border-bottom:1px solid var(--line);background:#FBFCFE;padding:14px 16px}
.vbe-inputs-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.vbe-inputs-head .plabel{margin-bottom:0}
.vbe-collapse-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;font-size:10.5px;
  font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit}
.vbe-collapse-btn:hover{border-color:var(--accent);color:var(--accent)}
.vbe-inputs.collapsed{padding-bottom:10px}
.vbe-inputs .plabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin-bottom:10px}
.vbe-inputs .field label{font-size:11px}
.vbe-inputs .field input, .vbe-inputs .field textarea{font-size:12.5px}
.vbe-inputs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 16px;align-items:start}
.vbe-inputs-grid .vif-detail{grid-column:1 / span 2}
.vbe-inputs-grid .vif-refimgs{grid-column:3;grid-row:1 / span 2}
@media(max-width:900px){
  .vbe-inputs-grid{grid-template-columns:1fr 1fr}
  .vbe-inputs-grid .vif-detail{grid-column:1 / -1}
  .vbe-inputs-grid .vif-refimgs{grid-column:1 / -1;grid-row:auto}
}
.vbe-autosync-note{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--ok-tx);
  background:var(--ok-bg);border-radius:8px;padding:7px 9px;margin-top:10px}
/* contain:inline-size stops the fixed-size 960px Canvas inside from leaking its layout size up through
   nested scroll containers into an ancestor's own width calculation (this app's outer form uses a
   grid column that would otherwise "blow out" wider than its own box once a 960px canvas + a 320px
   Properties sidebar sit side-by-side inside it). min-width:380px + flex-wrap on .vbe-workspace is what
   actually keeps the Canvas usable — below that width, Properties wraps to its own line instead of
   both being crushed. */
.vbe-canvas-row{flex:3 1 420px;min-width:380px;min-height:0;contain:inline-size;padding:22px 16px;display:flex;justify-content:center}
/* In Full Screen, .vbe-workspace gets a definite height from its own flex:1. Without an explicit
   height:100% here, align-items:stretch would instead size this row (and .vbe-props next to it) off
   each other's *natural content height* — meaning selecting an element with a long Properties panel
   would stretch the Canvas row to match it. height:100% + .vbe-props's own overflow-y:auto keeps the
   two independent: Canvas always fills the row, Properties scrolls internally instead of growing it. */
.vbe-fullscreen .vbe-canvas-row{flex:1;height:100%;min-height:0}
.vbe-fullscreen .vbe-props{height:100%}
.vbe-pages{border-top:1px solid var(--line);background:#FBFCFE;padding:12px 14px;display:flex;align-items:flex-start;
  gap:10px;overflow-x:auto}
.vbe-page-item{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;cursor:pointer;flex-shrink:0;
  width:96px;font-size:11px;font-weight:600;color:var(--ink-soft);border:1.3px solid var(--line);background:#fff}
.vbe-page-item:hover{border-color:rgba(99,102,241,.4)}
.vbe-page-item.active{background:#fff;border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow-sm)}
.vbe-page-item .vbe-page-topline{display:flex;align-items:center;gap:6px}
.vbe-page-num{width:18px;height:18px;border-radius:50%;background:rgba(99,102,241,.1);color:var(--accent);
  font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vbe-page-item.active .vbe-page-num{background:var(--accent);color:#fff}
.vbe-page-thumb{width:100%;height:52px;border-radius:6px;background:#F1F5F9;border:1px solid var(--line);flex-shrink:0}
.vbe-page-item.active .vbe-page-thumb{background:#EEF2FF;border-color:rgba(99,102,241,.3)}
.vbe-page-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.vbe-addpage{flex-shrink:0;border:1.5px dashed var(--line);background:transparent;border-radius:9px;padding:8px 14px;
  font-size:11px;font-weight:700;color:var(--ink-faint);cursor:pointer;white-space:nowrap;align-self:center}
.vbe-addpage:hover{border-color:var(--accent);color:var(--accent)}
.vbe-page-menu-btn{border:none;background:transparent;cursor:pointer;color:var(--ink-faint);font-size:12px;padding:2px 4px;flex-shrink:0;align-self:flex-end}
/* Light dot-grid canvas surface (replaces the earlier checkerboard) — closer to a Canva/Figma workspace. */
.vbe-canvas-wrap{position:relative;overflow:auto;background-color:#F7F8FB;
  background-image:radial-gradient(circle, #DCE1EA 1px, transparent 1px);background-size:18px 18px;
  padding:26px;display:flex;align-items:center;justify-content:center;height:clamp(420px,62vh,660px);width:100%;
  min-height:0;border-radius:10px;box-sizing:border-box}
.vbe-fullscreen .vbe-canvas-wrap{height:100%;max-height:none}
.vbe-canvas-scale{transform-origin:center center;flex-shrink:0}
.vbe-canvas{position:relative;width:960px;height:540px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--shadow-md);flex-shrink:0}
.vbe-el{position:absolute;box-sizing:border-box;cursor:move}
.vbe-el-inner{width:100%;height:100%}
.vbe-el.locked{cursor:not-allowed}
.vbe-el.selected{outline:2px solid var(--accent);outline-offset:1px}
/* Applied to <body> for the duration of a drag (see startVBMove/startVBResize) so the cursor stays
   "grabbing" (or the active resize cursor) over the whole page, not just while the pointer is over the
   element being dragged — matches the Canva/Figma feel asked for in the Text interaction fix. */
body.vb-dragging, body.vb-dragging *{cursor:grabbing!important}
.vbe-el-lockbadge{position:absolute;top:-9px;left:-9px;background:var(--ink);color:#fff;width:18px;height:18px;border-radius:50%;
  font-size:9px;display:flex;align-items:center;justify-content:center;z-index:50}
.vbe-resize-handle{position:absolute;width:9px;height:9px;background:#fff;border:2px solid var(--accent);border-radius:2px;z-index:40}
.vbe-rh-nw{top:-5px;left:-5px;cursor:nwse-resize}.vbe-rh-ne{top:-5px;right:-5px;cursor:nesw-resize}
.vbe-rh-sw{bottom:-5px;left:-5px;cursor:nesw-resize}.vbe-rh-se{bottom:-5px;right:-5px;cursor:nwse-resize}
.vbe-guide{position:absolute;background:#EC4899;z-index:60;pointer-events:none}
.vbe-guide.v{width:1px;top:0;bottom:0}.vbe-guide.h{height:1px;left:0;right:0}
/* Text Box — Fix Text Clipping (Master Dev Spec §32/33): Fixed Width + Auto Height + Auto Wrap. The box's
   own height (el.height) is kept in sync with its wrapped content by JS (see measureTextElementHeight()
   and its call sites below) rather than ever being left to clip — overflow:auto here is only a rendering
   safety net for the brief instant before that recalculation lands, never the intended behavior. Long
   unbroken strings (no spaces) still have to wrap instead of blowing out the box, hence overflow-wrap. */
.vbe-el-text{width:100%;height:100%;overflow:auto;outline:none;padding:4px;overflow-wrap:anywhere;word-break:break-word}
.vbe-el-shape{width:100%;height:100%}
.vbe-el-note{width:100%;height:100%;background:#FEF9C3;border:1px solid #FDE68A;border-radius:6px;padding:8px;overflow:auto;outline:none;font-size:12px}
.vbe-el-image{width:100%;height:100%;overflow:hidden;border-radius:4px;background:#F1F5F9;display:flex;align-items:center;justify-content:center}
.vbe-el-image img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vbe-el-link{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.vbe-el-field{width:100%;height:100%;background:rgba(99,102,241,.06);border:1.3px dashed rgba(99,102,241,.4);border-radius:6px;
  padding:6px 8px;font-size:11px;overflow:auto}
.vbe-el-field .vf-k{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);font-weight:700}
.vbe-el-field .vf-v{font-weight:700;margin-top:2px;color:var(--ink)}
.vbe-summary-block{width:100%;height:100%;background:linear-gradient(135deg,rgba(99,102,241,.05),rgba(59,130,246,.05));
  border-radius:8px;padding:16px;overflow:auto}
.vbe-summary-block .vs-title{font-family:var(--font-app);font-weight:800;font-size:19px;letter-spacing:-.01em;margin-bottom:2px}
.vbe-summary-block .vs-subtitle{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:10px}
.vbe-summary-block .vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.vbe-summary-block .vs-k{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700}
.vbe-summary-block .vs-v{font-size:13px;font-weight:700;margin-top:1px}
.vbe-summary-block .vs-detail{font-size:11.5px;color:var(--ink-soft);margin-top:12px;line-height:1.5;white-space:pre-wrap}
.vbe-summary-block .vs-reflink{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:10.5px;font-weight:700;color:var(--accent);text-decoration:none;
  background:rgba(99,102,241,.09);padding:6px 11px;border-radius:8px}
.vbe-product-card{width:100%;height:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;box-shadow:var(--shadow-sm)}
.vbe-product-card .vp-thumb{height:64px;border-radius:7px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:6px}
.vbe-product-card .vp-name{font-weight:700;font-size:12px}
.vbe-product-card .vp-nameen{font-size:10px;color:var(--ink-faint)}
.vbe-product-card .vp-model{font-size:10.5px;color:var(--ink-soft);margin:4px 0}
.vbe-product-card .vp-btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.vbe-product-card .vp-btns button, .vbe-product-card .vp-btns a{border:none;background:rgba(15,23,42,.06);border-radius:6px;
  padding:4px 7px;font-size:9.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);text-decoration:none}
.vbe-ref-card{width:100%;height:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow-sm)}
.vbe-ref-card .vr-eyebrow{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--accent);padding:8px 10px 0}
.vbe-ref-card .vr-preview{height:70px;background:#F1F5F9;margin:6px 10px;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px}
.vbe-ref-card .vr-preview img{width:100%;height:100%;object-fit:cover}
.vbe-ref-card .vr-note{font-size:10.5px;color:var(--ink-soft);padding:0 10px 8px}
.vbe-ref-card .vr-open{display:block;margin:0 10px 10px;text-align:center;padding:6px;border-radius:7px;background:rgba(99,102,241,.09);color:var(--accent);font-size:10.5px;font-weight:700;text-decoration:none}
/* Right-hand Properties sidebar (~300-340px). flex-basis 320px with grow:0 keeps it near that width
   whenever there's room; it wraps to its own full-width line below the Canvas (via .vbe-workspace's
   flex-wrap) rather than being crushed once the row gets tight. Collapses to a slim rail. */
.vbe-props{flex:0 1 320px;min-width:260px;max-width:340px;width:320px;border-left:1px solid var(--line);
  background:#FBFCFE;padding:14px 16px;overflow-y:auto;box-sizing:border-box}
@media(max-width:1100px){.vbe-props{max-width:100%}}
.vbe-fullscreen .vbe-props{max-height:none}
.vbe-props.collapsed{flex:0 0 46px;width:46px;min-width:46px;max-width:46px;padding:14px 6px;overflow:hidden}
.vbe-props.collapsed .vbe-props-head .plabel{display:none}
.vbe-props-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px}
.vbe-props-head .plabel{margin-bottom:0}
.vbe-props-selhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.vbe-props-selhead .sel-label{font-size:12px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.vbe-props-row{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.vbe-props-row > .hint{margin-top:2px}
.vbe-props .pgroup{margin-bottom:0;min-width:0}
.vbe-props .plabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin-bottom:6px}
.vbe-props .p2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vbe-props .p3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.vbe-props .minifield{display:flex;flex-direction:column;gap:3px}
.vbe-props .minifield label{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700}
.vbe-props input, .vbe-props select{font-size:12px;padding:6px 8px}
.vbe-props .btnrow{display:flex;gap:4px;flex-wrap:wrap}
.vbe-props .btnrow button{flex:1;min-width:32px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 4px;cursor:pointer;font-size:11px}
.vbe-props .btnrow button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Generic .btnrow — same look as the Properties-panel version above, for toolbars outside .vbe-props
   (e.g. the Image Crop Tool's preset row in its modal, §36). */
.btnrow{display:flex;gap:4px;flex-wrap:wrap}
.btnrow button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:11px}
.btnrow button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.vbcrop-dim{pointer-events:none}
.vbe-props .swatchrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.vbe-props .swatch{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);cursor:pointer;flex-shrink:0}
.vbe-props .swatch.on{outline:2px solid var(--accent);outline-offset:1px}
.vbe-props .applyall-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);font-weight:600;margin:6px 0 2px;cursor:pointer}
.vbe-props .applyall-row input{margin:0}
.vbe-props .danger-btn{width:100%;border:1px solid rgba(220,38,38,.25);background:rgba(220,38,38,.06);color:#DC2626;border-radius:8px;padding:8px;font-size:11.5px;font-weight:700;cursor:pointer;margin-top:4px}
.vbe-props .danger-btn:hover{background:rgba(220,38,38,.12)}
.vbe-props .reset-ci-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;
  padding:8px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.vbe-props .reset-ci-btn:hover{border-color:var(--accent);color:var(--accent)}
.vbe-props .pdiv{border-top:1px solid var(--line);margin:2px 0}
.vbe-empty-canvas{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px;text-align:center;padding:20px;pointer-events:none}
/* WORLDTECH Color Picker Popover — one shared floating component reused for Text Color, Shape
   Fill/Stroke and Canvas Background (see renderColorPickerPopover()). Replaces the old always-visible
   "CI Color Palette" strip that used to sit below the Canvas — it now opens right next to whichever
   Color control was clicked, like Google Docs/Slides, so picking a color never scrolls the Canvas away. */
.vbcp-trigger{display:flex;align-items:center;gap:6px;width:100%;border:1px solid var(--line);background:#fff;
  border-radius:7px;padding:5px 7px;cursor:pointer;font-family:inherit;text-align:left}
.vbcp-trigger:hover{border-color:var(--accent)}
.vbcp-swatchdot{width:16px;height:16px;border-radius:4px;border:1px solid rgba(15,23,42,.15);flex-shrink:0}
.vbcp-hexlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:700;color:var(--ink-soft)}
.vbcp-caret{font-size:8px;color:var(--ink-faint)}
.vbcp-overlay{position:fixed;inset:0;z-index:400}
.vbcp-pop{position:fixed;width:264px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-md);padding:14px;z-index:401;max-height:80vh;overflow-y:auto}
.vbcp-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin-bottom:8px}
.vbcp-section{margin-bottom:14px}
.vbcp-section:last-child{margin-bottom:0}
.vbcp-cirow{display:flex;flex-wrap:wrap;gap:8px}
.vbcp-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.vbcp-swatch{position:relative;width:20px;height:20px;border-radius:50%;border:1px solid rgba(15,23,42,.12);
  cursor:pointer;flex-shrink:0;padding:0}
.vbcp-swatch:hover{outline:2px solid var(--accent);outline-offset:1px}
.vbcp-swatch.ci{border-radius:7px;width:26px;height:26px}
.vbcp-swatch.selected::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.6)}
.vbcp-swatch.light.selected::after{color:#0F172A;text-shadow:none}
.vbcp-customrow{display:flex;align-items:center;justify-content:space-between}
.vbcp-customrow .vbcp-label{margin-bottom:0}
.vbcp-custombtns{display:flex;gap:8px}
.vbcp-iconbtn{width:30px;height:30px;border-radius:8px;border:1.3px dashed var(--line);background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-soft);padding:0}
.vbcp-iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.vbcp-hexrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.vbcp-hexswatch{width:22px;height:22px;border-radius:6px;border:1px solid rgba(15,23,42,.15);flex-shrink:0}
.vbcp-hexrow input{flex:1;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-family:inherit}
.vbcp-backrow{margin-bottom:10px;cursor:pointer;font-size:11px;font-weight:700;color:var(--ink-soft)}
.vbcp-custom-panel .vbcp-hexrow{border-top:none;padding-top:0}
.vbcp-custom-spectrum-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vbcp-custom-spectrum-row input[type=color]{width:56px;height:44px;border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:2px}
.vbcp-custom-actions{display:flex;gap:8px;margin-top:12px}
.vbcp-custom-actions button{flex:1;border-radius:7px;padding:7px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.vbcp-custom-actions .vbcp-cancel{border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
.vbcp-custom-actions .vbcp-apply{border:1px solid var(--accent);background:var(--accent);color:#fff}
.vbe-zoomctl{display:flex;gap:3px;background:rgba(15,23,42,.05);border-radius:8px;padding:3px}
.vbe-zoomctl button{border:none;background:transparent;padding:5px 8px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.vbe-zoomctl button.active{background:#fff;box-shadow:var(--shadow-sm);color:var(--accent)}

/* ===== Task Workspace — full-page Task Detail (replaces the old modal). Canvas is the primary
   surface (~70% width); the right panel is a scrollable stack of cards (Task Info, Brief Content,
   attachments/links, status/actions) so nothing from the old modal is lost, just re-laid-out. ===== */
.taskws{display:flex;flex-direction:column;min-height:0}
.taskws-header{margin-bottom:16px;flex-shrink:0}
