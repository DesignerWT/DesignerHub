/* ---------- Team Dashboard ---------- */
function renderTeamDashboard(){
  if(!STATE.dash.date) STATE.dash.date = todayISO();
  const date = STATE.dash.date;
  const people = Object.keys(PEOPLE);
  const roles = Array.from(new Set(people.map(p=>PEOPLE[p].role)));

  const all = people.map(p=>{
    const status = designerDayStatus(p, date);
    const bd = taskBreakdownFor(p, date);
    return {person:p, role:PEOPLE[p].role, status, bd, earliest: earliestAvailableFor(p, date)};
  });

  // Filter
  const q = STATE.dash.search.trim().toLowerCase();
  let list = all.filter(d=>{
    if(q && !d.person.toLowerCase().includes(q) && !d.role.toLowerCase().includes(q)) return false;
    if(STATE.dash.roleFilter!=='ALL' && d.role!==STATE.dash.roleFilter) return false;
    if(STATE.dash.statusFilter!=='ALL' && d.status.key!==STATE.dash.statusFilter) return false;
    return true;
  });
  // Default sort: most-attention first, then capacity desc
  list.sort((a,b)=> a.status.rank - b.status.rank || b.status.points - a.status.points);

  const teamTotal = all.reduce((s,d)=>s+d.status.points,0);
  const teamNormal = people.length*DAILY_CAP;
  const counts = {available:0, nearlyfull:0, full:0, over:0, high:0, critical:0, leave:0};
  all.forEach(d=>{ const k = (d.status.key==='holiday') ? 'leave' : d.status.key; counts[k] = (counts[k]||0)+1; });
  const activeMaster = all.reduce((s,d)=>s+d.bd.master.length,0);
  const activeRevision = all.reduce((s,d)=>s+d.bd.revision.length,0);
  const needingAttention = all.filter(d=>['critical','high','over'].includes(d.status.key));

  return `
  <div class="dash-header">
    <div>
      <h1 class="pagetitle">Team Dashboard</h1>
      <p class="pagesub" style="margin-bottom:0">Capacity ทีม — 8.0 Points/วัน/คน · รวม Master Task และ Revision</p>
    </div>
    <div class="dash-updated">อัปเดตล่าสุด ${fmtDateTime(new Date().toISOString())}<br><button type="button" class="btn btn-sm btn-ghost" id="dashRefresh" style="margin-top:4px">🔄 Refresh</button></div>
  </div>

  <div class="dash-summary">
    <div class="dsum-card"><div class="dv">${teamTotal.toFixed(0)}/${teamNormal}</div><div class="dl">Team Capacity</div></div>
    <div class="dsum-card"><div class="dv">${counts.available||0}</div><div class="dl">Available</div></div>
    <div class="dsum-card"><div class="dv">${counts.nearlyfull||0}</div><div class="dl">Nearly Full</div></div>
    <div class="dsum-card"><div class="dv">${counts.full||0}</div><div class="dl">Full</div></div>
    <div class="dsum-card ${needingAttention.length?'attn':''}"><div class="dv">${needingAttention.length}</div><div class="dl">Over Capacity</div></div>
    <div class="dsum-card"><div class="dv">${activeMaster}<span style="font-size:13px;color:var(--ink-faint)">+${activeRevision}R</span></div><div class="dl">Active Work</div></div>
  </div>

  ${needingAttention.length ? `<div class="warn-box">⚠ ${needingAttention.length} Designer ต้องได้รับความสนใจ: ${needingAttention.map(d=>`${d.person} (${d.status.points.toFixed(1)}/${DAILY_CAP})`).join(', ')}</div>` : ''}

  <div class="dash-filters">
    <input id="dashSearch" placeholder="ค้นหา Designer..." value="${STATE.dash.search}">
    <select id="dashRoleFilter">
      <option value="ALL">All Roles</option>
      ${roles.map(r=>`<option value="${r}" ${STATE.dash.roleFilter===r?'selected':''}>${r}</option>`).join('')}
    </select>
    <select id="dashStatusFilter">
      <option value="ALL">All Status</option>
      ${Object.keys(DASH_STATUS_META).filter(k=>k!=='holiday').map(k=>`<option value="${k}" ${STATE.dash.statusFilter===k?'selected':''}>${DASH_STATUS_META[k].label}</option>`).join('')}
    </select>
    <div class="dash-datenav">
      <button type="button" class="btn btn-sm btn-ghost" id="dashPrev">‹</button>
      <strong>${fmtDate(date)}</strong>
      <button type="button" class="btn btn-sm btn-ghost" id="dashNext">›</button>
      <button type="button" class="btn btn-sm btn-ghost" id="dashToday">Today</button>
    </div>
    <div class="dash-viewtoggle">
      <button type="button" data-dashview="team" class="${STATE.dash.view==='team'?'active':''}">Team View</button>
      <button type="button" data-dashview="calendar" class="${STATE.dash.view==='calendar'?'active':''}">Calendar View</button>
    </div>
  </div>

  ${STATE.dash.view==='team' ? renderDesignerRows(list, date) : renderCapacityMatrix(all, date)}

  ${renderInsightsPanel(all)}

  ${STATE.dash.drawerDesigner ? renderDesignerDrawer() : ''}
  `;
}

function renderDesignerRows(list, date){
  if(list.length===0) return `<div class="card placeholder"><div class="ico">🔍</div>ไม่พบ Designer ที่ตรงกับ Filter นี้<div style="margin-top:8px"><button type="button" class="btn btn-sm btn-ghost" id="dashClearFilters">Clear Filters</button></div></div>`;
  return list.map(d=>{
    const over = d.status.points > DAILY_CAP;
    const pct = Math.min(100, Math.round(d.status.points/DAILY_CAP*100));
    const capDisplay = (d.status.key==='leave') ? 'On Leave' : (d.status.key==='holiday') ? 'Holiday' : `${d.status.points.toFixed(1)}/${DAILY_CAP}`;
    return `<div class="drow">
      <div class="drow-id">
        <div class="avatar">${d.person[0]}</div>
        <div><div class="nm">${d.person}</div><div class="rl">${d.role}</div></div>
      </div>
      <div class="drow-cap">
        <div class="capnum">${capDisplay}${over?`<span class="capover">+${(d.status.points-DAILY_CAP).toFixed(1)} Over</span>`:''}</div>
        <div class="drow-bar"><i class="${over?'over':''}" style="width:${pct}%"></i></div>
      </div>
      <div class="drow-breakdown">Master ${d.bd.masterPts.toFixed(1)}<br>Revise ${d.bd.revisionPts.toFixed(1)}</div>
      <div class="drow-strip">${render7DayStrip(d.person, date)}</div>
      <div class="drow-avail">Earliest<br><strong>${d.earliest ? (d.earliest===todayISO()?'Today':fmtDate(d.earliest)) : 'No slot'}</strong></div>
      <span class="status-pill ${d.status.cls}">${d.status.label}</span>
      <div class="drow-action"><button type="button" class="btn btn-sm btn-ghost" data-viewdrawer="${d.person}">View Details</button></div>
    </div>`;
  }).join('');
}

function render7DayStrip(person, startDate){
  let html = '';
  for(let i=0;i<7;i++){
    const ds = addDaysISO(startDate, i);
    const st = designerDayStatus(person, ds);
    const label = st.key==='leave' ? 'OFF' : st.key==='holiday' ? 'OFF' : st.points.toFixed(0);
    html += `<div class="strip-cell status-pill ${st.cls}" data-stripcell="${person}|${ds}" title="${fmtDate(ds)} — ${st.label}">
      <span class="sd">${new Date(ds+'T00:00:00').getDate()}</span>${label}</div>`;
  }
  return html;
}

function renderCapacityMatrix(all, startDate){
  const days = Array.from({length:7},(_,i)=>addDaysISO(startDate,i));
  const today = todayISO();
  const dow = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  return `<div class="card" style="overflow-x:auto">
    <table class="dash-matrix">
      <thead><tr><th>Designer</th>${days.map(d=>{
        const d0 = new Date(d+'T00:00:00');
        return `<th class="${d===today?'today-col':''}">${dow[d0.getDay()]} · ${fmtDate(d)}${d===today?' (วันนี้)':''}</th>`;
      }).join('')}</tr></thead>
      <tbody>
        ${all.map(d=>`<tr><td>${d.person}<div class="hint" style="font-weight:500">${d.role}</div></td>${days.map(ds=>{
          const st = designerDayStatus(d.person, ds);
          const bd = taskBreakdownFor(d.person, ds);
          if(st.key==='leave'||st.key==='holiday'){
            return `<td><div class="matrix-box mb-off" data-matrixcell="${d.person}|${ds}"><div class="mb-pts">OFF</div><div class="hint" style="font-size:9.5px">${st.key==='leave'?'ลา':'หยุด'}</div></div></td>`;
          }
          const tier = st.points>=DAILY_CAP ? 'locked' : (st.points>=DAILY_CAP*0.75 ? 'near' : 'avail');
          const pct = Math.min(100, Math.round(st.points/DAILY_CAP*100));
          return `<td><div class="matrix-box mb-${tier}" data-matrixcell="${d.person}|${ds}">
            ${bd.tasks.length ? `<span class="mb-badge">${bd.tasks.length} งาน</span>` : ''}
            <div class="mb-pts">${st.points.toFixed(1)} <small>/ ${DAILY_CAP.toFixed(1)}</small></div>
            <div class="mb-bar"><i style="width:${pct}%"></i></div>
          </div></td>`;
        }).join('')}</tr>`).join('')}
      </tbody>
    </table>
    <div class="matrix-legend">
      <span><i style="background:#A7F3D0"></i>ว่าง (Available, &lt; 6 pt)</span>
      <span><i style="background:#FDE68A"></i>ใกล้เต็ม (Near Full, ≥ 6 pt)</span>
      <span><i style="background:#FECACA"></i>เต็ม / ล็อค (Locked, ≥ 8 pt)</span>
    </div>
  </div>`;
}

function renderInsightsPanel(all){
  const over = all.filter(d=>d.status.points>DAILY_CAP && !d.status.isFullLeave);
  const available = all.filter(d=>d.status.key==='available'||d.status.key==='nearlyfull');
  const lines = [];
  if(over.length) lines.push(`${over.length} Designer อยู่ใน Over Capacity วันนี้: ${over.map(d=>d.person).join(', ')}`);
  if(available.length) lines.push(`${available.length} Designer สามารถรับงาน Standard เพิ่มได้วันนี้`);
  const highest = all.slice().sort((a,b)=>b.status.points-a.status.points)[0];
  if(highest && highest.status.points>0) lines.push(`${highest.person} มีภาระงานสูงสุดที่ ${highest.status.points.toFixed(1)}/${DAILY_CAP} pt`);
  if(lines.length===0) lines.push('ทุก Designer อยู่ใน Capacity ปกติวันนี้');
  return `<div class="card" style="margin-top:14px">
    <div class="section-title" style="margin-bottom:6px">Team Insights</div>
    <ul class="insight-list">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>
  </div>`;
}

function renderLeaveCalendarGrid(){
  const {calMonth, calYear} = STATE.leaveUI;
  const first = new Date(calYear, calMonth, 1);
  const startDow = (first.getDay()+6)%7; // Monday start
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = first.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  const dows = ['จ','อ','พ','พฤ','ศ','ส','อา'];
  const today = todayISO();
  let filtered = STATE.leaves;
  if(STATE.leaveUI.filterPerson!=='ALL') filtered = filtered.filter(l=>l.person===STATE.leaveUI.filterPerson);
  if(STATE.leaveUI.filterType!=='ALL') filtered = filtered.filter(l=>l.type===STATE.leaveUI.filterType);

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="lv-cell" style="visibility:hidden"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayLeaves = filtered.filter(l=>l.date===ds);
    const shown = dayLeaves.slice(0,2);
    const extra = dayLeaves.length - shown.length;
    cells += `<div class="lv-cell ${dayLeaves.length?'has-leave':''} ${ds===today?'today':''}" ${dayLeaves.length?`data-leaveday="${ds}"`:''}>
      <div class="lv-daynum">${d}</div>
      ${shown.map(l=>`<span class="lv-chip ${l.type}">${l.person}${l.type==='half'?' · '+(l.period||''):''}</span>`).join('')}
      ${extra>0?`<span class="lv-chip more">+${extra} more</span>`:''}
    </div>`;
  }
  return `
    <div class="lv-cal-nav">
      <button type="button" class="btn btn-sm btn-ghost" data-lvnav="-1">‹</button>
      <strong>${monthName}</strong>
      <button type="button" class="btn btn-sm btn-ghost" data-lvnav="1">›</button>
      <button type="button" class="btn btn-sm btn-ghost" id="lvToday">Today</button>
    </div>
    <div class="lv-grid">${dows.map(d=>`<div class="lv-dow">${d}</div>`).join('')}${cells}</div>
  `;
}

function renderUpcomingLeave(){
  const today = todayISO();
  let filtered = STATE.leaves.filter(l=>l.date>=today);
  if(STATE.leaveUI.filterPerson!=='ALL') filtered = filtered.filter(l=>l.person===STATE.leaveUI.filterPerson);
  if(STATE.leaveUI.filterType!=='ALL') filtered = filtered.filter(l=>l.type===STATE.leaveUI.filterType);
  filtered.sort((a,b)=>a.date.localeCompare(b.date));
  if(filtered.length===0) return `<div class="lv-empty-compact"><div style="font-size:22px">📅</div>ยังไม่มีวันลาในช่วงเวลานี้<div class="hint">No leave records for this period.</div></div>`;
  return filtered.map(l=>{
    const d = new Date(l.date+'T00:00:00');
    return `<div class="lv-upcoming-item">
      <div class="lv-upcoming-date">${d.getDate()}<br>${d.toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</div>
      <div class="lv-upcoming-info"><div class="nm">${l.person}</div><div class="tp">${leaveTypeLabel(l)}</div></div>
      <div class="lv-upcoming-pt">-${leaveCapacityImpact(l).toFixed(1)} pt</div>

  }).join('');
}

/* ---------- Performance Calculation (Dev Handoff — Phase N) ----------
   Point (Output) and Hour (Capacity) are strictly separate concepts: Output below is a POINT total (what
   was produced), Production Hours is an HOUR total (real time actually available for production) — they
   are only ever combined as a ratio (Productivity), never added/summed together.
     Working Hours   = business days in range × DAILY_CAP, minus leave (matches the existing Leave engine).
     Internal Hours  = every logged Internal Task's hours in range (Operational + Team Contribution alike).
     Production Hours = Working Hours − Internal Hours (never below 0).
     Output           = sum of taskLoadOnDate() across the range — the same "single source of truth" every
                         other capacity view (Calendar/Dashboard/Report) already reads, so Performance can
                         never disagree with what Capacity shows was scheduled for that person.
     Productivity     = Output / Production Hours (pt/h) — NOT raw Output alone, so a Designer who spent
                         real hours on legitimate non-Brief work is measured against the hours she actually
                         had left for production, not against a full 8h/day nobody gave her.
   Operational vs Team Contribution is a REPORTING split only (Lead-only Internal Breakdown drawer) — both
   classes reduce Production Hours identically, so contributing to the team never shows up as a performance
   penalty, but it also never artificially inflates the Productivity ratio either. */
function performanceStatsFor(person, fromDate, toDate){
  let workingHours=0, internalHours=0, output=0, opHours=0, contribHours=0;
  let d = fromDate, guard=0;
  while(d<=toDate && guard<400){
    guard++;
    if(!isWeekend(d) && !isPublicHoliday(d)){
      const leave = STATE.leaves.find(l=>l.person===person && l.date===d);
      const leaveDeduct = leave ? (leave.type==='full'?DAILY_CAP:DAILY_CAP/2) : 0;
      workingHours += Math.max(0, DAILY_CAP - leaveDeduct);
      output += taskBreakdownFor(person, d).total;
    }
    STATE.internalTasks.filter(it=>it.person===person && it.date===d).forEach(it=>{
      const h = internalTaskHours(it);
      internalHours += h;
      if(internalTaskClass(it)==='operational') opHours += h; else contribHours += h;
    });
    d = addDaysISO(d, 1);
  }
  workingHours = Math.round(workingHours*100)/100;
  internalHours = Math.round(internalHours*100)/100;
  output = Math.round(output*100)/100;
  const productionHours = Math.round(Math.max(0, workingHours-internalHours)*100)/100;
  const productivity = productionHours>0 ? Math.round((output/productionHours)*100)/100 : 0;
  const utilizationPct = workingHours>0 ? Math.round((productionHours/workingHours)*1000)/10 : 0;
  return {person, workingHours, internalHours, productionHours, output, productivity, utilizationPct,
    operationalHours: Math.round(opHours*100)/100, contributionHours: Math.round(contribHours*100)/100};
}

    if(!emailRaw.endsWith('@'+COMPANY_DOMAIN)){ toast(`ต้องเป็นอีเมล @${COMPANY_DOMAIN} เท่านั้น`); return; }
    const editingId = STATE.usersUI.editingId;
    const dup = STATE.users.find(u=>u.email.toLowerCase()===emailRaw && u.id!==editingId);
    if(dup){ toast('มีอีเมลนี้ในระบบแล้ว'); return; }
    const needsDept = ['po','designer','lead'].includes(role);
    // New Designer/Lead Designer/Admin accounts need an Initial Password set by Admin right here — no
    // separate invitation/activation step (Login spec §Initial Password).
    const needsPassword = !editingId && ['designer','lead','admin'].includes(role);
    const initialPassword = document.getElementById('uf_password')?.value || '';
    if(needsPassword && !initialPassword.trim()){ toast('กรุณาตั้ง Initial Password ให้ Designer'); return; }
    if(editingId){
      const u = STATE.users.find(x=>x.id===editingId);
      if(u){
        // Guard against locking everyone out of Admin Mode: block removing Admin Access from your own
        // account when you're the last active account that has it.
        const wasAdmin = u.role==='admin' || u.is_admin;
        if(u.email===STATE.auth.user?.email && wasAdmin && !isAdminChecked){
          const otherAdmins = STATE.users.filter(x=>x.id!==editingId && x.status==='active' && (x.role==='admin'||x.is_admin));
          if(otherAdmins.length===0){ toast('ไม่สามารถถอด Admin Access ของตัวเองได้ — เป็นบัญชีเดียวที่มีสิทธิ์ Admin อยู่ในระบบ'); return; }
        }
        u.name = name; u.role = role; u.department = needsDept ? (dept||null) : null; u.status = status;
        u.is_admin = isAdminChecked;
        if((role==='designer'||role==='lead') && !u.designer_status){ u.designer_status='active'; u.capacity = u.capacity||DAILY_CAP; }
        if(role==='designer'||role==='lead') ensurePeopleEntry(u.name, u.department);
      }
    } else {
      if(role==='designer'||role==='lead') ensurePeopleEntry(name, needsDept?(dept||null):null);
      STATE.users.push({
        id: genId('USR'), name, email: emailRaw, department: needsDept?(dept||null):null, role, status,
        is_admin: isAdminChecked,
        profile_image:null, created_at:new Date().toISOString(), last_login:null,
        ...(role==='designer'||role==='lead' ? {capacity:DAILY_CAP, designer_status:'active'} : {}),
        ...(needsPassword ? {password: initialPassword} : {}),
      });
    }
    STATE.usersUI.editingId = null;
    saveUsers(); render(); toast('บันทึกข้อมูลผู้ใช้แล้ว');
  });
  document.getElementById('cancelEditUser')?.addEventListener('click', ()=>{ STATE.usersUI.editingId=null; render(); });
  document.getElementById('userSearch')?.addEventListener('input', e=>{ STATE.usersUI.search=e.target.value; render(); });
  document.getElementById('userRoleFilter')?.addEventListener('change', e=>{ STATE.usersUI.roleFilter=e.target.value; render(); });
  document.querySelectorAll('[data-edituser]').forEach(b=>b.onclick=()=>{ STATE.usersUI.editingId=b.dataset.edituser; render(); });
  document.querySelectorAll('[data-toggleuser]').forEach(b=>b.onclick=()=>{
    const u = STATE.users.find(x=>x.id===b.dataset.toggleuser); if(!u) return;
    if(u.email===STATE.auth.user?.email){ toast('ไม่สามารถปิดการใช้งานบัญชีของตัวเองได้'); return; }
    u.status = u.status==='active' ? 'inactive' : 'active';
    saveUsers(); render();
  });
  // Accounts are never deleted (Login spec: Job History/KPI/Assignment/work history must stay intact) —
  // Deactivate (above) is the only way to close off an account. Designer/Lead/Admin accounts instead get
  // a Reset Password action here.
  document.querySelectorAll('[data-resetpw]').forEach(b=>b.onclick=()=>{ STATE.resetPasswordUI.userId=b.dataset.resetpw; render(); });
  document.getElementById('resetPwBg')?.addEventListener('click', (e)=>{ if(e.target.id==='resetPwBg'){ STATE.resetPasswordUI.userId=null; render(); } });
  document.getElementById('resetPwCancel')?.addEventListener('click', ()=>{ STATE.resetPasswordUI.userId=null; render(); });
  document.getElementById('resetPwSave')?.addEventListener('click', ()=>{
    const u = STATE.users.find(x=>x.id===STATE.resetPasswordUI.userId); if(!u) return;
    const val = document.getElementById('resetPwInput')?.value || '';
    if(!val.trim()){ toast('กรุณากรอกรหัสผ่านใหม่'); return; }
    u.password = val;
    STATE.resetPasswordUI.userId = null;
    saveUsers(); render(); toast(`ตั้งรหัสผ่านใหม่ให้ ${u.name} แล้ว`);
  });
}

function bindDepartmentManagement(){
  document.getElementById('deptForm')?.addEventListener('submit', e=>{
    e.preventDefault();

    const status = document.getElementById('df_status').value;
    if(!name){ toast('กรุณากรอกชื่อแผนก'); return; }
    const editingId = STATE.deptUI.editingId;
    const dup = STATE.departments.find(d=>d.name.toLowerCase()===name.toLowerCase() && d.id!==editingId);
    if(dup){ toast('มีแผนกชื่อนี้อยู่แล้ว'); return; }
    if(editingId){
      const d = STATE.departments.find(x=>x.id===editingId);
      if(d){
        const oldName = d.name;
        d.name = name; d.status = status;
        if(oldName!==name){ STATE.users.forEach(u=>{ if(u.department===oldName) u.department=name; }); saveUsers(); }
      }
    } else {
      STATE.departments.push({id: genId('DEPT'), name, status});
    }
    STATE.deptUI.editingId = null;
    saveDepartments(); render(); toast('บันทึกข้อมูลแผนกแล้ว');
  });
  document.getElementById('cancelEditDept')?.addEventListener('click', ()=>{ STATE.deptUI.editingId=null; render(); });
  document.querySelectorAll('[data-editdept]').forEach(b=>b.onclick=()=>{ STATE.deptUI.editingId=b.dataset.editdept; render(); });
  document.querySelectorAll('[data-toggledept]').forEach(b=>b.onclick=()=>{
    const d = STATE.departments.find(x=>x.id===b.dataset.toggledept); if(!d) return;
    d.status = d.status==='active'?'inactive':'active';
    saveDepartments(); render();
  });
  document.querySelectorAll('[data-rmdept]').forEach(b=>b.onclick=()=>{
    const d = STATE.departments.find(x=>x.id===b.dataset.rmdept); if(!d) return;
    const inUse = STATE.users.some(u=>u.department===d.name);

  });
}

/* ============================= EVENTS ============================= */
function bindEvents(){
  document.getElementById('logoutBtn')?.addEventListener('click', ()=>{
    STATE.auth = {loggedIn:false, role:null, identity:null, isAdminUnlocked:false, user:null};
    STATE.detailTaskId=null; STATE.notifOpen=false; STATE.editingTaskId=null; STATE.editingDraftId=null;
    STATE.accessDenied=false; STATE.accessDeniedEmail=null; STATE.googleChooserOpen=false;
    STATE.adminModeActive=false; STATE.adminModePanelOpen=false;
    STATE.vbProductPicker=null; STATE.vbReferenceForm=null; clearOverlay();
    render();
  });
  document.getElementById('notifBell')?.addEventListener('click', (e)=>{
    e.stopPropagation(); STATE.notifOpen = !STATE.notifOpen;
    if(STATE.notifOpen){ myNotifs().forEach(n=>n.read=true); saveNotifs(); }
    render();
  });
  // Navigation / Route Bug (Master Dev Spec §37-39): clicking a primary nav control (top Tab or
  // Sidebar item) is an intentional route change — it must behave exactly like the explicit Task Detail
  // "Back" button and unmount whatever page-scoped state belonged to where the user is LEAVING, the same
  // way it already gets cleared when leaving via Back. Before this fix, only vbProductPicker/
  // vbReferenceForm were cleared here — detailTaskId (Task Detail — a full page, not a modal, per its own
  // comment above renderTaskWorkspacePage) was never cleared by these two handlers, so renderMain()'s
  // `if(STATE.detailTaskId) return renderTaskWorkspacePage(t)` check (which runs before it even looks at
  // tab/sideSection) kept winning: the clicked nav item would highlight as active, but Main Content
  // stayed on the old Task Detail underneath it — exactly the "Active Menu changed, Content = Brief
  // Detail" bug the spec describes. Route (tab + sideSection) is the single source of truth for what's
  // on screen; every page-scoped/"portal" piece of state below (Task Detail's own zoom/page/fullscreen,
  // its Image Lightbox, the Visual Editor's Crop Mode overlay) is cleaned up here rather than papered
  // over with a display:none, so none of it can leak into whatever page comes next.
  function resetLeftPageEphemeralState(){
    STATE.detailTaskId = null;
    STATE.taskWs = {zoom:'fit', activePageId:null, fullscreen:false, sectionOpen:{}};
    STATE.taskWsLightbox = null;
    STATE.vbProductPicker = null; STATE.vbReferenceForm = null; STATE.vbImgCrop = null;
    clearOverlay();
  }
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    STATE.tab=b.dataset.tab;
    // A Project Owner's "workflow" tab is their own nav (My Workspace/My Briefs/…), never the internal
    // multi-owner Process Board — keep them landing on poHome, not board.
    if(STATE.tab==='workflow') STATE.sideSection = STATE.auth.role==='po' ? 'poHome' : 'board';
    if(!(STATE.tab==='workflow' && STATE.sideSection==='brief')) STATE.editingTaskId=null;
    resetLeftPageEphemeralState();
    render();
  });
  document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{
    if(b.dataset.side!=='brief') STATE.editingTaskId=null;
    STATE.sideSection=b.dataset.side;
    resetLeftPageEphemeralState();
    STATE.changePasswordUI.error = '';
    render();
  });

  // Project Owner: My Workspace / My Briefs / Drafts (no-ops on pages where these elements don't exist)
  bindPOWorkspace();
  // Admin: User / Department / Designer Management (no-ops on pages where these elements don't exist)
  bindUserManagement();
  bindDepartmentManagement();
  bindDesignerManagement();
  bindProfileSecurity();
  bindEditQuantityModal();
  bindReassignModal();
  bindBackdatedTaskForm();
  bindFrameTool();
  // Admin Mode toggle in the top nav (Enter/Exit) + its password panel
  bindAdminModePanel();

  // brief form
  const cat = document.getElementById('f_category');
  const type = document.getElementById('f_type');
  if(cat){
    const onCategoryChange = (skipPlatformReset)=>{
      const catVal = cat.value;
      const typeOtherWrap = document.getElementById('typeOtherWrap');
      if(!catVal){
        type.innerHTML = `<option value="">— เลือกประเภท Artwork —</option>`; type.disabled = true;
        document.getElementById('platformField').style.display='none';
        document.getElementById('kvSection').style.display='none';
        typeOtherWrap.style.display='none';
      } else if(catVal===OTHER_CATEGORY){
        type.innerHTML = `<option value="อื่นๆ ระบุ">อื่นๆ ระบุ (พิมพ์ด้านล่าง)</option>`; type.value='อื่นๆ ระบุ'; type.disabled = true;
        document.getElementById('platformField').style.display='none';
        document.getElementById('kvSection').style.display='none';
        typeOtherWrap.style.display='block';
        if(!skipPlatformReset){ BRIEF_DRAFT.platforms = new Set(); BRIEF_DRAFT.customPlatform=''; }
      } else {
        const types = MASTER_TABLE[catVal].types;
        type.innerHTML = `<option value="">— เลือกประเภท Artwork —</option>` + Object.keys(types).map(t=>`<option value="${t}">${t}</option>`).join('');
        type.disabled = false;
        typeOtherWrap.style.display='none';
        const platField = document.getElementById('platformField');
        if(PLATFORMS_BY_CATEGORY[catVal]){
          platField.style.display='block';
          document.getElementById('platformPillsWrap').innerHTML = renderPlatformSelectHTML(catVal);
          bindPlatformSelect();
        } else { platField.style.display='none'; }
        if(!skipPlatformReset){ BRIEF_DRAFT.platforms = new Set(); BRIEF_DRAFT.customPlatform=''; }
      }
      refreshBriefForm();
    };
    cat.onchange = ()=>onCategoryChange(false);
    const isEditingBrief = !!STATE.editingTaskId;
    onCategoryChange(isEditingBrief);

    row.addEventListener('dragstart', ()=>{ dragSrcId = row.dataset.dragid; row.classList.add('dragging'); });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); });
    row.addEventListener('dragover', e=>{ e.preventDefault(); });
    row.addEventListener('drop', async e=>{
      e.preventDefault();
      const targetId = row.dataset.dragid;
      if(!dragSrcId || dragSrcId===targetId) return;
      const p = STATE.products.find(x=>x.id===STATE.pui.drawerProductId);
      if(!p) return;
      const list = p.assets;
      const srcIdx = list.findIndex(a=>a.id===dragSrcId);
      const tgtIdx = list.findIndex(a=>a.id===targetId);
      if(srcIdx===-1||tgtIdx===-1) return;
      const [moved] = list.splice(srcIdx,1);
      list.splice(tgtIdx,0,moved);
      list.forEach((a,i)=>a.order=i);
      p.updatedAt = new Date().toISOString();
      await saveProducts();
      dragSrcId=null;
      render();
    });
  });

/* ---------- Image attachments (client-side resize to <=1600px, max 10) ---------- */
function resizeImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1600;
        let {width,height} = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height = Math.round(height*maxDim/width); width=maxDim; }
          else { width = Math.round(width*maxDim/height); height=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleImageUpload(e){
  const files = Array.from(e.target.files || []);
  if(BRIEF_DRAFT.attachments.length + files.length > 10){
    toast('แนบได้สูงสุด 10 รูป'); e.target.value=''; return;
  }
  for(const f of files){
    try{
      const dataUrl = await resizeImageFile(f);
      BRIEF_DRAFT.attachments.push({id:'att_'+Math.random().toString(36).slice(2,9), name:f.name, dataUrl});
    }catch(err){ toast('อัปโหลดรูปไม่สำเร็จ: '+f.name); }
  }
  e.target.value='';
  renderUploadGrid();
  updateBriefReadiness();
}
function uploadGridHTML(){
  return BRIEF_DRAFT.attachments.map(a=>`
    <div class="upload-thumb" draggable="true" data-dragatt="${a.id}">
      <img src="${a.dataUrl}">
      <button type="button" class="rm" data-rmatt="${a.id}" title="ลบ">✕</button>
      <button type="button" class="use-oncanvas" data-useoncanvas="${a.id}" title="เพิ่มลงบน Canvas">＋ Canvas</button>
    </div>
  `).join('') + (BRIEF_DRAFT.attachments.length<10 ? `<label class="upload-add">＋<input type="file" id="f_upload" accept="image/*" multiple style="display:none"></label>` : '');
}
function renderUploadGrid(){
  const grid = document.getElementById('uploadGrid');
  if(!grid) return;
  grid.innerHTML = uploadGridHTML();
  bindUploadGrid();
}
function bindUploadGrid(){
  document.getElementById('f_upload')?.addEventListener('change', handleImageUpload);
  document.querySelectorAll('[data-rmatt]').forEach(b=>b.onclick=()=>{
    BRIEF_DRAFT.attachments = BRIEF_DRAFT.attachments.filter(a=>a.id!==b.dataset.rmatt);
    renderUploadGrid();
    updateBriefReadiness();
  });
  document.querySelectorAll('[data-useoncanvas]').forEach(b=>b.onclick=async ()=>{
    const att = BRIEF_DRAFT.attachments.find(a=>a.id===b.dataset.useoncanvas);
    const page = activeVBPage();
    if(!att || !page) return;
    // Reference Image → Canvas gets the same page-filling default size (§34) as Upload/Drag & Drop.
    const fit = await fitImageSizeToPage(att.dataUrl);
    pushUndoVB();
    const el = newVisualElement('image', {x:fit.x, y:fit.y, width:fit.width, height:fit.height, content:{dataUrl:att.dataUrl}, style:{objectFit:'cover'}});
    page.elements.push(el);
    BRIEF_DRAFT.visualBrief.selectedIds=[el.element_id];
    scheduleAutosave();
    refreshVisualEditor();
  });
  // Drag a reference image thumbnail from the Brief Inputs list straight onto the Canvas.
  document.querySelectorAll('[data-dragatt]').forEach(thumb=>{
    thumb.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/vb-attachment', thumb.dataset.dragatt); });
  });
}

function currentTaskPoints(){
  // Resize (Master Dev Spec Phase E) is always summed ON TOP of pointsForTask()'s own result — see the
  // note above resizePoints() — so this live Points preview must add it too, or it would disagree with
  // what submitBrief() actually stores as base_points.
  const resizePts = resizePoints(document.getElementById('f_resize')?.value || 0);
  const catEl=document.getElementById('f_category'), typeEl=document.getElementById('f_type');
  if(!catEl || !catEl.value || catEl.value===OTHER_CATEGORY || !typeEl || !typeEl.value) return (Number(document.getElementById('f_custom')?.value || 0)) + resizePts;
  const tmp = {
    task_category: catEl.value, task_type: typeEl.value,
    kv_status_check: BRIEF_DRAFT.kv,
    deliverables: document.getElementById('f_deliverables')?.value || 1,
    customPoints: document.getElementById('f_custom')?.value || 0,
  };
  return pointsForTask(tmp) + resizePts;
}

function bindBriefStepper(){
  const stepper = document.getElementById('briefStepper');
  if(!stepper) return;
  const items = Array.from(stepper.querySelectorAll('[data-stepgoto]'));
  const sectionIds = items.map(it=>it.dataset.stepgoto);
  items.forEach(it=>it.onclick = ()=>{
    const target = document.getElementById(it.dataset.stepgoto);
    if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    // optimistic immediate feedback — the scroll-driven update below confirms/corrects it once scrolling settles
    items.forEach(x=>x.classList.toggle('active', x===it));
  });
  // Whichever ancestor actually scrolls (the window, or the .main panel when it overflows
  // internally), getBoundingClientRect() is viewport-relative either way, so this works for both.
  const updateActive = ()=>{
    if(!document.getElementById('briefStepper')) return;
    const doc = document.documentElement;
    const nearBottom = (window.scrollY + window.innerHeight) >= (doc.scrollHeight - 4);
    let currentId = sectionIds[0];
    if(nearBottom){
      currentId = sectionIds[sectionIds.length-1];
    } else {
      for(const id of sectionIds){
        const sec = document.getElementById(id);
        if(!sec) continue;
        if(sec.getBoundingClientRect().top <= 140) currentId = id;
      }
    }
    items.forEach(it=>{
      const idx = sectionIds.indexOf(it.dataset.stepgoto);
      const curIdx = sectionIds.indexOf(currentId);
      it.classList.toggle('active', it.dataset.stepgoto===currentId);
      it.classList.toggle('done', idx<curIdx);
    });
  };
  // Each render rebuilds #app (and #briefStepper with it), so the previous updateActive closure
  // would keep pointing at now-detached buttons — always swap in the fresh handler on window.
  if(window.__stepperScrollHandler) window.removeEventListener('scroll', window.__stepperScrollHandler);
  window.__stepperScrollHandler = updateActive;
  window.addEventListener('scroll', updateActive, {passive:true});
  const mainEl = document.querySelector('.main');
  if(mainEl && !mainEl.__stepperScrollBound){
    mainEl.__stepperScrollBound = true;
    mainEl.addEventListener('scroll', updateActive, {passive:true});
  }
  updateActive();
}

function updateBriefReadiness(){
  const owner = document.getElementById('f_owner')?.value.trim();
  const deptSel = document.getElementById('f_dept')?.value;
  const deptOk = deptSel && (deptSel!==OTHER_CATEGORY || BRIEF_DRAFT.deptOther.trim());
  const taskname = document.getElementById('f_taskname')?.value.trim();
  const catEl = document.getElementById('f_category');
  const catVal = catEl?.value;
  const typeEl = document.getElementById('f_type');
  const isOtherCat = catVal===OTHER_CATEGORY;
  const typeOk = isOtherCat ? BRIEF_DRAFT.typeOther.trim() : !!typeEl?.value;
  const deliverables = document.getElementById('f_deliverables')?.value;
  const dateVal = STATE.cal.selectedDate;
  const kvSection = document.getElementById('kvSection');
  const kvSectionVisible = kvSection && kvSection.style.display!=='none';
  const kvOk = !kvSectionVisible ? true : !!BRIEF_DRAFT.kv;
  const kvLinkOk = !kvSectionVisible ? true : (BRIEF_DRAFT.kv==='HAS_WORKING_FILE' ? !!document.getElementById('f_kvlink_input')?.value.trim() : true);
  const badge = document.getElementById('sumReady');
  const btn = document.getElementById('submitBriefBtn');
  const cbox = document.getElementById('completenessBox');
  if(cbox) cbox.innerHTML = renderBriefCompleteness();
  if(!badge || !btn) return;

  const priority = BRIEF_DRAFT.priority;
  const needsApproval = PRIORITY_NEEDS_APPROVAL[priority];
  let dateAllowed = !!dateVal;
  const assignee = isOtherCat ? null : computeAssigneeFromForm();
  if(dateVal && assignee){
    const ev = evaluateDelivery(assignee, dateVal, currentTaskPoints(), priority);
    dateAllowed = ev.allowed;
  }
  const urgencyOk = !needsApproval ? true : (BRIEF_DRAFT.urgencyReason && (BRIEF_DRAFT.urgencyReason!=='Other' || BRIEF_DRAFT.urgencyNote.trim()));

  const missing = [];
  if(!owner) missing.push('Project Owner Email');
  if(!deptOk) missing.push('Department' + (deptSel===OTHER_CATEGORY?' (ระบุแผนก)':''));
  if(!taskname) missing.push('Task Name');
  if(!catVal) missing.push('Task Category');
  if(catVal && !typeOk) missing.push('Artwork Type');
  if(!deliverables || Number(deliverables)<1) missing.push('No. of Deliverables');
  if(kvSectionVisible && !kvOk) missing.push('KV Status');
  if(kvSectionVisible && kvOk && !kvLinkOk) missing.push('KV Asset Link');
  if(!dateVal) missing.push('Requested Delivery Date');
  else if(!dateAllowed) missing.push('Requested Delivery Date (วันที่เลือกไม่ผ่านเงื่อนไข)');
  if(needsApproval && !urgencyOk) missing.push('เหตุผลที่ขอเร่งงาน');

  const ready = missing.length===0;
  btn.textContent = needsApproval ? '📨 ส่งขออนุมัติจาก Lead Designer' : '🚀 ส่งบรีฟ (Submit Brief)';

  if(ready){
    badge.className='readybadge ok';
    badge.innerHTML = needsApproval ? '✓ พร้อมส่งขออนุมัติจาก Lead Designer' : '✓ พร้อม Submit';
    btn.disabled=false;
  } else {
    badge.className='readybadge pending';
    badge.innerHTML = `⚠ ยังขาดข้อมูล ${missing.length} รายการ<ul style="margin:6px 0 0 18px;padding:0;font-weight:500;font-size:11.5px">${missing.map(m=>`<li>${m}</li>`).join('')}</ul>`;
    btn.disabled=true;
  }
}
function bindCalendarPick(){
  document.querySelectorAll('[data-caldate]').forEach(c=>c.onclick=()=>{
    if(c.classList.contains('past')||c.classList.contains('empty')||c.dataset.blocked==='true') return;
    if(c.dataset.calmode==='picker'){
      const dateStr = c.dataset.caldate;
      STATE.cal.selectedDate = dateStr;
      const hidden = document.getElementById('f_date');
      if(hidden) hidden.value = dateStr;
      // Calendar → Priority: recalc priority from working-day difference (date is source of truth)
      const diff = workingDaysBetween(todayISO(), dateStr);
      const newPriority = priorityFromDiff(diff);
      if(newPriority !== BRIEF_DRAFT.priority){
        BRIEF_DRAFT.priority = newPriority;
        BRIEF_DRAFT.prioritySource = 'calculated_from_date';
        BRIEF_DRAFT.urgencyReason=''; BRIEF_DRAFT.urgencyNote='';
        const diffLabel = diff<=0 ? 'วันทำการเดียวกัน' : `${diff} วันทำการถัดไป`;
        toast(`ปรับ Priority เป็น ${newPriority} อัตโนมัติ — วันที่เลือกคือ ${diffLabel}`);
        document.querySelectorAll('.pilltoggle[data-priorityopt]').forEach(x=>x.classList.toggle('active', x.dataset.priorityopt===newPriority));
      }
      refreshBriefForm();
    }
  });
  document.querySelectorAll('[data-calnav]').forEach(b=>{
    if(b.dataset.calmode!=='picker') return;
    b.onclick=()=>{
      STATE.cal.month += Number(b.dataset.calnav);
      if(STATE.cal.month<0){STATE.cal.month=11; STATE.cal.year--;}
      if(STATE.cal.month>11){STATE.cal.month=0; STATE.cal.year++;}
      refreshBriefForm();
    };
  });
}

async function submitBrief(e){
  e.preventDefault();
  const catName = document.getElementById('f_category').value;
  const isOtherCat = catName===OTHER_CATEGORY;
  const typeName = isOtherCat ? 'อื่นๆ ระบุ' : document.getElementById('f_type').value;
  const def = isOtherCat ? {custom:true} : MASTER_TABLE[catName].types[typeName];
  const priority = BRIEF_DRAFT.priority;
  const needsApproval = PRIORITY_NEEDS_APPROVAL[priority];
  const kv = BRIEF_DRAFT.kv;
  const deliverables = Number(document.getElementById('f_deliverables')?.value || 1);
  const customPoints = Number(document.getElementById('f_custom')?.value || 0);
  const platforms = Array.from(BRIEF_DRAFT.platforms).map(p=>p==='อื่นๆ ระบุ' ? (BRIEF_DRAFT.customPlatform.trim()||'อื่นๆ') : p);
  const deptSel = document.getElementById('f_dept').value;
  const department = deptSel===OTHER_CATEGORY ? BRIEF_DRAFT.deptOther.trim() : deptSel;
  let date = STATE.cal.selectedDate;
  if(!date){ toast('กรุณาเลือกวันที่ต้องการรับงาน'); return; }

  // Brief Owner Email is required when a Designer/Lead Designer creates the brief (they are Created By,
  // not Brief Owner — see the Task Data Model note above renderBriefForm's requester-card). For a Project
  // Owner submitting their own brief, f_owner is auto-filled+hidden and always valid.
  const ownerEmailRaw = document.getElementById('f_owner')?.value?.trim() || '';
  if(STATE.auth.role!=='po' && (!ownerEmailRaw || !ownerEmailRaw.includes('@'))){
    toast('กรุณากรอก Brief Owner Email ให้ถูกต้องก่อน Submit'); return;
  }

  const role = isOtherCat ? 'Pending Assignment' : (def.reroute ? MASTER_TABLE[def.reroute].role : MASTER_TABLE[catName].role);
  let assignee = null;
  if(role==='E-Commerce Designer') assignee='Krissha';
  else if(role==='Content Designer') assignee='Pongpoj';
  else if(role==='Product Designer') assignee='Suriya';
  if(!isDesignerAvailableForAutoAssign(assignee)) assignee = null; // Leave/Inactive -> Lead assigns manually

  // Resize (Master Dev Spec Phase E): a separate point pool from Deliverables, always summed on top —
  // never merged into pointsForTask()'s own formula. Applies to every task type/category.
  const resizeQty = Number(document.getElementById('f_resize')?.value || 0);
  const resizePts = resizePoints(resizeQty);
  const base = (isOtherCat ? customPoints : pointsForTask({task_category:catName, task_type:typeName, kv_status_check:kv, deliverables, customPoints})) + resizePts;

  // Final revalidation (client-side stand-in for server revalidation) using live data at submit time
  let projectedCapacity = null, overCapacity = false, capacityAllocation = null;
  if(assignee){
    const ev = evaluateDelivery(assignee, date, base, priority);
    if(!ev.allowed){
      toast('🔒 '+ev.reason+' — กรุณาเลือกวันอื่น หรือปรับ Priority'); return;
    }
    projectedCapacity = ev.projected; overCapacity = ev.overCapacity;
    if(ev.splitUsed) capacityAllocation = ev.splitAllocation;
  }
  if(needsApproval){
    if(!BRIEF_DRAFT.urgencyReason){ toast('กรุณาเลือกเหตุผลที่ขอเร่งงานก่อน Submit'); return; }
    if(BRIEF_DRAFT.urgencyReason==='Other' && !BRIEF_DRAFT.urgencyNote.trim()){ toast('กรุณาระบุรายละเอียดเหตุผล'); return; }
  }

  const taskName = document.getElementById('f_taskname').value;

  const briefDetails = {
    mode: 'unified',
    header: document.getElementById('f_header')?.value || '',
    sub_header: document.getElementById('f_subheader')?.value || '',
    detail: document.getElementById('f_detail')?.value || '',
    cta: document.getElementById('f_cta')?.value || '',
    disclaimer: document.getElementById('f_disclaimer')?.value || '',
    attachments: BRIEF_DRAFT.attachments.slice(),
    extra_links: BRIEF_DRAFT.extraLinks.filter(l=>l.url && l.url.trim()).map(l=>({id:l.id, label:(l.label||'').trim()||'Open Link', url:l.url.trim()})),
    visual_brief: {pages: JSON.parse(JSON.stringify(BRIEF_DRAFT.visualBrief.pages))},
  };

  // Edit Brief (Dev Brief §20/§21): update the existing task in place, log a new revision,
  // and flag+notify the assigned Designer if any "important" field changed.
  if(STATE.editingTaskId){
    const existing = STATE.tasks.find(x=>x.task_id===STATE.editingTaskId);
    if(!existing){ toast('ไม่พบบรีฟเดิม — อาจถูกลบไปแล้ว'); STATE.editingTaskId=null; render(); return; }
    const before = {deliverables:existing.deliverables, resize_quantity:existing.resize_quantity||0, platform:existing.platform, task_type:existing.task_type, priority:existing.priority, prefer_delivery_date:existing.prefer_delivery_date};
    const after = {deliverables, resize_quantity:resizeQty, platform:platforms, task_type:typeName, priority, prefer_delivery_date:date};
    const changedFields = IMPORTANT_CHANGE_FIELDS.filter(f=>JSON.stringify(before[f.key])!==JSON.stringify(after[f.key]));

    Object.assign(existing, {
      project_owner_email: document.getElementById('f_owner').value,
      department, department_other: deptSel===OTHER_CATEGORY ? department : null,
      project_name: document.getElementById('f_project').value.trim(),
      task_name: taskName, priority, needsApproval, platform: platforms,
      task_category: catName, task_type: typeName,
      task_type_other: isOtherCat ? BRIEF_DRAFT.typeOther.trim() : null,
      kv_status_check: (def && def.kv!==undefined) ? kv : null,
      kv_asset_link: document.getElementById('f_kvlink_input')?.value || '',
      deliverables, resize_quantity: resizeQty, customPoints,
      brief_link: document.getElementById('f_brieflink')?.value || '',
      brief_details: briefDetails,
      prefer_delivery_date: date, sla_date: earliestDeliveryForPriority(priority),
      base_points: base, prioritySource: BRIEF_DRAFT.prioritySource, projectedCapacity, overCapacity,
      capacity_allocation: capacityAllocation,
    });
    existing.edit_revision = (existing.edit_revision||1) + 1;
    existing.edit_history = existing.edit_history || [];
    existing.edit_history.push({
      timestamp: nowIso(), editedBy: STATE.auth.identity, revisionLabel: 'Revision '+existing.edit_revision,
      changedFields: changedFields.map(f=>({label:f.label, before:f.fmt(before[f.key]), after:f.fmt(after[f.key])})),
    });
    const diffText = changedFields.map(f=>`${f.label}: ${f.fmt(before[f.key])} → ${f.fmt(after[f.key])}`).join(' · ');
    existing.review_history.push({timestamp: nowIso(), action:'EDIT_BRIEF',
      comment: `บันทึกเป็น Revision ${existing.edit_revision}` + (changedFields.length ? ' — Important Changes: '+diffText : ''),
      by: STATE.auth.user?.name || STATE.auth.identity || 'system'});

    if(changedFields.length && existing.assigned_user_name){
      notify(existing.assigned_user_name, '✎ Brief Updated — Important Changes', `"${existing.task_name}" (${existing.task_id}) — ${diffText}`);
    }
    await saveTasks();
    toast(`💾 บันทึกการแก้ไขแล้ว — Revision ${existing.edit_revision}` + (changedFields.length?' · แจ้งเตือน Designer แล้ว':''));
    STATE.editingTaskId = null;
    STATE.tab='workflow'; STATE.sideSection='board'; STATE.cal.selectedDate=null;
    render();
    return;
  }

  const task = {
    task_id: uid(),
    // Task Data Model (Master Dev Spec §3): Created By (who actually submitted this — always the logged-in
    // account, never overwritten on Edit) is tracked separately from Brief Owner (project_owner_email, the
    // stakeholder the brief is FOR) and Assigned Designer (assigned_user_name, set further below). For a
    // Project Owner submitting their own brief these collapse to the same person, which is expected.
    created_by_email: STATE.auth.user?.email || STATE.auth.identity,
    created_by_name: STATE.auth.user?.name || STATE.auth.identity,
    created_by_role: STATE.auth.user?.role || STATE.auth.role,
    project_owner_email: document.getElementById('f_owner').value,
    department, department_other: deptSel===OTHER_CATEGORY ? department : null,
    project_name: document.getElementById('f_project').value.trim(),
    task_name: taskName,
    // Dev Spec — Backdated Task & Historical Work Migration §2: every task now carries record_source so
    // LIVE (normal Brief flow), BACKDATED (Lead/Designer-entered after the fact) and MIGRATED (bulk import
    // from the old system, reserved for a future importer) can be told apart everywhere in reporting.
    record_source: 'LIVE',
    priority, needsApproval, platform: platforms,
    task_category: catName, task_type: typeName,
    task_type_other: isOtherCat ? BRIEF_DRAFT.typeOther.trim() : null,
    kv_status_check: (def && def.kv!==undefined) ? kv : null,
    kv_asset_link: document.getElementById('f_kvlink_input')?.value || '',
    // Original (Brief) Quantity vs Actual Quantity (Master Dev Spec Phase E): original_deliverables is a
    // permanent snapshot of what the brief asked for at submit time and never changes; deliverables itself
    // is the ACTUAL/current quantity — the one pointsForTask()/appliedPoints()/Capacity always read — and
    // can be changed later by the assigned Designer/Lead via the "Edit Quantity" action (required Reason,
    // logged to quantity_change_history below), never through re-submitting the Brief Form.
    deliverables, original_deliverables: deliverables, resize_quantity: resizeQty, quantity_change_history: [],
    customPoints,
    brief_link: document.getElementById('f_brieflink')?.value || '',
    brief_details: briefDetails,
    brief_timestamp: new Date().toISOString(),
    prefer_delivery_date: date,
    sla_date: earliestDeliveryForPriority(priority),
    assigned_role: role,
    suggested_designer: assignee,
    assigned_user_name: needsApproval ? null : (assignee || LEAD),
    base_points: base,
    capacity_allocation: capacityAllocation,
    revise_status: "None",
    aw_link: '', aw_delivery_timestamp: '',
    review_status: needsApproval ? 'pending_lead_approval' : 'new',
    review_comment: '',
    revision_count: 0,
    edit_revision: 1, edit_history: [],
    deadline_extension_request: null,
    prioritySource: BRIEF_DRAFT.prioritySource,
    projectedCapacity, overCapacity,
    urgencyReason: needsApproval ? BRIEF_DRAFT.urgencyReason : null,
    urgencyNote: (needsApproval && BRIEF_DRAFT.urgencyReason==='Other') ? BRIEF_DRAFT.urgencyNote : null,
    overrideBy: needsApproval ? STATE.auth.identity : null,
    overrideAt: needsApproval ? new Date().toISOString() : null,
    review_history: [{timestamp:new Date().toISOString(), action: needsApproval ? 'REQUEST_LEAD_APPROVAL' : 'SUBMIT_BRIEF', comment: needsApproval ? `${priority} — ${BRIEF_DRAFT.urgencyReason}` : '', by: STATE.auth.user?.name || STATE.auth.identity || 'system'}],
  };
  STATE.tasks.push(task);
  await saveTasks();

  if(needsApproval){
    notify(LEAD, '🔒 Lead Designer Approval Required', `"${taskName}" (${priority}) — Suggested: ${assignee||'—'} — ${fmtDate(date)} — เหตุผล: ${BRIEF_DRAFT.urgencyReason}${overCapacity?' (เกิน Capacity ปกติ)':''}`);
    toast('📨 ส่งขออนุมัติจาก Lead Designer แล้ว: '+task.task_id);
  } else {
    notify(task.assigned_user_name, '📝 บรีฟใหม่', `${task.task_name} (${task.task_id}) — กำหนดส่ง ${fmtDate(task.prefer_delivery_date)}`);
    toast('✅ ส่งบรีฟสำเร็จ: '+task.task_id);
  }
  STATE.tab='workflow'; STATE.sideSection='board'; STATE.cal.selectedDate=null;
  render();
}

async function addCategory(name){
  const trimmed = name.trim();
  if(!trimmed) return;
  if(STATE.productCategories.includes(trimmed)){ toast('มีหมวดนี้อยู่แล้ว'); return; }
  STATE.productCategories.push(trimmed);
  await saveCategories();
  render();
}
async function renameCategory(oldName, newName){
  const trimmed = newName.trim();
  if(!trimmed || trimmed===oldName) return;
  if(STATE.productCategories.includes(trimmed)){ toast('มีหมวดชื่อนี้อยู่แล้ว'); render(); return; }
  const idx = STATE.productCategories.indexOf(oldName);
  if(idx===-1) return;
  STATE.productCategories[idx] = trimmed;
  STATE.products.forEach(p=>{ if(p.category===oldName) p.category=trimmed; });
  await Promise.all([saveCategories(), saveProducts()]);
  render();
}
async function deleteCategory(name){
  const count = STATE.products.filter(p=>p.category===name).length;
  if(count>0){
    toast(`This category contains ${count} products. Please move the products to another category before deleting it.`);
    return;
  }
  STATE.productCategories = STATE.productCategories.filter(c=>c!==name);
  await saveCategories();
  render();
}
async function moveCategory(index, dir){
  const list = STATE.productCategories;
  const newIdx = index+dir;
  if(newIdx<0 || newIdx>=list.length) return;
  [list[index], list[newIdx]] = [list[newIdx], list[index]];
  await saveCategories();
  render();
}

async function importProductsCsv(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0, newCats = 0;
  for(const line of lines){
    const parts = line.split(',').map(s=>s.trim());
    if(parts.length<5) continue;
    const [nameTh, nameEn, sku, category, driveLink] = parts;
    if(!nameTh || !sku) continue;
    if(!STATE.productCategories.includes(category)){ STATE.productCategories.push(category); newCats++; }
    STATE.products.push({id:uid(), nameTh, nameEn, sku, category, driveLink, thumbnail:null, colors:[], assets:[], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()});
    added++;
  }
  if(added>0){ await Promise.all([saveProducts(), saveCategories()]); toast(`✅ นำเข้า ${added} สินค้า${newCats?` (สร้างหมวดใหม่ ${newCats})`:''}`); }
  else toast('ไม่พบข้อมูลที่นำเข้าได้ — ตรวจรูปแบบ CSV อีกครั้ง');
  STATE.pui.importOpen=false;
  render();
}

// Backup/Restore must mirror EVERY key this app persists to central Storage (see loadData() / the
// saveXxx() wrappers above) — not just the "content" collections. Users/Departments/Drafts/CI
// Reference Center/Brief Template Links used to be silently left out here, which meant a Restore
// after a bad deploy would quietly reset accounts, drafts and brand-standard data even though the
// button implied a full backup. Keep this list and loadData()'s `keys` map (plus the standalone
// wt_categories/wt_platforms/wt_design_assets/wt_brand_colors/wt_ci_categories/wt_ci_guidelines/
// wt_templates loads) in sync whenever a new persisted field is added.
function exportBackup(){
  const backup = {
    exported_at:new Date().toISOString(),
    tasks:STATE.tasks, leaves:STATE.leaves, products:STATE.products, productCategories:STATE.productCategories,
    platforms:STATE.platforms, designAssets:STATE.designAssets, brandColors:STATE.brandColors,
    notifications:STATE.notifications, internalTasks:STATE.internalTasks,
    users:STATE.users, departments:STATE.departments, drafts:STATE.drafts,
    ciCategories:STATE.ciCategories, ciGuidelines:STATE.ciGuidelines,
    briefTemplates:BRIEF_TEMPLATES,
  };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`worldtech_backup_${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast('📤 ดาวน์โหลด Backup แล้ว (ครบทุกชุดข้อมูล รวม User / Department / Draft / CI / Template)');
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      // Schema safe mode: only accept known arrays/objects, keep existing if missing from the file
      // (e.g. restoring an older backup taken before a field existed must not wipe today's data).
      if(Array.isArray(data.tasks)) STATE.tasks = data.tasks;
      if(Array.isArray(data.leaves)) STATE.leaves = data.leaves;
      if(Array.isArray(data.products)) STATE.products = data.products;
      if(Array.isArray(data.productCategories)) STATE.productCategories = data.productCategories;
      if(Array.isArray(data.platforms)) STATE.platforms = data.platforms;
      if(Array.isArray(data.designAssets)) STATE.designAssets = data.designAssets;
      if(Array.isArray(data.brandColors)) STATE.brandColors = data.brandColors;
      if(Array.isArray(data.notifications)) STATE.notifications = data.notifications;
      if(Array.isArray(data.internalTasks)) STATE.internalTasks = data.internalTasks;
      if(Array.isArray(data.users)) STATE.users = data.users;
      if(Array.isArray(data.departments)) STATE.departments = data.departments;
      if(Array.isArray(data.drafts)) STATE.drafts = data.drafts;
      if(Array.isArray(data.ciCategories)) STATE.ciCategories = data.ciCategories;
      if(Array.isArray(data.ciGuidelines)) STATE.ciGuidelines = data.ciGuidelines;
      if(data.briefTemplates && typeof data.briefTemplates==='object' && !Array.isArray(data.briefTemplates)){
        Object.keys(BRIEF_TEMPLATES).forEach(k=>delete BRIEF_TEMPLATES[k]);
        Object.assign(BRIEF_TEMPLATES, data.briefTemplates);
      }
      await Promise.all([
        saveTasks(), saveLeaves(), saveProducts(), saveCategories(), savePlatforms(), saveDesignAssets(),
        saveBrandColors(), saveNotifs(), saveInternalTasks(), saveUsers(), saveDepartments(), saveDrafts(),
        saveCICategories(), saveCIGuidelines(), saveTemplates(),
      ]);
      toast('✅ Restore สำเร็จ (ครบทุกชุดข้อมูล)');
      render();
    }catch(err){ toast('❌ ไฟล์ไม่ถูกต้อง — Restore ล้มเหลว'); }
  };
  reader.readAsText(file);
}

async function handleAction(act, id){
  const t = STATE.tasks.find(x=>x.task_id===id);
  if(!t) return;
  if(act==='start'){
    const oldStatus = t.review_status;
    t.review_status='in_progress';
    // §46 Global Audit Rule: every action affecting Workflow must leave a history entry — this was the
    // one workflow-status transition (new/revision -> in_progress) that updated the database silently.
    t.review_history.push({timestamp:new Date().toISOString(), action:'START_TASK', comment:`${oldStatus} → in_progress`, by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
  }
  else if(act==='reject'){
    const reason = prompt('เหตุผลที่ Reject Task (บังคับกรอก):');
    if(!reason){ toast('ต้องระบุเหตุผล'); return; }
    t.review_status='rejected'; t.review_comment=reason;
    t.review_history.push({timestamp:new Date().toISOString(), action:'REJECT_TASK', comment:reason, by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.project_owner_email, '❌ บรีฟถูก Reject', `${t.task_name} (${t.task_id}) — เหตุผล: ${reason}`);
    notify(LEAD, '❌ บรีฟถูก Reject', `${t.assigned_user_name} reject "${t.task_name}" — ${reason}`);
  }
  else if(act==='submitReview'){
    const link = prompt('วาง AW Link:', t.aw_link||'');
    if(!link) return;
    t.aw_link = link; t.aw_delivery_timestamp = new Date().toISOString();
    t.review_status='pending_review';
    t.review_history.push({timestamp:new Date().toISOString(), action:'SUBMIT_BRIEF', comment:'AW submitted', by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.project_owner_email, '📤 งานส่งมอบแล้ว', `${t.task_name} (${t.task_id}) — ${link}`);
  }
  else if(act==='approveQC'){
    t.review_status='pending_client_review';
    t.review_history.push({timestamp:new Date().toISOString(), action:'APPROVE_QC', comment:'', by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.project_owner_email, '✓ ผ่าน QC แล้ว', `${t.task_name} รอคุณยืนยันขั้นสุดท้าย`);
  }
  else if(act==='requestRevision'){
    const comment = prompt('รายละเอียดที่ต้องแก้ไข (บังคับกรอก):');
    if(!comment){ toast('ต้องระบุคอมเมนต์ก่อนขอแก้ไข'); return; }
    t.revision_count = (t.revision_count||0)+1;
    if(t.revision_count > 3){
      t.review_status='closed_max_revision';
      toast('⛔ เกิน 3 ครั้ง — ปิด Task นี้อัตโนมัติ กรุณาเปิด Task ใหม่');
    } else {
      t.review_status='revision';
      const rateKeys = Object.keys(REVISE_RATES);
      t.revise_status = rateKeys[Math.min(t.revision_count, rateKeys.length-1)];
    }
    t.review_comment = comment;
    t.review_history.push({timestamp:new Date().toISOString(), action:'REQUEST_REVISION', comment, by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.assigned_user_name, '✎ ขอแก้ไขงาน', `${t.task_name} — ${comment}`);
  }
  else if(act==='clientApprove'){
    t.review_status='delivered';
    // Dev Spec — Backdated Task & Historical Work Migration §7/§14: an Active Backdated Task that was
    // brought into the Current Workflow (no Actual Delivery Date yet at entry) only gets one the moment it
    // genuinely completes through the normal workflow — backfilled here, never guessed at creation time.
    if(t.is_backdated && !t.actual_delivery_date) t.actual_delivery_date = todayISO();
    t.review_history.push({timestamp:new Date().toISOString(), action:'CLIENT_COMPLETE', comment:'', by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
  }
  else if(act==='requestExt'){
    const newDate = prompt('วันที่ต้องการเลื่อนไป (YYYY-MM-DD):', t.prefer_delivery_date);
    if(!newDate) return;
    const reason = prompt('เหตุผล (บังคับกรอก):');
    if(!reason){ toast('ต้องระบุเหตุผล'); return; }
    t.deadline_extension_request = {requested_date:newDate, reason, status:'PENDING'};
    // §46 Global Audit Rule — the request itself (Old Value: current delivery date -> New Value: the
    // requested date) is a Workflow-affecting action and must be recorded even before Lead Designer rules
    // on it; approveExt/rejectExt below each log their own outcome on top of this.
    t.review_history.push({timestamp:new Date().toISOString(), action:'REQUEST_EXTENSION', comment:`${fmtDate(t.prefer_delivery_date)} → ${fmtDate(newDate)} — เหตุผล: ${reason}`, by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(LEAD, '📨 คำขอเลื่อนกำหนดส่ง', `${t.assigned_user_name} ขอเลื่อน "${t.task_name}" เป็น ${fmtDate(newDate)} — ${reason}`);
    toast('ส่งคำขอเลื่อนกำหนดส่งแล้ว รอ Lead Designer พิจารณา');
  }
  else if(act==='approveExt'){
    t.prefer_delivery_date = t.deadline_extension_request.requested_date;
    t.capacity_allocation = null; // old split (if any) pointed at dates before the extension — the new date starts fresh, single-day
    t.deadline_extension_request.status='APPROVED';
    t.review_history.push({timestamp:new Date().toISOString(), action:'APPROVE_EXTENSION', comment:`New date: ${t.prefer_delivery_date}`, by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.assigned_user_name, '✓ อนุมัติเลื่อนกำหนดส่ง', `${t.task_name} — วันใหม่: ${fmtDate(t.prefer_delivery_date)}`);
  }
  else if(act==='rejectExt'){
    t.deadline_extension_request.status='REJECTED';
    t.review_history.push({timestamp:new Date().toISOString(), action:'REJECT_EXTENSION', comment:'', by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.assigned_user_name, '✕ ปฏิเสธคำขอเลื่อนกำหนดส่ง', `${t.task_name} — กำหนดส่งเดิมยังคงอยู่ ${fmtDate(t.prefer_delivery_date)}`);
  }
  else if(act==='approveUrgent'){
    t.review_status='new';
    t.assigned_user_name = t.suggested_designer || LEAD;
    t.review_history.push({timestamp:new Date().toISOString(), action:'APPROVE_QC', comment:'Approved & assigned by Lead Designer', by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.assigned_user_name, '✓ Lead Designer Approved', `"${t.task_name}" (${t.priority}) ได้รับอนุมัติแล้ว — เข้า Queue แล้ว`);
    notify(t.project_owner_email, '✓ Brief Approved', `"${t.task_name}" ได้รับอนุมัติจาก Lead Designer แล้ว มอบหมายให้ ${t.assigned_user_name}`);
    toast('✓ Approve & Assign แล้ว');
  }
  else if(act==='rejectUrgent'){
    const reason = prompt('เหตุผลที่ไม่อนุมัติ (บังคับกรอก):');
    if(!reason){ toast('ต้องระบุเหตุผล'); return; }
    t.review_status='rejected'; t.review_comment=reason;
    t.review_history.push({timestamp:new Date().toISOString(), action:'REJECT_TASK', comment:reason, by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.project_owner_email, '❌ Brief ไม่ได้รับอนุมัติ', `"${t.task_name}" — ${reason} — กรุณาแก้ Priority หรือ Delivery Date แล้วส่งใหม่`);
  }
  else if(act==='requestDateChange'){
    const reason = prompt('แจ้งเหตุผล/วันที่แนะนำให้ผู้บรีฟทราบ:');
    if(!reason){ return; }
    t.review_history.push({timestamp:new Date().toISOString(), action:'REQUEST_REVISION', comment:'Requested date/priority change: '+reason, by: STATE.auth.user?.name || STATE.auth.identity || 'system'});
    notify(t.project_owner_email, '📅 Lead Designer ขอให้เปลี่ยนวันที่/Priority', `"${t.task_name}" — ${reason}`);
    toast('แจ้งขอเปลี่ยนวันที่แล้ว');
  }
  await saveTasks();
  render();
}

/* ============================= FRAME TOOL ============================= */
// Frame Tool: merges the standalone "White Background" tool and the "Manual" frame-compositing
// mockup into one Top Nav page (placed before Products Directory). Dark-themed, scoped entirely
// under .ft-page. All state lives at STATE.frameTool and is intentionally NOT persisted (File/
// object-URL data isn't JSON-serializable, and this is a working scratch tool, not saved records).

let FT_IMG_CACHE = {};

function escapeFtHtml(value){
  return String(value==null?'':value).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function ftSigned(n){
  n = Math.round(n||0);
  return (n>0?'+':'') + n;
}
function ftFormatBytes(bytes){
  if(!bytes && bytes!==0) return '';
  if(bytes < 1024) return bytes+' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0)+' KB';
  return (bytes/(1024*1024)).toFixed(2)+' MB';
}
function ftBaseName(name){
  return String(name||'').replace(/\.[^/.]+$/, '');
}
async function ftCopyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    toast('คัดลอกแล้ว');
  }catch(e){ toast('คัดลอกไม่สำเร็จ'); }
}
function ftLimitBytes(limitKey){
  if(limitKey==='500kb') return 512000;
  if(limitKey==='1.5mb') return 1572864;
  return Infinity;
}

function ftEnsureImage(url){
  if(!url) return null;
  if(url in FT_IMG_CACHE){
    const cached = FT_IMG_CACHE[url];
    return (cached && cached!=='error' && cached!=='loading') ? cached : null;
  }
  FT_IMG_CACHE[url] = 'loading';
  const img = new Image();
  img.onload = ()=>{ FT_IMG_CACHE[url] = img; ftRedrawCanvas(); };
  img.onerror = ()=>{ FT_IMG_CACHE[url] = 'error'; };
  img.src = url;
  return null;
}

// Shared compositing routine — used identically for the live on-screen preview canvas AND the
// offscreen export canvas, so what the user sees is exactly what gets exported (no drift).
function ftDrawComposite(ctx, w, h, opts){
  const mode = opts.mode;
  ctx.clearRect(0,0,w,h);

  if(mode==='manual'){
    if(opts.bgImg){
      ctx.drawImage(opts.bgImg, 0,0,w,h);
    } else {
      ctx.fillStyle = '#151b26';
      ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#2a3547';
      ctx.setLineDash([8,6]);
      ctx.strokeRect(10,10,w-20,h-20);
      ctx.setLineDash([]);
      ctx.fillStyle = '#5b6b82';
      ctx.font = `${Math.round(w*0.032)}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('อัปโหลด Warranty Frame', w/2, h/2);
    }
  } else { // whitebg
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,w,h);
    if(opts.brandmark){
      ctx.fillStyle = '#eef1f5';
      ctx.font = `700 ${Math.round(w*0.18)}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('W', w/2, h*0.44);
      ctx.font = `600 ${Math.round(w*0.028)}px Arial`;
      ctx.fillStyle = '#e4e8ee';
      ctx.fillText('WORLDTECH', w/2, h*0.63);
      ctx.font = `${Math.round(w*0.018)}px Arial`;
      ctx.fillStyle = '#eef1f5';
      ctx.fillText('OFFICIAL STORE', w/2, h*0.665);
      ctx.textBaseline = 'alphabetic';
    }
  }

  const area = opts.areaPct || {x:0.1,y:0.1,w:0.8,h:0.8};
  const ax = area.x*w, ay = area.y*h, aw = area.w*w, ah = area.h*h;

  if(opts.showGuide){
    ctx.strokeStyle = 'rgba(63,133,246,0.55)';
    ctx.setLineDash([6,5]);
    ctx.lineWidth = 2;
    ctx.strokeRect(ax,ay,aw,ah);
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
  }

  const item = opts.productItem;
  if(!item){
    ctx.fillStyle = '#5b6b82';
    ctx.font = `${Math.round(w*0.026)}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('นำเข้ารูปสินค้า', w/2, ay+ah/2);
    return;
  }

  const tr = item.transform || {scale:100,x:0,y:0};
  const img = item._img || (item.previewUrl ? ftEnsureImage(item.previewUrl) : null);

  if(img){
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if(iw && ih){
      const fit = Math.min(aw/iw, ah/ih);
      let dw = iw*fit, dh = ih*fit;
      dw *= (tr.scale||100)/100;
      dh *= (tr.scale||100)/100;
      const cx = ax + aw/2 + (tr.x||0)/100*aw;
      const cy = ay + ah/2 + (tr.y||0)/100*ah;
      ctx.drawImage(img, cx-dw/2, cy-dh/2, dw, dh);
    }
  } else {
    // Demo/placeholder asset (Drive/Product-search results with no real image data)
    const pw = aw*((tr.scale||100)/100)*0.7, ph = ah*((tr.scale||100)/100)*0.7;
    const cx = ax + aw/2 + (tr.x||0)/100*aw;
    const cy = ay + ah/2 + (tr.y||0)/100*ah;
    ctx.fillStyle = mode==='manual' ? '#1c2536' : '#eef1f6';
    ctx.strokeStyle = mode==='manual' ? '#33415a' : '#d7dee7';
    ctx.lineWidth = 1.5;
    ctx.fillRect(cx-pw/2, cy-ph/2, pw, ph);
    ctx.strokeRect(cx-pw/2, cy-ph/2, pw, ph);
    ctx.fillStyle = mode==='manual' ? '#8a97ac' : '#8f99a8';
    ctx.font = `${Math.round(w*0.022)}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(escapeFtHtml ? (item.name||'PRODUCT') : (item.name||'PRODUCT'), cx, cy);
  }
}
